<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中信建投研究所晨报及研报看板</title>
<style>
:root {
  --bg: #f8fafc; --surface: #fff; --surface2: #f1f5f9; --border: #e2e8f0;
  --text: #0f172a; --text2: #475569; --text3: #94a3b8;
  --accent: #2563eb; --accent-text: #fff;
  --success: #15803d; --warning: #ca8a04; --danger: #dc2626; --info: #64748b;
  --shadow: 0 1px 3px rgba(15,23,42,.08);
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1220; --surface: #111827; --surface2: #1e293b; --border: #334155;
    --text: #f1f5f9; --text2: #94a3b8; --text3: #64748b;
    --accent: #3b82f6; --shadow: 0 1px 3px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"] {
  --bg: #0b1220; --surface: #111827; --surface2: #1e293b; --border: #334155;
  --text: #f1f5f9; --text2: #94a3b8; --text3: #64748b;
  --accent: #3b82f6; --shadow: 0 1px 3px rgba(0,0,0,.35);
}
* { box-sizing: border-box; }
body {
  margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.5;
}
button, input { font: inherit; }
a { color: var(--accent); }
.wrap { max-width: 1440px; margin: 0 auto; padding: 20px 16px 48px; }
header {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
  margin-bottom: 20px; flex-wrap: wrap;
}
.header-main { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1 1 320px; }
h1 { margin: 0; font-size: 1.6rem; font-weight: 700; }
.module-head {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: 10px 16px; margin-bottom: 10px;
}
.module-head > h2 { margin: 0; font-size: 1.05rem; }
.module-date {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
}
.module-date .filter-label { margin: 0; }
#morning-pdf-slot {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
}
#morning-pdf-slot .btn-pdf-open {
  padding: 5px 10px; font-size: .78rem; max-width: 220px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
h2 { margin: 0 0 10px; font-size: 1.15rem; font-weight: 700; }
h3 { margin: 0 0 8px; font-size: .95rem; font-weight: 700; }
.muted { color: var(--text2); font-size: .875rem; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 16px; margin-bottom: 16px;
}
.sub-card {
  background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px 16px; margin-top: 12px;
}
.sub-card-head {
  display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
  margin: 0 0 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border);
}
.sub-card-head h2 { margin: 0; font-size: 1rem; font-weight: 700; }
.sub-card-body { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.stat { background: var(--surface2); border-radius: 8px; padding: 10px 12px; }
.stat .label { font-size: .75rem; color: var(--text3); }
.stat .value { font-size: 1.1rem; font-weight: 700; }
.theme-toggle {
  border: 1px solid var(--border); background: var(--surface2); color: var(--text);
  border-radius: 8px; padding: 6px 12px; cursor: pointer;
}
.cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.cal-nav button {
  border: none; background: var(--surface2); color: var(--text); width: 32px; height: 32px;
  border-radius: 8px; cursor: pointer;
}
.cal-weekdays, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.cal-weekdays span { font-size: .75rem; color: var(--text3); padding: 4px 0; }
.cal-day {
  width: 100%; aspect-ratio: 1; max-width: 40px; margin: 0 auto;
  border: none; border-radius: 8px; cursor: default; font-size: .85rem;
  background: var(--surface2); color: var(--text3); opacity: .45;
}
.cal-day.has-data { opacity: 1; color: var(--text); cursor: pointer; background: var(--surface2); }
.cal-day.has-data:hover { background: var(--border); }
.cal-day.selected { background: var(--accent) !important; color: var(--accent-text) !important; opacity: 1; }
.pill {
  display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px;
  font-size: .75rem; font-weight: 600; border: 1px solid var(--border); background: var(--surface2);
}
.pill.j-success { background: #dcfce7; color: #15803d; border-color: #86efac; }
.pill.j-warning { background: #fef9c3; color: #a16207; border-color: #fde047; }
.pill.j-info { background: #f1f5f9; color: #64748b; border-color: #cbd5e1; }
.pill.j-danger { background: #fee2e2; color: #b91c1c; border-color: #fca5a5; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .pill.j-success { background: #14532d; color: #86efac; border-color: #166534; }
  :root:not([data-theme="light"]) .pill.j-warning { background: #713f12; color: #fde047; border-color: #a16207; }
  :root:not([data-theme="light"]) .pill.j-info { background: #1e293b; color: #94a3b8; border-color: #475569; }
  :root:not([data-theme="light"]) .pill.j-danger { background: #7f1d1d; color: #fca5a5; border-color: #991b1b; }
}
:root[data-theme="dark"] .pill.j-success { background: #14532d; color: #86efac; border-color: #166534; }
:root[data-theme="dark"] .pill.j-warning { background: #713f12; color: #fde047; border-color: #a16207; }
:root[data-theme="dark"] .pill.j-info { background: #1e293b; color: #94a3b8; border-color: #475569; }
:root[data-theme="dark"] .pill.j-danger { background: #7f1d1d; color: #fca5a5; border-color: #991b1b; }
.ticker-pill {
  display: inline-flex; padding: 2px 7px; border-radius: 999px; font-size: .72rem;
  font-weight: 600; border: 1px solid currentColor; margin: 2px 4px 2px 0;
}
.lead-item { padding: 10px 0; border-bottom: 1px solid var(--border); }
.lead-item:last-child { border-bottom: none; }
.lead-item .lead-head-row {
  margin-bottom: 4px;
  align-items: baseline;
}
.lead-item .lead-title {
  font-weight: 700;
  line-height: 1.45;
  white-space: normal;
  overflow: visible;
  word-break: break-word;
}
.lead-item .lead-src-title {
  color: var(--text2);
  font-size: .875rem;
  font-weight: 600;
  line-height: 1.45;
  margin: 0 0 4px;
  white-space: normal;
  overflow: visible;
  word-break: break-word;
}
.lead-item .lead-text {
  color: var(--text2);
  font-size: .875rem;
  line-height: 1.55;
  white-space: normal;
  overflow: visible;
  word-break: break-word;
}
.lead-tag {
  display: inline-flex; align-items: center; font-size: .78rem; font-weight: 700;
  color: var(--accent); white-space: nowrap;
}
.macro-block { margin-bottom: 12px; }
.macro-block ul { margin: 6px 0 0; padding-left: 18px; color: var(--text2); font-size: .875rem; }
.tabs { display: flex; gap: 6px; margin-bottom: 12px; }
.tab {
  border: 1px solid var(--border); background: var(--surface2); color: var(--text2);
  padding: 6px 14px; border-radius: 8px; cursor: pointer;
}
.tab.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
table { width: 100%; border-collapse: collapse; font-size: .82rem; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { color: var(--text3); font-weight: 600; font-size: .75rem; }
tr:hover td { background: var(--surface2); }
.btn-link {
  border: 1px solid var(--border); background: var(--surface2); color: var(--accent);
  padding: 3px 10px; border-radius: 6px; cursor: pointer; font-size: .75rem;
}
.btn-link:hover { background: var(--border); }
.detail-section { margin-bottom: 14px; }
.detail-section h4 { margin: 0 0 6px; font-size: .88rem; }
.detail-section ul { margin: 0; padding-left: 18px; color: var(--text2); font-size: .85rem; }
.report-detail-row td {
  background: var(--surface2); padding: 12px 14px !important;
  border-bottom: 1px solid var(--border);
}
.report-detail-panel {
  border: 1px solid var(--border); border-radius: 8px;
  padding: 12px 14px; background: var(--surface);
}
.report-detail-panel h3 { margin: 0 0 10px; font-size: .95rem; }
.stock-picker { position: relative; display: inline-block; max-width: 100%; margin: 4px 0 14px; }
.stock-trigger {
  border: 1px solid var(--border); background: var(--surface2); color: var(--text);
  border-radius: 8px; padding: 8px 14px; cursor: pointer; font-size: .9rem; font-weight: 600;
  min-width: 260px; max-width: 100%; text-align: left;
}
.stock-trigger:hover { border-color: var(--accent); }
.stock-trigger.open {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 25%, transparent);
}
.stock-popover {
  position: absolute; top: calc(100% + 6px); left: 0; z-index: 60;
  width: min(360px, 92vw); max-height: 360px; display: flex; flex-direction: column;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: 0 8px 24px rgba(15,23,42,.12); overflow: hidden;
}
.stock-search {
  border: none; border-bottom: 1px solid var(--border); padding: 10px 12px;
  background: var(--surface2); color: var(--text); width: 100%; outline: none;
}
.stock-options { overflow: auto; flex: 1; max-height: 280px; }
.stock-option {
  display: block; width: 100%; text-align: left; border: none; background: transparent;
  color: var(--text); padding: 9px 12px; cursor: pointer; font-size: .88rem;
}
.stock-option:hover, .stock-option.active { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.stock-option .sym { color: var(--text3); margin-left: 8px; font-weight: 500; }
.stock-track-item, .hotspot-track-item {
  border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px;
  margin-bottom: 10px; background: var(--surface2);
}
.stock-track-item:last-child, .hotspot-track-item:last-child { margin-bottom: 0; }
.hotspot-pill {
  display: inline-flex; padding: 1px 8px; border-radius: 999px; font-size: .72rem;
  font-weight: 600; border: 1px solid var(--border); background: var(--surface);
  color: var(--text2); margin: 2px 4px 2px 0;
}
.recommend-bar { margin: 0 0 14px; }
.recommend-label {
  font-size: .75rem; font-weight: 700; color: var(--text3); margin-bottom: 8px;
}
.recommend-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.recommend-chip {
  border: 1px solid var(--border); background: var(--surface2); color: var(--text2);
  border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: .82rem; font-weight: 600;
}
.recommend-chip:hover { border-color: var(--accent); color: var(--accent); }
.recommend-chip.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.recommend-chip .cnt { opacity: .85; margin-left: 6px; font-weight: 500; }
.pdf-embed { width: 100%; height: 520px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface2); margin-top: 8px; }
.pdf-block { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); }
.pdf-reader-page {
  position: fixed; inset: 0; z-index: 2000; background: var(--bg);
  display: flex; flex-direction: column; padding: 16px; box-sizing: border-box;
}
.pdf-reader-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.pdf-reader-bar h2 { margin: 0; font-size: .95rem; font-weight: 600; flex: 1; line-height: 1.4; }
.pdf-reader-frame {
  flex: 1; width: 100%; min-height: 0; border: 1px solid var(--border);
  border-radius: 8px; background: var(--surface2);
}
.btn-pdf-open {
  display: inline-flex; align-items: center; text-align: left; padding: 8px 14px; border-radius: 8px;
  border: 1px solid var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent);
  color: var(--accent); font-size: .85rem; font-weight: 600; cursor: pointer; max-width: 100%;
  word-break: break-word;
}
button.btn-pdf-open { font: inherit; }
.btn-pdf-open:hover { text-decoration: underline; }
.xlsx-reader-page {
  position: fixed; inset: 0; z-index: 2000; background: var(--bg);
  display: flex; flex-direction: column; padding: 16px; box-sizing: border-box;
}
.xlsx-sheet-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.xlsx-sheet-tab {
  border: 1px solid var(--border); background: var(--surface2); color: var(--text2);
  padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: .78rem;
}
.xlsx-sheet-tab.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.xlsx-table-wrap {
  flex: 1; overflow: auto; border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface2); min-height: 0;
}
.xlsx-table { border-collapse: collapse; font-size: .75rem; min-width: 100%; }
.xlsx-table td { border: 1px solid var(--border); padding: 3px 6px; white-space: nowrap; }
.xlsx-table tr:first-child td { background: var(--surface); font-weight: 600; }
.gloss-term {
  border-bottom: 1px dashed var(--accent); cursor: help; position: relative;
}
.gloss-term:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.gloss-tip {
  display: none; position: fixed; z-index: 9999; max-width: 280px;
  background: #1e293b; color: #f8fafc; font-size: .78rem; line-height: 1.45;
  padding: 8px 10px; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.25);
  pointer-events: none;
}
.gloss-tip.visible { display: block; }
.layout {
  display: grid;
  grid-template-columns: minmax(0, 1.45fr) minmax(320px, 0.9fr);
  gap: 16px;
  align-items: start;
}
.side-rail { display: flex; flex-direction: column; gap: 0; min-width: 0; }
.side-rail .card { margin-bottom: 16px; }
.side-rail .card:last-child { margin-bottom: 0; }
.side-rail .stock-trigger { min-width: 0; width: 100%; }
@media (max-width: 980px) {
  .layout { grid-template-columns: 1fr; }
}
#morning-brief { margin-bottom: 16px; }
#ms-day-detail .filter-bar {
  margin: 0 0 14px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.morning-day {
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}
.morning-day:last-child { border-bottom: none; }
.morning-day-head {
  display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline;
  margin-bottom: 10px;
}
.morning-day-head .morning-title { font-weight: 700; line-height: 1.4; }
.morning-sec { margin-top: 12px; }
.morning-sec > h3 {
  margin: 0 0 8px; font-size: .92rem; font-weight: 700;
  color: var(--text);
}
.morning-view {
  padding: 8px 0;
  border-top: 1px dashed var(--border);
}
.morning-view:first-of-type { border-top: none; padding-top: 0; }
.morning-view-meta {
  display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline;
  margin-bottom: 4px; font-size: .8rem; color: var(--text2);
}
.morning-view-meta .sector-tag {
  color: var(--accent); font-weight: 700;
}
.morning-view-title {
  font-weight: 700; line-height: 1.45; margin: 0 0 4px;
}
.morning-view-summary {
  color: var(--text2); font-size: .875rem; line-height: 1.55;
  word-break: break-word;
}
.morning-stock-compact {
  display: flex; flex-wrap: wrap; gap: 2px 16px;
  font-size: .82rem; line-height: 1.45; color: var(--text2);
}
.morning-stock-compact .stock-line { white-space: normal; }
.morning-stock-compact .sec {
  font-weight: 700; color: var(--accent); margin-right: 4px;
}
.morning-stock-compact .sym {
  font-size: .74rem; opacity: .8; margin-left: 2px;
}
.morning-sec.morning-sec-stocks { margin-top: 8px; }
.morning-sec.morning-sec-stocks > h3 { margin-bottom: 4px; font-size: .85rem; }
.hidden { display: none !important; }

.broker-bar { display: none; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; }
.broker-bar.visible { display: flex; }
.broker-chip {
  border: 1px solid var(--border); background: var(--surface2); color: var(--text2);
  border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: .85rem; font-weight: 600;
}
.broker-chip.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.broker-chip .cnt { opacity: .85; margin-left: 6px; font-weight: 500; }
.broker-pill {
  display: inline-flex; align-items: center; padding: 1px 7px; border-radius: 999px;
  font-size: .7rem; font-weight: 700; border: 1px solid currentColor; margin-right: 4px;
}
.broker-pill.csc { color: #1d4ed8; }
.broker-pill.cicc { color: #b45309; }
.broker-pill.citics { color: #be123c; }
.cal-day { position: relative; }
.cal-dots {
  position: absolute; left: 0; right: 0; bottom: 3px;
  display: flex; justify-content: center; gap: 2px; pointer-events: none;
}
.cal-dots i { width: 4px; height: 4px; border-radius: 50%; display: block; }
.filter-bar {
  display: flex; flex-wrap: wrap; gap: 20px 28px; align-items: flex-start;
  margin-bottom: 16px;
}
.filter-section { display: flex; flex-direction: column; gap: 8px; min-width: 0; flex: 1 1 280px; }
.filter-label { font-size: .75rem; font-weight: 700; color: var(--text3); letter-spacing: .02em; }
.folder-bar {
  display: none; flex-wrap: wrap; gap: 8px; margin: 0;
}
.folder-bar.visible { display: flex; }
.folder-chip {
  border: 1px solid var(--border); background: var(--surface2); color: var(--text2);
  border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: .82rem; font-weight: 600;
}
.folder-chip.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.folder-chip .cnt { opacity: .85; margin-left: 6px; font-weight: 500; }
.date-picker { position: relative; display: inline-block; max-width: 100%; }
.date-trigger {
  border: 1px solid var(--border); background: var(--surface2); color: var(--text);
  border-radius: 8px; padding: 7px 14px; cursor: pointer; font-size: .88rem; font-weight: 600;
  min-width: 200px; max-width: 100%; text-align: left;
}
.date-trigger:hover { border-color: var(--accent); }
.date-trigger.open {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 25%, transparent);
}
.date-popover {
  position: absolute; top: calc(100% + 6px); left: 0; z-index: 50;
  width: 300px; padding: 12px; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: 0 8px 24px rgba(15,23,42,.12);
}
.date-popover-hint { font-size: .75rem; color: var(--text3); margin: 0 0 8px; }
.date-popover-top {
  display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px;
}
.date-all-chip {
  border: 1px solid var(--border); background: var(--surface2); color: var(--text2);
  border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: .82rem; font-weight: 600;
}
.date-all-chip.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.date-popover-actions {
  display: flex; justify-content: space-between; gap: 8px; margin-top: 10px; padding-top: 8px;
  border-top: 1px solid var(--border);
}
.cal-day.in-range { background: color-mix(in srgb, var(--accent) 18%, var(--surface2)); color: var(--text); opacity: 1; }
.cal-day.range-endpoint { background: var(--accent) !important; color: var(--accent-text) !important; opacity: 1; }
.cal-day.pending { outline: 2px solid var(--accent); outline-offset: -2px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="header-main">
      <h1>中信建投研究所晨报及研报看板</h1>
      <div class="muted" id="board-meta"></div>
      <div class="muted" id="updated-at"></div>
    </div>
    <button class="theme-toggle" id="theme-toggle" type="button">切换主题</button>
  </header>

  <div class="broker-bar" id="broker-bar" role="tablist" aria-label="券商筛选"></div>

  <section class="card" id="morning-brief" aria-label="晨会纪要">
    <div class="module-head">
      <h2>晨会纪要</h2>
      <div class="module-date">
        <div id="morning-pdf-slot"></div>
        <div class="filter-label">日期区间</div>
        <div class="date-picker" id="morning-date-picker">
          <button type="button" class="date-trigger" id="morning-date-trigger" aria-haspopup="dialog" aria-expanded="false">选择日期区间</button>

n调用打造第二曲线.pdf","pdf_path":"C:/ai/reports/research-board/中信建投研报合集/通信及人工智能&科技前瞻/【中信建投通信】迅策（3317）：收入高增，Token调用打造第二曲线.pdf","broker_id":"csc","broker_name_zh":"中信建投","source_folder":"通信及人工智能&科技前瞻"}]},"20260628":{"batch":{"date":"20260628","date_label":"2026年6月28日","report_count":1,"coverage_tags":["全球AI"]},"macro_sections":[],"lead_bullets":[{"order":1,"headline":"光棒扩产潮无需过度担忧","tickers":[{"symbol":"300308.SZ","sentiment":"看好"},{"symbol":"300502.SZ","sentiment":"看好"},{"symbol":"600487.SH","sentiment":"看好"}],"judgment":"看好","text":"光纤涨价推动多家光棒扩产，但多数经验不足、产能多在明年下半年后释放，对今明供需冲击有限；AI需求仍可能更强。持续看好AI算力链，关注光模块与光纤相关标的。","source_folder":"通信及人工智能&科技前瞻","report_id":"r0628-guangbang","tag":"行业深度"}],"reports":[{"id":"r0628-guangbang","title_zh":"光棒扩产潮无需过度担忧，GPT-5.6 发布，持续推荐 AI 产业链","type":"sector","sector":"通信","market":"CN","tickers":["300308.SZ","300502.SZ","600487.SH"],"priority":"⭐⭐","ms_rating":"","target_price":"","one_liner":"光棒及光纤扩产潮来袭。今年以来，光纤价格大幅上涨，投资回 报率显著提升，推动亨通光电、远东股份、通鼎互联、合盛硅 业、大族激光等启动光棒扩产计划。我们认为，AI 的发展对光纤 的需求拉动明显，目前行业依然供不应求。虽然多家公司计划扩 产，但一是多数公司过往光棒制造经验较少，是否可以如期扩产 仍需观察，二是即使如期扩产，但大部分产能释放要在明年下半 年或者更晚，因此对于今年、甚至明年的行业供需格局影响不 大，而且AI 的需求也可能更为强劲，因此短期内无需过度担忧。","user_judgment":"看好","order":1,"pdf_name":"【中信建投通信】光棒扩产潮无需过度担忧，GPT－5．6发布，持续推荐AI产业链.pdf","pdf_path":"C:/ai/reports/research-board/中信建投研报合集/通信及人工智能&科技前瞻/【中信建投通信】光棒扩产潮无需过度担忧，GPT－5．6发布，持续推荐AI产业链.pdf","broker_id":"csc","broker_name_zh":"中信建投","source_folder":"通信及人工智能&科技前瞻"}]},"20260629":{"batch":{"date":"20260629","date_label":"2026年6月29日","report_count":1,"coverage_tags":["互联网"]},"macro_sections":[],"lead_bullets":[{"order":1,"headline":"腾讯AI生产力工具布局先锋","tickers":[{"symbol":"0700.HK","sentiment":"看好"}],"judgment":"看好","text":"WorkBuddy于2026年3月推出，按日活已成国内第一办公效率智能体，依托多模型、场景技能与腾讯生态打通。微信侧生活助手与B端生产力布局清晰，维持买入评级。","source_folder":"全球AI创新与互联网","report_id":"r0629-tencent","tag":"公司跟踪"}],"reports":[{"id":"r0629-tencent","title_zh":"腾讯控股（0700）：WorkBuddy——腾讯 AI 生产力工具布局先锋","type":"company","sector":"互联网","market":"HK","tickers":["0700.HK"],"priority ource_folder":"通信及人工智能&科技前瞻"},{"id":"csc-r0701-3c2aa0","title_zh":"“六张网”投资规模全景测算与产业链受益路径探析","type":"macro","sector":"宏观-政策研究","market":"CN","tickers":[],"priority":"⭐⭐⭐","ms_rating":"","target_price":"","one_liner":"“六张网”是“十五五”时期我国基础设施投资的顶层统筹框架， 标志着基建投资从传统“铁公基”模式，向覆盖全要素、网络化、重安 全韧性的现代化体系实现范式升级。本文测算“十五五”时期“六张网” 核心领域累计投资规模区间约为24.1 万亿元至29.2 万亿元，基准情景 下约26.4 万亿元，年均5.3 万亿元；整体呈现“地下管网大幅跃升、数 字与电力基建稳步抬升、传统民生类板块绝对增长但占比回落”的结构 特征与“前高后稳、结构分化”的节奏特征，资金端形成“财政核心牵 引+央企中坚支撑+社会资本重要补充”的三层架构。","user_judgment":"跟踪","order":2,"pdf_name":"【中信建投政策研究】“六张网”投资规模全景测算与产业链受益路径探析.pdf","pdf_path":"C:/ai/reports/research-board/中信建投研报合集/宏观-政策研究/【中信建投政策研究】“六张网”投资规模全景测算与产业链受益路径探析.pdf","broker_id":"csc","broker_name_zh":"中信建投","source_folder":"宏观-政策研究","hotspot_tags":["十五五","政策改革"]},{"id":"csc-r0701-f7a361","title_zh":"情绪大幅震荡，结构分化加剧——市场情绪跟踪6月报","type":"sector","sector":"投资策略","market":"CN","tickers":[],"priority":"⭐⭐","ms_rating":"","target_price":"","one_liner":"6 月初，受美联储鹰派信号及科技板块获利回吐影响，情绪指数 延续上月下滑趋势。6 月8 日情绪指数降至55 附近后市场开启低 位反弹，这也符合牛市中情绪指数降至50-55 附近时，市场往往 展开反弹行情的经验规律。随后市场情绪大幅震荡，6 月11 日情 绪指数最低降至44 以下，之后大幅回升，在6 月23 日升至73 以 上。此后，随着市场结构分化加剧，情绪指数再度回落，6 月26 日又一次接近55 并触发反弹行情。","user_judgment":"跟踪","order":3,"pdf_name":"【中信建投投资策略研究】情绪大幅震荡，结构分化加剧——市场情绪跟踪6月报.pdf","pdf_path":"C:/ai/reports/research-board/中信建投研报合集/投资策略/【中信建投投资策略研究】情绪大幅震荡，结构分化加剧——市场情绪跟踪6月报.pdf","broker_id":"csc","broker_name_zh":"中信建投","source_folder":"投资策略"},{"id":"csc-r0701-24-045b","title_zh":"聚和材料（688503）：国产空白掩模版先行者，致力于打造泛半导体材料平台","type":"company","sector":"电力设备与新能源","market":"","tickers":["688503"],"priority":"⭐⭐","ms_rating":"","target_price":"","one_liner":"光伏银浆龙头地位稳固，致力于打造泛半导体材料平台。公司通过收购SK Enpluse旗下空白掩模版进军半导体领域，制程覆盖18-90nm节点，已通过SK海 力士、TMC、迪思微、中微掩模等客户验证并实现批量销售；AI时代芯片多样化+超级扩产周期共振，制程升级驱动空白掩模版量价倍数级增长；目前国内空白掩模国 产化率几乎为零，将直接受益中韩半导体景气周期。","user_judgment":"跟踪","order":24,"pdf_name":"【中信建投】聚和材料（688503）：国产空白掩模版先行者，致力于打造泛半导体材料平台.pdf","pdf_path":"C:/ai/reports/research-board/中信建投研报合集/电力设备与新能源/【中信建投】聚和材料（688503）：国产空白掩模版先行者，致力于打造泛半导体材料平台.pdf","broker_id":"cs 25","tag":"周报"},{"order":4,"tag":"深度报告","headline":"城市更新“十五五”规划解读与投资机遇分析","tickers":[],"judgment":"跟踪","text":"首部国家级城市更新专项规划落地，“十五五”全口径市场约15万亿元，承接稳增长与地产下行对冲。政策转向存量提质，利润向检测设计与运营两端迁移，宜关注全链条龙头。","source_folder":"宏观-政策研究","report_id":"csc-r0705-3fed36"},{"order":5,"tag":"周报","headline":"全球大类资产周观点","tickers":[],"judgment":"跟踪","text":"十年中债是否反弹成焦点：长期看中外利率中枢已分化重塑；中期地产对利率下压缓解；短期2–5月流动性宽松退潮，预估债市利率上行，此前债牛暂告段落。","source_folder":"宏观研究","report_id":"csc-r0705-b4cd08"},{"order":6,"tag":"行业跟踪","headline":"供需趋紧钠电放量，格局优异铝箔可期","tickers":[],"judgment":"跟踪","text":"铝箔环节作为锂电材料中小而美的赛道，一方面行业竞争格局集 中，龙头市占率38%左右，另一方面今年以来铝箔对客户的涨价 落地覆盖度高，加工费的累计涨幅达到1000-1500 元/吨，且我们 测算2026 下半年到2027 年铝箔行业供需仍将持续改善，为后续 的涨价奠定基础。同时，钠离子电池商业化进展进入从1 到10 的阶段，铝箔环节技术路线确定、单位用量翻倍，将充分受益。","source_folder":"电力设备与新能源","report_id":"csc-r0705-28-9fdb","broker_id":"csc"},{"order":7,"tag":"行业跟踪","headline":"加息预期纠偏，有色触底回升","tickers":[],"judgment":"跟踪","text":"周四美国6 月非农就业数据全面不及预期，不仅新增就业仅5.7 万，且5 月和4 月数据双双下修，该数据令市场对美联储年内加息预期显著降温，美元和美债收 益率承压，黄金领衔工业金属反弹，被压制已久的有色板块表现亮眼。我们一直 强调，工业金属的基本面良好，在供应干扰及下游消费边际改善的情况下。铜、 锡、铝维持大幅去库。","source_folder":"金属及金属材料","report_id":"csc-r0705-39-845e","broker_id":"csc"},{"order":8,"tag":"行业跟踪","headline":"现货收紧需求预期走高，稀土价格有望上行","tickers":[],"judgment":"谨慎","text":"稀土：周内稀土价格继续上行，氧化镨钕周涨幅3.05%，由于废 料趋紧，回收企业开工率下降，导致稀土产量整体下调，据SMM， 6 月氧化镨钕产量下降约6%，再生氧化镨钕占氧化镨钕总产量的 比例，已由五月的44%降至本月的37%。供给端整体偏紧，短期 难有增量预期。","source_folder":"金属及金属材料","report_id":"csc-r0705-44-b752","broker_id":"csc"}],"reports":[{"id":"r0705-ai-weekly","title_zh":"全球AI周观点：DeepSeek 将实施波峰波谷定价，Meta 拟出售富余算力","type":"sector","sector":"全球AI/互联网","market":"GLOBAL","tickers":["META","0700.HK"],"priority":"⭐⭐⭐","ms_rating":"","target_price":"","one_liner":"国产开源模型能力提升中，与海外模型差距在拉近；其性价比优势也 更多被海外认知到，坚定看好AI产业趋势及国产模型。本周Meta 筹 建云基础设施业务的报道引发市场对Capex 增长的担忧，同时市场对 AI 需求和大模型公司收入增长斜率放缓的担心也在继续。我们认为： 1）token 消耗优化是短期温和调整，并不意味着AI 需求增长乏力。据Evidence Lab，仅8%的企业已在生产环境中大规模部署AI Agent。","user_judgment":"看好","order":1,"pdf_name":"【中信建投全球AI创新与互联网】周观点：DeepSeek将实施波峰波谷定价，Meta拟筹建云基础设施业务出售富余算力.pdf"," id":"csc-r0723-9ca8c7"},{"order":4,"tag":"深度报告","headline":"地缘追踪框架","tickers":[],"judgment":"跟踪","text":"美伊霍尔木兹摩擦源于备忘录执行后的制度空白，通航争议升级为控制权之争。持续封锁难成终局，或现双航道、收费开放或美主导自由航行；地缘主导供给，油价或在70至100美元区间反复拉扯。","source_folder":"宏观研究","report_id":"csc-r0723-01b4d7"},{"order":5,"tag":"公司点评","headline":"中国船舶高价订单集中交付推动盈利提升","tickers":[{"symbol":"600150","sentiment":"跟踪"}],"judgment":"跟踪","text":"公司预计2026 年上半年实现归母净利润92—110 亿元，按吸收 合并后的重述口径同比增长143.56%—191.21%；扣非归母净利润 90—108 亿元，同比增长211.34%—273.61%，主营业务盈利改善 更为明显。按一季度业绩倒算，2026Q2 预计实现归母净利润 43.68—61.68 亿元，同比增长81.75%—156.66%，中值约52.68 亿 元，环比增长约9.0%。","source_folder":"军工及新材料","report_id":"csc-r0723-01-f178","broker_id":"csc"}],"reports":[{"id":"r0723-meta","title_zh":"Meta（META）：AI 构筑主业基石，云服务打开增长空间","type":"company","sector":"信息服务","market":"US","tickers":["META"],"priority":"⭐⭐⭐","ms_rating":"","target_price":"","one_liner":"Meta 近期将Spark 1.1 通过Meta Model API 向美国开发者开 放测试，该模型定位面向agentic 任务的多模态推理模型；同时推 出首款AI 图像模型Muse Image，有望与广告生产工具协同，助 力业务增长。此外还披露下一代闭源模型“Watermelon”和首款 AI 视频模型Muse Video 的计划。云服务有望成为新的增长曲线：扩建数据中心、锁定新兴云 厂产能、提高资本开支，通过实际行动回应AI 算力过剩的担忧。","user_judgment":"看好","order":1,"pdf_name":"【中信建投全球AI创新与互联网】脸书（META PLATFORMS）（META）：AI构筑主业基石，云服务打开增长空间.pdf","pdf_path":"C:/ai/reports/research-board/中信建投研报合集/全球AI创新与互联网/【中信建投全球AI创新与互联网】脸书（META PLATFORMS）（META）：AI构筑主业基石，云服务打开增长空间.pdf","broker_id":"csc","broker_name_zh":"中信建投","source_folder":"全球AI创新与互联网"},{"id":"csc-r0723-cnai","broker_id":"csc","broker_name_zh":"中信建投","title_zh":"从战略防御到主动出击：国产 AI 基础设施的价值升级","type":"sector","sector":"半导体/AI基础设施","market":"CN","tickers":["688041.SH","000063.SZ"],"priority":"⭐⭐⭐","ms_rating":"强于大市","target_price":"","one_liner":"在出口管制持续收紧与国产替代制度性红利共振下，国产AI 芯 片正从\"政策采购标的\"向\"市场化主动选择\"跃迁，未来几年是从 规模验证走向盈利兑现的关键窗口。我们看到供给端国产芯片产 能持续释放，需求端推理负载爆发（日均Token 调用量两年增逾 千倍）与头部CSP 持续加码的资本开支（阿里FY26 达1,261 亿 元、字节2025E 约1,600 亿）为国产芯片提供确定性需求锚。","user_judgment":"看好","order":1,"pdf_name":"【中信建投海外研究】从战略防御到主动出击，国产AI基础设施的价值升级.pdf","pdf_path":"C:/ai/reports/research-board/中信建投研报合集/海外研究/【中信建投海外研究】从战略防御到主动出击，国产AI基础设施的价值升级.pdf","source_folder":"海外研究"},{"id":"csc-r0723-9ca8c7","title_zh":"沃什政策框架的首次集中检验——从通胀数据、国会听证到美联储褐皮书","type":"macro","sector":"宏观-政策研究","market":"CN","tickers":[],"priority":"⭐⭐⭐","ms_rating":"","target_price":"","one_liner":"沃什上任后的政策变化，核心并非立即加息，而是以“第一性原理” 重新审视美联储货币政策框架。7 月国会听证和《货币政策报告》显示， 五个工作组相关议题已由主席倡议进入美联储内部研究和政策评估范 围；6 月CPI、PPI 与褐皮书则表明，通胀短期降温但生产端成本仍有黏 性，经济与就业保持韧性但结构分化明显。我们认为，沃什当前政策取 向可概括为“目标偏鹰、判断审慎、路径开放”：短期维持利率仍是基 准情景，后续方向取决于价格压力是否扩散、AI 需求能否被供给和生 产率提升吸收，以及就业和需求是否持续恶化。","user_judgment":"跟踪","order":3,"pdf_name":"【中信建投政策研究】沃什政策框架的首次集中检验——从通胀数据、国会听证到美联储褐皮书.pdf","pdf_path":"C:/ai/reports/research-board/中信建投研报合集/宏观-政策研究/【中信建投政策研究】沃什政策框架的首次集中检验——从通胀数据、国会听证到美联储褐皮书.pdf","broker_id":"csc","broker_name_zh":"中信建投","source_folder":"宏观-政策研究","hotspot_tags":["美联储","通胀","政策改革","就业"]},{"id":"csc-r0723-01b4d7","title_zh":"【中信建投宏观·周君芝团队】霍尔木兹的未来可能性——地缘追踪框架（5）","type":"macro","sector":"宏观研究","market":"CN","tickers":[],"priority":"⭐⭐⭐","ms_rating":"","target_price":"","one_liner":"美伊围绕霍尔木兹摩擦升级，并非协议破裂，而是备忘录进入执 行阶段后，海峡管理权、执法权与安全保障机制等制度空白集中 暴露，通航安排争议升级为控制权之争。霍尔木兹持续封锁难以成为稳定终局，未来通行模式可能有三 种：伊朗—阿曼双航道管理、伊朗收费开放，美国主导自由航行， 目前我们无法判断哪种可能性更高。长期中东多国将加大管道建设绕行，降低长期对海峡的单一依赖 度过高风险。霍尔木兹海峡控制权问题是中东安全架构重塑的关键节点，同时 也是难点之一。","user_judgment":"跟踪","order":4,"pdf_name":"【中信建投宏观研究】【中信建投宏观·周君芝团队】霍尔木兹的未来可能性——地缘追踪框架（5）.pdf","pdf_path":"C:/ai/reports/research-board/中信建投研报合集/宏观研究/【中信建投宏观研究】【中信建投宏观·周君芝团队】霍尔木兹的未来可能性——地缘追踪框架（5）.pdf","broker_id":"csc","broker_name_zh":"中信建投","source_folder":"宏观研究","hotspot_tags":["地缘"]},{"id":"csc-r0723-01-f178","title_zh":"中国船舶（600150）：高价订单集中交付推动盈利提升，订单充足支撑业绩持续增长","type":"company","sector":"军工及新材料","market":"","tickers":["600150"],"priority":"⭐⭐","ms_rating":"","target_price":"","one_liner":"公司预计2026 年上半年实现归母净利润92—110 亿元，按吸收 合并后的重述口径同比增长143.56%—191.21%；扣非归母净利润 90—108 亿元，同比增长211.34%—273.61%，主营业务盈利改善 更为明显。按一季度业绩倒算，2026Q2 预计实现归母净利润 43.68—61.68 亿元，同比增长81.75%—156.66%，中值约52.68 亿 元，环比增长约9.0%。","user_judgment":"跟踪","order":1,"pdf_name":"【中信建投】中国船舶（600150）：高价订单集中交付推动盈利提升，订单充足支撑业绩持续增长.pdf","pdf_path":"C:/ai/reports/research-board/中信建投研报合集/军工及新材料/【中信建投】中国船舶（600150）：高价订单集中交付推动盈利提升，订单充足支撑业绩持续增长.pdf","broker_id":"csc","broker_name_zh":"中信建投","source_folder":"军工及新材料"}],"morning_notes":[{"id":"csc-m20260723","order":1,"title_zh":"中信建投晨会纪要（7月23日）","source_folder":"晨会纪要","pdf_name":"中信建投晨会纪要－20260723.pdf","core_views":[{"sector":"其他","analyst_title":"分析师","analyst_name":"李家俊","title":"抱团虹吸之后，关注有效资金接力——2026Q2基金持仓全景扫描投资策略","summary":"二季度美伊地缘冲突阶段性缓和，市场风险偏好修复，重新聚焦科技主线，AI 算力和半导体板块强劲领涨，上证指数也在5 月中旬创下近十年来新高。配置层面，双创板块配置比例首次超过主板，成长风格配置比例达到78%，主动超配力度显著。电子行业配置和超配比例翻倍，有色、化工、电力设备、汽车、食品饮料、医药等行业则有明显减配和资金流出。"},{"sector":"其他","analyst_title":"首席分析师","analyst_name":"祁星","title":"治理为锚，周期为帆：ESG因子的行业特异性与宏观择时优化ESG策略","summary":"当前，ESG 投资已经到了从理论到实践的改革深水区。随着金融高质量发展的深化，ESG 在投资中的作用有望进一步凸显。本文关注ESG 因子在A 股的表现情况，采用A 股上市公司ESG 评分数据进行测试，发现ESG 因子可以作为投资中的辅助因子使用。我们根据GDP 潜在增速与CPI 同比增速，参照美林时钟思路将经济划分为四大周期，发现大部分有效因子经济扩张周期显著性更高，但表现方向不存在一致性。"},{"sector":"机械","analyst_title":"首席分析师","analyst_name":"许光坦","title":"屹唐股份：面向全球的半导体设备龙头，受益国内、海外共振向上——半导体设备系列报告","summary":"公司是财政国资局控制的全球化半导体设备企业，核心子公司MTI 长期深耕集成电路设备领域，客户覆盖全球头部fab 厂，公司产品覆盖干法去胶、快速热处理、干法刻蚀及等离子体表面处理等关键前道工艺环节，其中干法去胶和快速热处理设备已形成较强的全球竞争力，2025 年份额位于全球第二，公司发力刻蚀设备，面向先进制程的等离子体表面处理和材料改性设备具有稀缺性。"}],"stock_recs_by_sector":[{"sector":"机械","stocks":[{"name":"中国动力","symbol":""}]},{"sector":"医疗器械","stocks":[{"name":"微创机器人","symbol":""},{"name":"惠泰医疗","symbol":""},{"name":"爱康医疗","symbol":""},{"name":"英科医疗","symbol":""},{"name":"迈普医学","symbol":"301033.SZ"}]},{"sector":"电新","stocks":[{"name":"东方电气","symbol":""},{"name":"大金重工","symbol":""}]},{"sector":"地产","stocks":[{"name":"新鸿基地产","symbol":""}]},{"sector":"军工","stocks":[{"name":"国机精工","symbol":""}]},{"sector":"非银","stocks":[{"name":"中国平安","symbol":""}]},{"sector":"家电","stocks":[{"name":"春风动力","symbol":""},{"name":"涛涛车业","symbol":""}]},{"sector":"医药","stocks":[{"name":"欧林生物","symbol":""}]}]}]},"20260726":{"batch":{"date":"20260726","date_label":"2026年7月26日","report_count":8,"coverage_tags":["全球AI","通信"," 产","宏观研究","投资策略","首席经济学家"],"source_dir":"C:/ai/reports/research-board/中信建投研报合集"},"macro_sections":[],"lead_bullets":[{"order":1,"headline":"利润拐点，Q3收入有望转正","tickers":[{"symbol":"9618.HK","sentiment":"看好"}],"judgment":"看好","text":"预计京东2026Q2收入约3422亿元、同比下滑约4%，与市场预期接近；Non-GAAP净利约76.8亿元、净利率约2.24%，利润增速有望转正。Q3收入或随基数改善拐头，关注消费与新品变量。","source_folder":"海外研究","report_id":"csc-r0715-jd","tag":"财报解读"},{"order":2,"tag":"重大事件","headline":"6月美国CPI点评","tickers":[],"judgment":"跟踪","text":"6月美国核心CPI环比略负，租金回落与核心商品通缩显示通胀上行风险可控，加息担忧缓解。但市场核心矛盾已转向科技股高位泡沫与去杠杆，三季度仍或高波动。","source_folder":"宏观-海外经济与大类资产","report_id":"csc-r0715-dba976"},{"order":3,"tag":"宏观研报","headline":"全球K型分化走到了哪一步？","tickers":[],"judgment":"跟踪","text":"全球K型分化在收入、财富、资本市场与社会情绪多维加深，深度广度已超过往科技周期。AI将继续放大分化；美国或以内宽松对冲，外溢则由其他国家承担。","source_folder":"宏观研究","report_id":"csc-r0715-5a3cf4"},{"order":4,"tag":"策略观点","headline":"北向资金有望开启“4.0时代”","tickers":[],"judgment":"跟踪","text":"2026年二季度北向资金净流入约1580亿元，创近两年单季新高，重仓聚焦电子等科技制造。流动性修复叠加产业优势，全球资金或进入战略性配置中国资产的新阶段。","source_folder":"投资策略","report_id":"csc-r0715-1eddd1"},{"order":5,"tag":"重大事件","headline":"6月宏观经济数据解读","tickers":[],"judgment":"跟踪","text":"上半年GDP增4.7%，二季度回落至4.3%。6月工业、服务、消费和出口均较5月改善，但固投降5.7%、房地产投资降18%。生产强于需求、外需强于内需的K型分化加深，政策主线转向促消费、城市更新与基建托底。","source_folder":"首席经济学家","report_id":"csc-r0715-77f8df"}],"reports":[{"id":"csc-r0715-jd","broker_id":"csc","broker_name_zh":"中信建投","title_zh":"京东集团-SW（9618）：2026Q2 业绩前瞻——利润拐点，Q3 收入有望转正","type":"company","sector":"互联网电商","market":"HK","tickers":["9618.HK"],"priority":"⭐⭐⭐","ms_rating":"买入","target_price":"157.49港元","one_liner":"我们预计2026Q2 京东集团收入、利润与市场一致预期基本相符， 核心盈利拐点落地。预计集团整体收入下滑4%至3422 亿元，集 团收入增速较零售高2pct；4-5 月受去年国补高基数拖累偏弱，6 月环比明显改善。利润侧，Q2 预计集团净利润增速同比转正， Non-GAAP 净利润为76.8 亿元，对应净利率为2.24%，去年同期 为2.07%。26Q2 出现利润端拐点，Q3 基数改善带动收入增速修 复，出现收入侧拐点，重点跟踪苹果新机销售、消费复苏、家电 天气扰动三大变量。","user_judgment":"看好","order":1,"pdf_name":"【中信建投海外研究】京东集团－SW（9618）：2026Q2业绩前瞻：Q2出现利润拐点，Q3收入有望恢复正增长 .pdf","pdf_path":"C:/ai/reports/research-board/中信建投研报合集/海外研究/【中信建投海外研究】京东集团－SW（9618）：2026Q2业绩前瞻：Q2出现利润拐点，Q3收入有望恢复正增长 .pdf","source_folder":"海外研究"},{"id":"csc-r0715-dba976","title_zh":"完美CPI≠市场风险化解 ——6月美国CPI点评","type":"macro","sector":"宏观-海外经济与大类资产","market":"CN","tickers":[],"priority":"⭐⭐","ms_rating":"","target_price":"","one_liner":"① 租金在统计方法干扰后回落，下半年租金维持低位，是通胀不大幅反弹的底气。② 核心商品通缩，显示关税影响趋尾，而能源和AI 的成本抬升向下游传导不畅，美国消费偏弱， 较难实现全面性的通胀扩散。③ 世界杯的影响在6 月不明显，酒店价格负增，不排除涨价高峰在前期已呈现。④ AI 扩散：最相关的设备商品价格疑似筑顶，后续关注服务类价格。本月CPI 数据较低，逻辑线索也指向下半年上行风险可控，加息担忧将获缓解，市场迎来一丝喘息。","user_judgment":"跟踪","order":2,"pdf_name":"【中信建投海外经济与大类资产】完美CPI≠市场风险化解 ——6月美国CPI点评.pdf","pdf_path":"C:/ai/reports/research-board/中信建投研报合集/宏观-海外经济与大类资产/【中信建投海外经济与大类资产】完美CPI≠市场风险化解 ——6月美国CPI点评.pdf","broker_id":"csc","broker_name_zh":"中信建投","source_folder":"宏观-海外经济与大类资产","hotspot_tags":["通胀","AI科技","内需消费"]},{"id":"csc-r0715-5a3cf4","title_zh":"全球K型分化走到了哪一步？","type":"macro","sector":"宏观研究","market":"CN","tickers":[],"priority":"⭐⭐","ms_rating":"","target_price":"","one_liner":"当下全球面临极致分化。分化已不再局限于特定国家的收 入，就业，更广泛的国家同样经历财富、增长驱动力的内部 劈叉。分化还渗透在资本市场以及社会情绪。多维指标指向 一点，当前分化深度与广度，均突破过往科技周期极值。很多人将当下分化归咎于AI 带来就业冲击，其实AI 崭露头 角之前，全球已处极致分化状态。正如任何一轮科技革命， AI 提高全社会生产效率同时，加速分化。我们可预期K 形分化会随着AI 演进而深化，这一趋势之下， 美国或动用政策勉力控制国内分化张力，但美国政策的外溢 性由弱国承担。","user_judgment":"跟踪","order":3,"pdf_name":"【中信建投宏观研究】全球K型分化走到了哪一步？.pdf","pdf_path":"C:/ai/reports/research-board/中信建投研报合集/宏观研究/【中信建投宏观研究】全球K型分化走到了哪一步？.pdf","broker_id":"csc","broker_name_zh":"中信建投","source_folder":"宏观研究","hotspot_tags":["AI科技","K型分化","就业"]},{"id":"csc-r0715-1eddd1","title_zh":"北向资金有望开启“4．0时代”","type":"sector","sector":"投资策略","market":"CN","tickers":[],"priority":"⭐⭐","ms_rating":"","target_price":"","one_liner":"2026 年二季度，北向资金净流入约1580 亿元，创下 近两年单季度净流入规模新高，相较于2022-2025 年间明显改善。行业配置聚焦科技和制造板块，电子成为第一大重仓行业，通信、 新能源、机械行业明显超配。长期来看，全球G2 格局深化，中 美并驾齐驱，产业激烈角逐。流动性环境修复叠加产业优势，北 向资金有望开启“4.0 时代”，全球资金战略性配置中国资产。","user_judgment":"跟踪","order":4,"pdf_name":"【中信建投投资策略研究】北向资金有望开启“4．0时代”.pdf","pdf_path":"C:/ai/reports/research-board/中信建投研报合集/投资策略/【中信建投投资策略研究】北向资金有望开启“4．0时代”.pdf","broker_id":"csc","broker_name_zh":"中信建投","source_folder":"投资策略"},{"id":"csc-r0715-77f8df","title_zh":"硅基延续高景气，内需待政策接力——6月宏观经济数据解读","type":"macro","sector":"首席经济学家","market":"CN","tickers":[],"priority":"⭐⭐","ms_rating":"","target_price":"","one_liner":"1. 6 月数据表明，增长斜率有所改善，结构分化尚未扭转。2. K 型分化加深体现为四个层面：生产强于需求，外需强于内需，高技术强于传统部门，短期融资强于长期 融资。3. 近期政策思路与当前矛盾的匹配度提高。政策主线聚焦于提升消费能力，盘活城市存量，建设现代基础设 施。城市更新和“六张网”有望托底投资，消费与就业政策则决定内需修复的持续性。信息： 上半年GDP 同比增长4.7%，其中一季度增长5.0%，二季度回落至4.3%。","user_judgment":"跟踪","order":5,"pdf_name":"【中信建投首席经济学家】硅基延续高景气，内需待政策接力——6月宏观经济数据解读.pdf","pdf_path":"C:/ai/reports/research-board/中信建投研报合集/首席经济学家/【中信建投首席经济学家】硅基延续高景气，内需待政策接力——6月宏观经济数据解读.pdf","broker_id":"csc","broker_name_zh":"中信建投","source_folder":"首席经济学家"}],"morning_notes":[{"id":"csc-m20260715","order":1,"title_zh":"中信建投晨会纪要（7月15日）","source_folder":"晨会纪要","pdf_name":"中信建投晨会纪要－20260715.pdf","core_views":[{"sector":"其他","analyst_title":"首席分析师","analyst_name":"钱伟","title":"完美CPI≠市场风险化解——6月美国CPI点评海外经济","summary":"①租金在统计方法干扰后回落，下半年租金维持低位，是通胀不大幅反弹的底气。②核心商品通缩，显示关税影响趋尾，而能源和AI 的成本抬升向下游传导不畅，美国消费偏弱，较难实现全面性的通胀扩散。③世界杯的影响在6 月不明显，酒店价格负增，不排除涨价高峰在前期已呈现。④AI 扩散：最相关的设备商品价格疑似筑顶，后续关注服务类价格。"},{"sector":"宏观","analyst_title":"首席分析师","analyst_name":"周君芝","title":"PMI企稳回升：修复成色到底如何？","summary":"6 月制造业PMI 录得50.3%，环比增0.3pct，修复力度强于历史同期季节性均值。制造业重返扩张区间，外需是核心拉动。新出口订单指数大幅回升1.5 pct 至50.1%，出口对工业生产的支撑有望进一步强化。价格指数双双回落，中下游成本压力有所缓释，但终端需求整体偏弱，后续PPI 同比或存下行压力。PMI 结构分化特征延续，新旧动能K 型运行态势进一步确认。"},{"sector":"建筑","analyst_title":"首席分析师","analyst_name":"竺劲","title":"鸿路钢构(002541):业绩超预期增长，单季度产销创新高——2026年半年度业绩预告点评","summary":"公司上半年预计实现归母净利润4.3-4.9 亿元，同比增长50-70%，预计实现扣非归母净利润3.8-4.3 亿元，同比增长60-80%。上半年公司产量270 万吨，同比增长14.3%，新签订单增长12.4%，其中二季度单季度产量150.0 万吨，新签订单87.5 亿元，均创历史新高。公司智能化改造卓有成效，在手订单充足，产量保持双位数增长，在研发费用退坡、钢价下行压制减弱后业绩迎来明显改善。"}],"stock_recs_by_sector":[{"sector":"机械","stocks":[{"name":"中国动力","symbol":""}]},{"sector":"医疗器械","stocks":[{"name":"微创机器人","symbol":""},{"name":"惠泰医疗","symbol":""},{"name":"爱康医疗","symbol":""},{"name":"英科医疗","symbol":""},{"name":"迈普医学","symbol":"301033.SZ"}]},{"sector":"电新","stocks":[{"name":"东方电气","symbol":""},{"name":"大金重工","symbol":""}]},{"sector":"地产","stocks":[{"name":"新鸿基地产","symbol":""}]},{"sector":"军工","stocks":[{"name":"国机精工","symbol":""}]},{"sector":"非银","stocks":[{"name":"中国平安","symbol":""}]},{"sector":"家电","stocks":[{"name":"春风动力","symbol":""},{"name":"涛涛车业","symbol":""}]},{"sector":"医药","stocks":[{"name":"欧林生物","symbol":""}]}]}]},"20260720":{"batch":{"date":"20260720","date_label":"2026年7月20日","report_count":3,"coverage_tags":["海外互联网/AI应用","宏观-海外经济与大类资产"],"source_dir":"C:/ai/reports/research-board/中信建投研报合集"},"macro_sections":[{"title":"通用办公 Agent 风起，关注阿里及 QoderWork 进展","lines":["通用办公 Agent 处于产品验证向规模化渗透转折点；阿里将 QoderWork 定位为打通大模型与数字世界的核心接口。","产品亮点：底层模型、工具调用与阿里生态（钉钉/夸克/1688 等）打通；国内大厂中较快实现全面公测。","海外 Codex/Claude Cowork 等验证办公 Agent 潜力；国内渗透仍处早期。"],"source_folder":"海外研究","report_id":"csc-r0720-agent"}],"lead_bullets":[{"order":1,"headline":"通用办公Agent风起","tickers":[{"symbol":"9988.HK","sentiment":"看好"},{"symbol":"BABA","sentiment":"看好"}],"judgment":"看好","text":"通用办公Agent处于产品验证向规模渗透的转折点。阿里以QoderWork率先完成桌面级Agent公测，并推进与悟空、MuleRun整合，定位为打通大模型与数字世界的核心接口，建议跟踪其进展。","source_folder":"海外研究","report_id":"csc-r0720-agent","tag":"行业跟踪"},{"order":2,"tag":"宏观研报","headline":"美股大势","tickers":[],"judgment":"跟踪","text":"短期提示纳指从前高回撤超10%的风险；中期2028或不排除成“大限”，需靠应用爆发、产业证伪、中国AI赶超或加息化解泡沫，否则K型分化加剧可能在大选年招致监管与反垄断反噬。","source_folder":"宏观-海外经济与大类资产","report_id":"csc-r0720-0be1ec"},{"order":3,"tag":"行业跟踪","headline":"基本面优异，工业金属跑出相对","tickers":[],"judgment":"跟踪","text":"本周大盘大幅调整，但是，基本工业金属表现出很强的抗跌性，主要是有色商品 价格坚挺，有色公司预告的上半年业绩亮眼，且工业金属股票本已经在很低的位 置上。展望后期，有色供需状态良好，铜、铝、锡等金属均呈现持续去库状态， 且供应端还陆续有扰动出现，如刚果（金）查封KCC、电解铝生产事故等，有动 力将推上新台阶，在此背景下，尚处于低PE 的有色权益标的在沉寂过后有望重 新获得资金青睐，走出回升的趋势。","source_folder":"金属及金属材料","report_id":"csc-r0720-40-44ef","broker_id":"csc"}],"reports":[{"id":"csc-r0720-agent","broker_id":"csc","broker_name_zh":"中信建投","title_zh":"通用办公 Agent 风起，关注阿里及 QoderWork 进展","type":"sector","sector":"海外互联网/AI应用","market":"HK","tickers":["9988.HK","BABA"],"priority":"⭐⭐⭐","ms_rating":"强于大市","target_price":"","one_liner":"通用办公Agent 是AI 大模型商业化落地的核心赛道之一，正处 于从产品验证向规模化渗透的转折点。阿里巴巴以QoderWork 为 先导产品，率先完成桌面级Agent 的产品化与公测，并在集团层 面将其定位为打通大模型与数字世界的核心接口。当前阿里正推 进QoderWork、悟空与MuleRun 三大To B Agent 的深度整合， 进一步强化通用办公Agent 赛道布局。建议关注AI Agent 在通用 办公领域的发展及阿里在该赛道的进展。","user_judgment":"看好","order":1,"pdf_name":"【中信建投海外研究】通用办公Agent风起， 关注阿里及QoderWork进展.pdf","pdf_path":"C:/ai/reports/research-board/中信建投研报合集/海外研究/【中信建投海外研究】通用办公Agent风起， 关注阿里及QoderWork进展.pdf","source_folder":"海外研究"},{"id":"csc-r0720-0be1ec","title_zh":"美股科技：终局的猜想——美股大势（8）","type":"macro","sector":"宏观-海外经济与大类资产","market":"CN","tickers":[],"priority":"⭐⭐","ms_rating":"","target_price":"","one_liner":"短期，提示回撤风险，纳指不排除从前高下跌10%以 上。中期，2028 年不排除是美股科技的一个“大限”。要么在此 之前，通过内生（应用端爆发、新周期接力or 产业证伪）或外在 方式（中国AI 赶超、联储加息）解决泡沫，要么K 型分化加剧， 引发反AI 社会思潮，被两党所利用，在2028 年大选等来政策的 反噬，例如对AI 巨头加强监管、反垄断、加税。本美股科技牛市，最终会以何种方式结束、在何时结束？","user_judgment":"跟踪","order":2,"pdf_name":"【中信建投海外经济与大类资产】美股科技：终局的猜想——美股大势（8）.pdf","pdf_path":"C:/ai/reports/research-board/中信建投研报合集/宏观-海外经济与大类资产/【中信建投海外经济与大类资产】美股科技：终局的猜想——美股大势（8）.pdf","broker_id":"csc","broker_name_zh":"中信建投","source_folder":"宏观-海外经济与大类资产","hotspot_tags":["美联储","美股","AI科技"]},{"id":"csc-r0720-40-44ef","title_zh":"基本面优异，工业金属跑出相对","type":"sector","sector":"金属及金属材料","market":"","tickers":[],"priority":"⭐⭐","ms_rating":"","target_price":"","one_liner":"本周大盘大幅调整，但是，基本工业金属表现出很强的抗跌性，主要是有色商品 价格坚挺，有色公司预告的上半年业绩亮眼，且工业金属股票本已经在很低的位 置上。展望后期，有色供需状态良好，铜、铝、锡等金属均呈现持续去库状态， 且供应端还陆续有扰动出现，如刚果（金）查封KCC、电解铝生产事故等，有动 力将推上新台阶，在此背景下，尚处于低PE 的有色权益标的在沉寂过后有望重 新获得资金青睐，走出回升的趋势。","user_judgment":"跟踪","order":40,"pdf_name":"【中信建投金属和金属新材料】基本面优异，工业金属跑出相对.pdf","pdf_path":"C:/ai/reports/research-board/中信建投研报合集/金属及金属材料/【中信建投金属和金属新材料】基本面优异，工业金属跑出相对.pdf","broker_id":"csc","broker_name_zh":"中信建投","source_folder":"金属及金属材料","hotspot_tags":["铜"]}],"morning_notes":[{"id":"csc-m20260720","order":1,"title_zh":"中信建投晨会纪要（7月20日）","source_folder":"晨会纪要","pdf_name":"中信建投晨会纪要－20260720.pdf","core_views":[{"sector":"策略","analyst_title":"分析师","analyst_name":"何盛","title":"韩股去杠杆影响何时结束——中信建投策略周思考20260719","summary":"近一周韩国去杠杆引发全球科技股调整，A 股算力显著回调，市场核心疑虑在调整的幅度与持续时间。我们认为本轮冲击以风险情绪传导为主而非流动性冲击：韩国的主要风险来源于三重杠杆嵌套而国内无同类杠杆风险，叠加国内宏观流动性宽松、债券利率下移的环境和7月底政治局会议临近、促消费政策预期升温。综合判断市场不具备直接走熊条件，调整提供逢低布局窗口。配置上短期关注创新药与红利，科技待韩国杠杆出清后再加仓算力上游。"},{"sector":"其他","analyst_title":"首席分析师","analyst_name":"杨骥","title":"贵州茅台(600519):淡季提价彰显信心，今明年业绩确定性提升食饮","summary":"公司自3 月底对普飞提价后，再次对普飞的i 茅台平台零售价和销售合同价各上调100 元，此举为公司按照随行就市、量价平衡等原则进行市场调控，我们认为有利于直接增厚收入业绩、提高今明年业绩确定性，压缩炒作空间、利好批价稳中有升，预计经销商总体情绪平稳。我们看好茅台今年的市场化改革和批价稳中有升，看好近期在资金再平衡下的茅台配置价值。"},{"sector":"金工","analyst_title":"首席分析师","analyst_name":"姚紫薇","title":"首批18只主动ETF集中上报","summary":"7 月17 日，证监会官网显示，首批18 只主动ETF 产品已完成产品材料报送，当前均已处于“接收材料”状态。本次上报的18 只产品中，大多采用容量充足的价值、稳健/均衡和红利风格，产品管理人整体呈现梯度化布局，规模覆盖面大，管理人特点鲜明。展望未来，主动ETF有望与主动基金、被动ETF 共同形成新发展格局。本周金融地产板块基金整体表现相对较好，消费板块绩优基金表现领先。"}],"stock_recs_by_sector":[{"sector":"机械","stocks":[{"name":"中国动力","symbol":""}]},{"sector":"医疗器械","stocks":[{"name":"微创机器人","symbol":""},{"name":"惠泰医疗","symbol":""},{"name":"爱康医疗","symbol":""},{"name":"英科医疗","symbol":""},{"name":"迈普医学","symbol":"301033.SZ"}]},{"sector":"电新","stocks":[{"name":"东方电气","symbol":""},{"name":"大金重工","symbol":""}]},{"sector":"地产","stocks":[{"name":"新鸿基地产","symbol":""}]},{"sector":"军工","stocks":[{"name":"国机精工","symbol":""}]},{"sector":"非银","stocks":[{"name":"中国平安","symbol":""}]},{"sector":"家电","stocks":[{"name":"春风动力","symbol":""},{"name":"涛涛车业","symbol":""}]},{"sector":"医药","stocks":[{"name":"欧林生物","symbol":""}]}]}]},"20260727":{"batch":{"date":"20260727","date_label":"2026年7月27日","report_count":5,"coverage_tags":["智能驾驶","宏观-海外经济与大类资产","首席经济学家"],"source_dir":"C:/ai/reports/research-board/中信建投研报合集"},"macro_sections":[{"title":"智驾行业之二：车企自研格局分层，第三方供应商长期价值凸显","lines":["智驾由产品竞争迈向平台化竞争；价值由硬件向软件、算法与数据迁移。","尽管头部车企自研渗透提升，第三方平台仍是海外与传统车企高阶量产重要路径。","平台化、全球化与软硬协同成为竞争核心；芯片厂向平台方案商升级。"],"source_folder":"海外研究","report_id":"csc-r0727-adas"}],"lead_bullets":[{"order":1,"headline":"智驾行业之二车企自研格局分层","tickers":[],"judgment":"看好","text":"智驾竞争从单品走向平台。车企自研、第三方算法与芯片三类主体各有优势，产业价值加速向软件、算法和数据迁移。自研门槛高，海外与传统车企仍依赖第三方，平台化与全球化是长期看点。","source_folder":"海外研究","report_id":"csc-r0727-adas","tag":"行业跟踪"},{"order":2,"tag":"宏观研报","headline":"地缘美伊局势","tickers":[],"judgment":"跟踪","text":"美伊战事进入以打促谈的第三阶段，长期化风险上升；美国无意长期作战，但通航目标难让步。双方仍有谈判空间，油价与美债承压，维持海外资产高波动判断。","source_folder":"宏观-海外经济与大类资产","report_id":"csc-r0727-f7dcc0"},{"order":3,"tag":"深度报告","headline":"”东升西降“系列之九","tickers":[],"judgment":"跟踪","text":"报告认为A股长期趋势向上、无系统性风险，而美股泡沫与产业空心化风险更高。相较美股，A股在市值安全边际、杠杆、主权信用、AI模式、产业更新、链条质量、业绩与重估潜力等八方面具优势。","source_folder":"首席经济学家","report_id":"csc-r0727-26c7f8"},{"order":4,"tag":"周报","headline":"看好半导体设备产业趋势","tickers":[],"judgment":"看好","text":"（1）人形机器人：板块多重催化共振，特斯拉人形机器人迈向 量产，看好板块持续性。（2）AIDC 发电设备：GE V上修接单 与产能目标，杰瑞再获百亿订单，验证全球燃机高景气。（3） 工程机械：6 月挖机内外销继续超预期，低位坚定布局。（4） 半导体设备：全球半导体设备进入大周期，关注涨价+出海。 （5）锂电设备：新国标落地，固态电池行业发展提速。","source_folder":"机械","report_id":"csc-r0727-18-c52c","broker_id":"csc"},{"order":5,"tag":"行业跟踪","headline":"欧洲6月电车跟踪欧洲九国新能源车销量40","tickers":[],"judgment":"跟踪","text":"欧洲九国6 月电车销量40.39 万辆，同比+44%，环比+29%，渗透 率37.7%，同比+8.3pct，环比+2.1pct，主要国家销量表现分析：法 国销量同比+68%，补贴作用下销量同比增速稳定，政策刺激持续 推动；德国26 年起重启补贴，6 月销量同比高增60%；英国25 年 12 月扩大购车直接补贴资金规模，6 月同比+32%；葡萄牙6 月正 式启动第二阶段零排放车辆购置补贴，销量同比+…","source_folder":"电力设备与新能源","report_id":"csc-r0727-32-0769","broker_id":"csc"}],"reports":[{"id":"csc-r0727-adas","broker_id":"csc","broker_name_zh":"中信建投","title_zh":"智驾行业之二：车企自研格局分层，第三方供应商长期价值凸显","type":"sector","sector":"智能驾驶","market":"CN","tickers":[],"priority":"⭐⭐⭐","ms_rating":"强于大市","target_price":"","one_liner":"智能驾驶产业正由单一产品竞争迈向平台化竞争，全栈自研车 企、第三方算法供应商及智能驾驶芯片企业三类主体分别依托整 车生态、算法平台和软硬一体能力构建差异化竞争优势。随着软 件定义汽车（SDV）持续推进，产业价值加速由硬件向软件、算 法和数据迁移，推动芯片企业向平台方案商升级，第三方算法供 应商则凭借跨品牌、跨芯片和全球化量产能力持续提升竞争力。尽管头部车企全栈自研渗透率不断提高，但受研发投入、数据闭 环及工程能力等门槛限制，第三方平台仍是海外车企、传统车企 及中小品牌实现高阶智能驾驶量产的重要路径。","user_judgment":"看好","order":1,"pdf_name":"【中信建投海外研究】智驾行业之二：车企自研格局分层，第三方供应商长期价值凸显.pdf","pdf_path":"C:/ai/reports/research-board/中信建投研报合集/海外研究/【中信建投海外研究】智驾行业之二：车企自研格局分层，第三方供应商长期价值凸显.pdf","source_folder":"海外研究"},{"id":"csc-r0727-f7dcc0","title_zh":"地缘：美伊局势，反复or反转","type":"macro","sector":"宏观-海外经济与大类资产","market":"CN","tickers":[],"priority":"⭐⭐","ms_rating":"","target_price":"","one_liner":"谅解备忘录的违约，与伊朗“海峡自治”和美国“自由通航”的理念分歧有关。战事三阶段：速攻（颠覆政权、未果），佯攻（边打边谈、撤出）、久攻（以打促谈、恢复通航）。进入阶段3，冲突长期化风险增加： ① 前期颠覆政权目标失败后，美国无意长期作战，但眼下通航目标难让步，会持续打击； ② 美国内外舆论压力下降，开始用低成本武器，长期打击可行性上升。谈判希望仍在：伊朗要筹码，美国想通航，均有让步空间。时点上，美国看市场和通胀反噬，伊 朗看经济约束。与此前不同，不光要特朗普TACO，美国诉求满足/伊朗妥协也很关键。","user_judgment":"跟踪","order":2,"pdf_name":"【中信建投海外经济与大类资产】地缘：美伊局势，反复or反转.pdf","pdf_path":"C:/ai/reports/research-board/中信建投研报合集/宏观-海外经济与大类资产/【中信建投海外经济与大类资产】地缘：美伊局势，反复or反转.pdf","broker_id":"csc","broker_name_zh":"中信建投","source_folder":"宏观-海外经济与大类资产","hotspot_tags":["地缘"]},{"id":"csc-r0727-26c7f8","title_zh":"A股长期致胜的八个宏观视角——”东升西降“系列之九","type":"macro","sector":"首席经济学家","market":"CN","tickers":[],"priority":"⭐⭐⭐","ms_rating":"","target_price":"","one_liner":" A 股市场将长期致胜。当前我国A股的长期趋势是向上的， 整体市值是扎实的，投资机遇是广阔的，虽有少数个股泡沫现 象，但整体市场没有系统性风险，产业进步和业绩成长显著。而美股全市场系统性泡沫因素极高，虽其仍有科技、货币优势， 但全市场产业空心化、价格泡沫化系统性风险不容忽视。 相较美股，A 股有八个不同与优势。","user_judgment":"跟踪","order":3,"pdf_name":"【中信建投黄文涛】A股长期致胜的八个宏观视角——”东升西降“系列之九.pdf","pdf_path":"C:/ai/reports/research-board/中信建投研报合集/首席经济学家/【中信建投黄文涛】A股长期致胜的八个宏观视角——”东升西降“系列之九.pdf","broker_id":"csc","broker_name_zh":"中信建投","source_folder":"首席经济学家"},{"id":"csc-r0727-18-c52c","title_zh":"周观点：看好半导体设备产业趋势，高阶mSAP工艺类载板积极扩产利好PCB设备龙头","type":"sector","sector":"机械","market":"","tickers":[],"priority":"⭐⭐","ms_rating":"","target_price":"","one_liner":"（1）人形机器人：板块多重催化共振，特斯拉人形机器人迈向 量产，看好板块持续性。（2）AIDC 发电设备：GE V上修接单 与产能目标，杰瑞再获百亿订单，验证全球燃机高景气。（3） 工程机械：6 月挖机内外销继续超预期，低位坚定布局。（4） 半导体设备：全球半导体设备进入大周期，关注涨价+出海。 （5）锂电设备：新国标落地，固态电池行业发展提速。","user_judgment":"看好","order":18,"pdf_name":"【中信建投机械设备】周观点：看好半导体设备产业趋势，高阶mSAP工艺类载板积极扩产利好PCB设备龙头.pdf","pdf_path":"C:/ai/reports/research-board/中信建投研报合集/机械/【中信建投机械设备】周观点：看好半导体设备产业趋势，高阶mSAP工艺类载板积极扩产利好PCB设备龙头.pdf","broker_id":"csc","broker_name_zh":"中信建投","source_folder":"机械"},{"id":"csc-r0727-32-0769","t ":"通信","stocks":[{"name":"新易盛","symbol":""}]},{"sector":"公用","stocks":[{"name":"福能股份","symbol":"600483.SH"}]}]}]},"20260707":{"batch":{"date":"20260707","date_label":"2026年7月7日","report_count":3,"coverage_tags":["宏观-政策研究"],"source_dir":"C:/ai/reports/research-board/中信建投研报合集"},"macro_sections":[],"lead_bullets":[{"order":1,"tag":"重大事件","headline":"再融资制度改革落地","tickers":[],"judgment":"跟踪","text":"证监会征求再融资改革意见，小额快速融资上限提至6亿元；国常会将超大规模智算集群升至国家战略。美国6月非农仅增5.7万人，加息预期降温，短期利好美债、黄金与成长股。","source_folder":"宏观-政策研究","report_id":"csc-r0707-705e5b"},{"order":2,"tag":"行业跟踪","headline":"AIPCB需求放量、高阶升级趋势明确","tickers":[],"judgment":"跟踪","text":"及摘要 2 核心观点：算力需求正成为PCB行业最重要的结构性增量，推动AI场景PCB升级为高多层、高密度、高速、低损耗和高可靠的平台型产品。","source_folder":"机械","report_id":"csc-r0707-12-f4fa","broker_id":"csc"},{"order":3,"tag":"深度报告","headline":"缺电产业链深度缺口明显","tickers":[],"judgment":"跟踪","text":"本篇报告从全球AI供电解决方案出发结合北美AI电力需求，综合考虑燃机、内燃机、SOFC等发电形式，构建了全球AI电力供需平衡表 ，结论为①2026-2028年预计仍存在14-20GW电力供给缺口，燃机、内燃机、SOFC整机及零部件国产链进入全球供应的趋势十分明确 ②储能作为调节资源将发挥的不可或缺作用。","source_folder":"电力设备与新能源","report_id":"csc-r0707-21-3236","broker_id":"csc"}],"reports":[{"id":"csc-r0707-705e5b","title_zh":"再融资制度改革落地、智算集群上升国家战略；美国非农走弱加息预期降温（2026年6月29日－2026年7月5日）","type":"macro","sector":"宏观-政策研究","market":"CN","tickers":[],"priority":"⭐⭐","ms_rating":"","target_price":"","one_liner":"本周重点关注三方面政策：（1）证监会发布再融资改革征求意见稿， 建立储架发行制度，小额快速融资上限提升至6 亿元，兼顾融资效率与市 场稳定。（2）国务院常务会议加码人工智能，将“超大规模智算集群建 设”上升至国家战略高度，AI 产业从“技术突破”迈向“基建先行”的新 阶段。（3）美国6 月非农新增就业仅5.7 万人，远低于预期，加息预期骤 降推动全球资产重新定价。","user_judgment":"跟踪","order":1,"pdf_name":"【中信建投政策研究】再融资制度改革落地、智算集群上升国家战略；美国非农走弱加息预期降温（2026年6月29日－2026年7月5日）.pdf","pdf_path":"C:/ai/reports/research-board/中信建投研报合集/宏观-政策研究/【中信建投政策研究】再融资制度改革落地、智算集群上升国家战略；美国非农走弱加息预期降温（2026年6月29日－2026年7月5日）.pdf","broker_id":"csc","broker_name_zh":"中信建投","source_folder":"宏观-政策研究","hotspot_tags":["AI科技","政策改革","就业"]},{"id":"csc-r0707-12-f4fa","title_zh":"AI PCB需求放量、高阶升级趋势明确，打开设备耗材新空间","type":"sector","sector":"机械","market":"","tickers":[],"priority":"⭐⭐","ms_ "one_liner":"7 月政治局会议核心聚焦五方面：一是形势判断更加辩证务实，充分 肯定经济“动能向新、结构向优”，同时强调政策支持仍有必要。二是宏 观政策进一步转向“发力提效”，明确充分释放存量政策效能、及时谋划 务实管用的增量政策，加大逆周期调节力度。三是扩大内需更加注重政 策落地，消费端挖掘服务消费潜力，投资端推动“六张网”扎实推进，并 强化财政金融协同。四是供给侧治理与科技创新同步升级，人工智能政 策向基础研究、产业化应用和新兴支柱产业培育延伸，“反内卷”迈向制 度化、常态化治理。","user_judgment":"跟踪","order":1,"pdf_name":"【中信建投政策研究】发力提效，关注落地——7月政治局会议学习体会.pdf","pdf_path":"C:/ai/reports/research-board/中信建投研报合集/宏观-政策研究/【中信建投政策研究】发力提效，关注落地——7月政治局会议学习体会.pdf","broker_id":"csc","broker_name_zh":"中信建投","source_folder":"宏观-政策研究","hotspot_tags":["政治局","十五五","政策改革","内需消费"]},{"id":"csc-r0731-eaa136","title_zh":"科技产业变革如何推进？——全球科技周期系列（二）","type":"macro","sector":"宏观研究","market":"CN","tickers":[],"priority":"⭐⭐⭐","ms_rating":"","target_price":"","one_liner":"信息技术革命演绎遵循一条核心规律：技术突破→成本下降→渗 透率提升→生态平台化。科技浪潮微观对应关键技术突破，中观对应成本下降和渗透率提 升，宏观上国别价值链重构。回顾上一轮信息技术革命： 产业变革的重大推进，往往发生在标准统一与生态形成之后；基 础设施投入前置，应用盈利兑现滞后；美国赚标准与生态红利， 日韩赚先进制造红利，中国赚规模与场景红利。虽然市场近期对AI 资本开支扩张存在疑虑，但对照信息技术革 命，当前AI 尚处“基建与应用探索并行”早期阶段，应用商业 闭环仍待验证。","user_judgment":"跟踪","order":2,"pdf_name":"【中信建投宏观研究】科技产业变革如何推进？——全球科技周期系列（二）.pdf","pdf_path":"C:/ai/reports/research-board/中信建投研报合集/宏观研究/【中信建投宏观研究】科技产业变革如何推进？——全球科技周期系列（二）.pdf","broker_id":"csc","broker_name_zh":"中信建投","source_folder":"宏观研究","hotspot_tags":["AI科技"]},{"id":"csc-r0731-e0d400","title_zh":"算力核心逻辑变了吗？","type":"sector","sector":"投资策略","market":"CN","tickers":[],"priority":"⭐⭐","ms_rating":"","target_price":"","one_liner":"2026 年上半年，海外云厂商资本开支持续高增长并多次上修， AI 服务器出货增速显著领先整体服务器市场，全球算力基础设 施仍处于集中建设期。与此同时，HBM 对先进DRAM 晶圆及封 装产能的挤占推动存储供需收紧，涨价进一步向覆铜板、电子 布、被动元器件及其他高端零部件扩散，价格上涨和产品结构 升级共同改善产业链盈利。但随着存储等涨价敏感资产经历去 杠杆和风险重定价，市场开始重新评估价格上涨斜率和高利润 率的持续性。","user_judgment":"跟踪","order":3,"pdf_name":"【中信建投权益策略】算力核心逻辑变了吗？.pdf","pdf_path":"C:/ai/reports/research-board/中信建投研报合集/投资策略/【中信建投权益策略】算力核心逻辑变了吗？.pdf","broker_id":"csc","broker_name_zh":"中信建投","source_folder":"投资策略"},{"id":"csc-r0731-07-43b1","title_zh":"中国铀业（001280）：国家核燃料安全压舱石，有望实现“核动力”成长","type":"company","sector":"军工及新材料","market":"","tickers":["001280"],"priority":"⭐⭐","ms_ra SH"}]}]}]},"20260804":{"batch":{"date":"20260804","date_label":"2026年8月4日","report_count":4,"coverage_tags":["宏观-政策研究","宏观研究"],"source_dir":"C:/ai/reports/research-board/中信建投研报合集"},"macro_sections":[],"lead_bullets":[{"order":1,"tag":"政策解读","headline":"政治局会议定调下半年加大逆周期调节力度","tickers":[],"judgment":"跟踪","text":"政治局要求加大逆周期、发挥存量政策效能；央行多日逆回购合计约2.1万亿元。美联储维持利率不变但出现3张反对票，鹰派分歧升温，油价与地缘支撑通胀韧性。","source_folder":"宏观-政策研究","report_id":"csc-r0804-7ece3f"},{"order":2,"tag":"重大事件","headline":"美联储7月议息会议点评通胀延续降温","tickers":[],"judgment":"跟踪","text":"7月FOMC维持利率不变，未释放明确降息信号。通胀继续改善但核心仍高于2%目标，服务黏性限制快速转向；短期维持限制性政策仍是基准，转向需更多数据确认。","source_folder":"宏观-政策研究","report_id":"csc-r0804-814553"},{"order":3,"tag":"深度报告","headline":"全球股市流动性跟踪框架","tickers":[],"judgment":"跟踪","text":"本轮并非全面流动性收缩，而是科技交易拥挤后的再平衡。显性杠杆去化压力最大期已过，后续风险可控；确认结束需看融资卖出止跌，以及海外AI交易能否重新企稳。","source_folder":"宏观研究","report_id":"csc-r0804-76e259"},{"order":4,"tag":"深度报告","headline":"半导体设备系列报告","tickers":[],"judgment":"看好","text":"全球半导体设备景气度持续上修，海外设备、零部件已出现 “量价齐升”情况，海外交期大幅延长，国产设备、零部件经 历“十四五”期间的修炼，能力大幅提升，具备充足的出海潜 力。另外一方面，除了外部制裁因素以外，全球缺货使得国内 下游客户获取海外设备、零部件的难度进一步提升，我们看好 国内市场的国产替代速度大幅加速。","source_folder":"机械","report_id":"csc-r0804-13-e1d1","broker_id":"csc"}],"reports":[{"id":"csc-r0804-7ece3f","title_zh":"政治局会议定调下半年加大逆周期调节力度；美联储维持利率不变鹰派分歧升温（2026年7月27日－2026年8月2日）","type":"macro","sector":"宏观-政策研究","market":"CN","tickers":[],"priority":"⭐⭐","ms_rating":"","target_price":"","one_liner":"本周重点关注三方面政策：（1）中共中央政治局会议分析研究当前 经济形势并部署下半年经济工作。实施好更加积极的财政政策和适度宽松 的货币政策，充分发挥存量政策效能；推进“两重”“两新”和“六张网” 建设，深入实施“人工智能+”行动，继续整治“内卷式”竞争，并深化 资本市场投融资综合改革。（2）中国人民银行于7 月29 日至31 日每日 开展6000 亿元隔夜逆回购，并安排8 月3 日再开展3000 亿元操作，合计 规模达到2.1 万亿元。","user_judgment":"跟踪","order":1,"pdf_name":"【中信建投政策研究】政治局会议定调下半年加大逆周期调节力度；美联储维持利率不变鹰派分歧升温（2026年7月27日－2026年8月2日）.pdf","pdf_path":"C:/ai/reports/research-board/中信建投研报合集/宏观-政策研究/【中信建投政策研究】政治局会议定调下半年加大逆周期调节力度；美联储维持利率不变鹰派分歧升温（2026年7月27日－2026年8月2日）.pdf","broker_id":"csc","broker_name_zh":"中信建投","source_folder":"宏观-政策研究","hotspot_tags":["美联储","AI科技","政治局","十五五","政策改革"]},{"id":"csc-r0804-814553","title_zh":"美联储7月议息会议点评：通胀延续降温，政策转向仍待更多确认","type":"macro","sector":"宏观-政策研究","market":"CN","tickers":[],"priority":"⭐⭐","ms_rating":"","target_price":"","one_liner":"7 月FOMC 会议维持联邦基金利率目标区间不变，美联储延续“观察 —确认—调整”的政策节奏，未释放明确降息信号。6 月PCE 数据显示， 美国通胀继续改善，能源价格回落推动整体价格压力缓解，但核心通胀仍 高于2%的政策目标，服务价格黏性和消费韧性限制政策快速转向。当前 美联储更加关注通胀回落的持续性以及货币政策框架调整后的有效性。短 期内，维持限制性政策仍是基准情景，后续政策转向仍需更多通胀和就业 数据确认。","user_judgment":"跟踪","order":2,"pdf_name":"【中信建投政策研究】美联储7月议息会议点评：通胀延续降温，政策转向仍待更多确认.pdf","pdf_path":"C:/ai/reports/research-board/中信建投研报合集/宏观-政策研究/【中信建投政策研究】美联储7月议息会议点评：通胀延续降温，政策转向仍待更多确认.pdf","broker_id":"csc","broker_name_zh":"中信建投","source_folder":"宏观-政策研究","hotspot_tags":["美联储","通胀","政策改革","内需消费"]},{"id":"csc-r0804-76e259","title_zh":"A股去杠杆到哪一步？——全球股市流动性跟踪框架（2）","type":"macro","sector":"宏观研究","market":"CN","tickers":[],"priority":"⭐⭐⭐","ms_rating":"","target_price":"","one_liner":"今年A 股表现的典型特征是两融、私募和个人型ETF 作为增 量资金流入市场，高弹性且依赖赚钱效应，强化定价科技行情。评估本轮A 股去杠杆，不仅观察传统显性杠杆（场内和场外 杠杆），还需要站在增量资金角度评估隐性杠杆（资金赎回和 质押风险）。通过系统指标梳理之后，我们发现，当前并非宏观流动性收紧 引发的资产负债表全面收缩，而是低利率环境下居民资产再 配置催生的结构性行情，在内外部科技交易共振逆转后，出现 的一轮拥挤度再平衡。目前显性杠杆去化压力最大时期已经过去，后续去杠杆风险可 控。","user_judgment":"跟踪","order":3,"pdf_name":"【中信建投宏观研究】A股去杠杆到哪一步？——全球股市流动性跟踪框架（2）.pdf","pdf_path":"C:/ai/reports/research-board/中信建投研报合集/宏观研究/【中信建投宏观研究】A股去杠杆到哪一步？——全球股市流动性跟踪框架（2）.pdf","broker_id":"csc","broker_name_zh":"中信建投","source_folder":"宏观研究","hotspot_tags":["AI科技","流动性"]},{"id":"csc-r0804-13-e1d1","title_zh":"专用设备：全球半导体设备进入“量价齐升”通道，国产设备出海进程加速——半导体设备系列报告","type":"sector","sector":"机械","market":"","tickers":[],"priority":"⭐⭐⭐","ms_rating":"","target_price":"","one_liner":"全球半导体设备景气度持续上修，海外设备、零部件已出现 “量价齐升”情况，海外交期大幅延长，国产设备、零部件经 历“十四五”期间的修炼，能力大幅提升，具备充足的出海潜 力。另外一方面，除了外部制裁因素以外，全球缺货使得国内 下游客户获取海外设备、零部件的难度进一步提升，我们看好 国内市场的国产替代速度大幅加速。","user_judgment":"看好","order":13,"pdf_name":"【中信建投机械设备】专用设备：全球半导体设备进入“量价齐升”通道，国产设备出海进程加速——半导体设备系列报告.pdf","pdf_path":"C:/ai/reports/research-board/中信建投研报合集/机械/【中信建投机械设备】专用设备：全球半导体设备进入“量价齐升”通道，国产设备出海进程加速——半导体设备系列 "csc-r0709-cad48b","title_zh":"AI和原油对核心CPI的传导如何？——美国通胀跟踪","type":"macro","sector":"宏观-海外经济与大类资产","market":"CN","tickers":[],"priority":"⭐⭐","ms_rating":"","target_price":"","one_liner":"AI 对下游的传导能力更强，但油价暂时对通胀的拉动 更大。核心CPI 同比今年上行0.2%，而二者合计拉动近0.5%， 基本解释全部通胀压力，且剩余分项整体偏下行。展望下半年， 基准情形下，油价去年Q4 过低，同比贡献虽下降，但仍不低；AI 贡献较当前或翻倍；二者整体影响维持在偏高水平。通胀回落需 要期待：①油价下降、②核心商品通缩、③明年油价基数切换。今年美国通胀两个新的上行担忧，来自AI 和能源成本的上升， 其在核心CPI 中有多少体现？","user_judgment":"跟踪","order":1,"pdf_name":"【中信建投海外经济与大类资产】AI和原油对核心CPI的传导如何？——美国通胀跟踪.pdf","pdf_path":"C:/ai/reports/research-board/中信建投研报合集/宏观-海外经济与大类资产/【中信建投海外经济与大类资产】AI和原油对核心CPI的传导如何？——美国通胀跟踪.pdf","broker_id":"csc","broker_name_zh":"中信建投","source_folder":"宏观-海外经济与大类资产","hotspot_tags":["通胀","原油","AI科技"]}],"morning_notes":[{"id":"csc-m20260709","order":1,"title_zh":"中信建投晨会纪要（7月9日）","source_folder":"晨会纪要","pdf_name":"中信建投晨会纪要－20260709.pdf","core_views":[{"sector":"其他","analyst_title":"首席分析师","analyst_name":"曾羽","title":"浮息债：利率变局下的攻守切换——低利率应对系列四固收","summary":"国内浮息债规模不大但结构集中，当前以政策性金融债为主，挂钩基准以DR007 和LPR 为核心。浮息债相对固息债的优势并非无条件成立，关键取决于无风险利率与挂钩基准利率的组合变化：当DR007 或LPR 上行并带动票息重定价时，浮息债相对占优；若无风险利率上行而基准利率下行或低位运行，浮息债承压加剧。当前LPR 仍处降息周期、DR007 缺乏明显上行基础，短期不宜高估浮息债配置价值。"},{"sector":"其他","analyst_title":"首席分析师","analyst_name":"朱玥","title":"缺电产业链深度：缺口明显，国产链和储能将全面导入电新","summary":"本篇报告从全球AI 供电解决方案出发结合北美AI 电力需求，综合考虑燃机、内燃机、SOFC等发电形式，构建了全球AI 电力供需平衡表，结论为①2026-2028 年预计仍存在14-20GW电力供给缺口，燃机、内燃机、SOFC 整机及零部件国产链进入全球供应的趋势十分明确②储能作为调节资源将发挥的不可或缺作用。"},{"sector":"机械","analyst_title":"首席分析师","analyst_name":"许光坦","title":"AIPCB需求放量、高阶升级趋势明确，打开设备耗材新空间","summary":"算力需求正成为PCB 行业最重要的结构性增量，推动AI 场景PCB 升级为高多层、高密度、高速、低损耗和高可靠的平台型产品。"}],"stock_recs_by_sector":[{"sector":"机械","stocks":[{"name":"中国动力","symbol":""}]},{"sector":"医疗器械","stocks":[{"name":"微创机器人","symbol":""},{"name":"惠泰医疗","symbol":""},{"name":"爱康医疗","symbol":""},{"name":"英科医疗","symbol":""},{"name":"迈普医学","symbol":"301033.SZ"}]},{"sector":"电新","stocks":[{"name":"东方电气","symbol":""},{"name":"大金重工","symbol":""}]},{"sector":"地产","stocks":[{"name":"新鸿基地产","symbol" rget_price":"","one_liner":"历史上，韩元与韩股多数时候同向变化，但近期呈现“韩股上涨、 韩元贬值，韩股回调、韩元升值”的反常组合。如何理解韩元走 势？后续若韩国股市继续波动，韩元能否维持强势？我们认为：韩元短期节奏更多由跨境资金流决定，而后者受到韩 国股市显著影响；短期仍看多韩元，但上行空间有限；中长期， 韩元则受到储蓄过剩、强美元及半导体周期压制。","user_judgment":"跟踪","order":1,"pdf_name":"【中信建投海外经济与大类资产】韩股跌，韩元为何涨？全球外汇跟踪（2）.pdf","pdf_path":"C:/ai/reports/research-board/中信建投研报合集/宏观-海外经济与大类资产/【中信建投海外经济与大类资产】韩股跌，韩元为何涨？全球外汇跟踪（2）.pdf","broker_id":"csc","broker_name_zh":"中信建投","source_folder":"宏观-海外经济与大类资产","hotspot_tags":["美元","韩元","外汇"]},{"id":"csc-r0729-a4da79","title_zh":"债务流动性视角：谁将为AI超级周期买单？——全球股市流动性跟踪系列（1）","type":"macro","sector":"宏观研究","market":"CN","tickers":[],"priority":"⭐⭐⭐","ms_rating":"","target_price":"","one_liner":"资本开支增速快于经营现金流，是2026 年AI债务融资扩张 的直接原因。无论是公司债、项目融资还是表外合作，本质都是以母公司 信用、项目资产和长期合同为支撑，将尚未兑现的AI 收入提前 资本化，并把全球长期储蓄导向GPU、数据中心和电力资产。因此，本轮AI 投资已不只是科技巨头的内部资本开支，而 是一轮由企业信用、项目资产和长期资金共同推动的信用扩张。其真正脆弱性不在银行或非银杠杆，而在融资条件能否持续：低 成本、高抵押率和快速审批是否还能维持。","user_judgment":"跟踪","order":2,"pdf_name":"【中信建投宏观研究】债务流动性视角：谁将为AI超级周期买单？——全球股市流动性跟踪系列（1）.pdf","pdf_path":"C:/ai/reports/research-board/中信建投研报合集/宏观研究/【中信建投宏观研究】债务流动性视角：谁将为AI超级周期买单？——全球股市流动性跟踪系列（1）.pdf","broker_id":"csc","broker_name_zh":"中信建投","source_folder":"宏观研究","hotspot_tags":["AI科技","流动性"]}],"morning_notes":[{"id":"csc-m20260729","order":1,"title_zh":"中信建投晨会纪要（7月29日）","source_folder":"晨会纪要","pdf_name":"中信建投晨会纪要－20260729.pdf","core_views":[{"sector":"其他","analyst_title":"首席分析师","analyst_name":"袁清慧","title":"精准变革，长存共生：B细胞淋巴瘤慢病管理时代医药","summary":"在靶向创新疗法的驱动下，B 细胞淋巴瘤治疗正呈现显著的“慢病化”趋势。患者生存期大幅延长，积累了庞大的存量患者群体，长期且持续的用药需求，共同推动了B 细胞淋巴瘤市场的快速扩容与重磅产品的频出，孕育着巨大的市场潜力。行业未来发展方向聚焦于提升疗效、减少复发和优化给药。当前竞争已进入全新阶段，技术迭代与新靶点探索成为核心趋势。"},{"sector":"其他","analyst_title":"首席分析师","analyst_name":"朱玥","title":"800VDC将成为供电架构迭代的关键催化，受益方向包括柜内、柜外、板级电源等电新","summary":"800VDC 强趋势已成为各AI 芯片、电源企业共识，为供电架构演进的关键催化。主要变化在于：（1）柜外从交流输出转向直流输出，功率密度不断提升，UPS 向HVDC power rack（sidecar）、巴拿马电源、SST 等方向迭代；（2）柜内PSU 功率密度提升，随后因800VDC 入柜还需增设800V-50V 等DCDC 环节；（3）板级50V-12V、12V-1V DCDC 降压环节设备…"},{"sector":"其他","analyst_title":"首席分析师","analyst_name":"曾羽","title":"从超长债利差视角看30Y国债合理点位固收","summary":"30Y-10Y 国债利差同上证综指的走势高度趋同，近两年相关系数可达到0.9，处于高度正相关区间。进一步，二者走势的阶段性分离会系统性修复，验证了这一规律的稳定性，也提示了超长债交易的时机。历史数据上看，2022 年及以前的30Y-10Y 国债利差具有平稳性，以55BP 为中枢宽幅震荡、均值修复；而后则呈现趋势性，不再均值修复。"}],"stock_recs_by_sector":[{"sector":"汽车","stocks":[{"name":"宇通客车","symbol":"600066.SH"},{"name":"潍柴动力","symbol":"000338.SZ"}]},{"sector":"医疗器械","stocks":[{"name":"可孚医疗","symbol":"301087.SZ"},{"name":"瑞迈特","symbol":"688580.SH"},{"name":"精锋医疗-B","symbol":"9996.HK"}]},{"sector":"轻纺教育","stocks":[{"name":"布鲁可","symbol":"0325.HK"}]},{"sector":"通信","stocks":[{"name":"新易盛","symbol":""}]},{"sector":"公用","stocks":[{"name":"福能股份","symbol":"600483.SH"}]}]}]},"20260716":{"batch":{"date":"20260716","date_label":"2026年7月16日","report_count":1,"coverage_tags":["宏观研究"],"source_dir":"C:/ai/reports/research-board/中信建投研报合集"},"macro_sections":[],"lead_bullets":[{"order":1,"tag":"深度报告","headline":"全球科技周期系列","tickers":[],"judgment":"跟踪","text":"所谓“美国模式”以科技优势为根基：强货币抬高成本、制造外迁，美国攥住高定价权环节并支撑资本市场。通胀、分化与科技并立时，政策排序力保科技、次补分化、最后才压通胀；短期或见更强科技与更大国别分化。","source_folder":"宏观研究","report_id":"csc-r0716-9fa744"}],"reports":[{"id":"csc-r0716-9fa744","title_zh":"科技选择、美国模式和K型走向——全球科技周期系列（一）","type":"macro","sector":"宏观研究","market":"CN","tickers":[],"priority":"⭐⭐⭐","ms_rating":"","target_price":"","one_liner":"构建在科技优势之上的增长模式，我们称之为“美国模式”，美国 主导的全球秩序框架亦以此为基础： ①选择科技意味着美国面对强货币和高成本，国内制造竞争力削 弱，供应链外迁成为美国科技发展的代价。②供应链外包驱动全球化分工，美国依靠科技攥住利润厚的强定 价权环节，他国参与价值链偏低的生产制造。③科技赋予美国资本市场繁荣，金融账户黑字和经常账户赤字成 为美元潮汐的两端。当通胀、分化、科技并立，美国政策选择排序或是：力保科技排 序最前，其次是勉力弥合国内分化，最后才考虑压低全球通胀。","user_judgment":"跟踪","order":1,"pdf_name":"【中信建投宏观研究】科技选择、美国模式和K型走向——全球科技周期系列（一）.pdf","pdf_path":"C:/ai/reports/research-board/中信建投研报合集/宏观研究/【中信建投宏观研究】科技选择、美国模式和K型走向——全球科技周期系列（一）.pdf","broker_id":"csc","broker_name_zh":"中信建投","source_folder":"宏观研究","hotspot_tags":["AI科技","K型分化"]}],"morning_notes":[{"id":"csc-m20260716","order":1,"title_zh":"中信建投晨会纪要（7月16日）","source_folder":"晨会纪要","pdf_name":"中信建投晨会纪要－20260716.pdf","core_views":[{"sector":"非银","analys judgment":"跟踪","order":1,"pdf_name":"【中信建投黄文涛】美国五次贸易战与资产价格：向好、震荡与恐慌——”东升西降“系列之三.pdf","pdf_path":"C:/ai/reports/research-board/中信建投研报合集/首席经济学家/【中信建投黄文涛】美国五次贸易战与资产价格：向好、震荡与恐慌——”东升西降“系列之三.pdf","broker_id":"csc","broker_name_zh":"中信建投","source_folder":"首席经济学家"}]},"20260615":{"batch":{"date":"20260615","date_label":"2026年6月15日","report_count":2,"coverage_tags":["首席经济学家"],"source_dir":"C:/ai/reports/research-board/中信建投研报合集"},"macro_sections":[],"lead_bullets":[{"order":1,"tag":"深度报告","headline":"”东升西降“系列之七","tickers":[],"judgment":"跟踪","text":"美式经济靠三次超越成型：GDP与宏观货币化、科技金融与多层次市场、科技耐用品消费循环。次贷危机后脱实向虚，产业空心化与资产泡沫并存，与美元单极体系密切相关。","source_folder":"首席经济学家","report_id":"csc-r0615-6fbe3b"},{"order":2,"tag":"深度报告","headline":"”东升西降“系列之八","tickers":[],"judgment":"跟踪","text":"美元历经黄金锚定、原油商品锚定到美元美债美股信用螺旋三阶段。单极货币被武器化后扩张螺旋难持续，体系走向多极化，人民币资产崛起有综合国力支撑。","source_folder":"首席经济学家","report_id":"csc-r0615-31fdc1"}],"reports":[{"id":"csc-r0615-6fbe3b","title_zh":"美国崛起史（上）：美国经济架构的兴替——”东升西降“系列之七","type":"macro","sector":"首席经济学家","market":"CN","tickers":[],"priority":"⭐⭐⭐","ms_rating":"","target_price":"","one_liner":" 本文分析美国经济崛起的底层架构、三次超越，及当前面 临的产业空心化问题。美国在学习英国体系的基础上，通过三 次系统性创新超越，构建了支撑其崛起的美式经济架构体系。 第一次超越，是GDP 体系与宏观经济货币化，美国建立 起了货币化、总量化、结构化的宏观治理架构；第二次超越， 是科技金融体系与多层次资本市场，打通了“科技+金融+产业” 的循环；第三次超越，是双轮驱动与科技耐用品消费，打通了 “科技+产品+消费”的循环。","user_judgment":"跟踪","order":1,"pdf_name":"【中信建投黄文涛】美国崛起史（上）：美国经济架构的兴替——”东升西降“系列之七.pdf","pdf_path":"C:/ai/reports/research-board/中信建投研报合集/首席经济学家/【中信建投黄文涛】美国崛起史（上）：美国经济架构的兴替——”东升西降“系列之七.pdf","broker_id":"csc","broker_name_zh":"中信建投","source_folder":"首席经济学家"},{"id":"csc-r0615-31fdc1","title_zh":"美国崛起史（下）：美元货币体系的兴替——”东升西降“系列之八","type":"macro","sector":"首席经济学家","market":"CN","tickers":[],"priority":"⭐⭐⭐","ms_rating":"","target_price":"","one_liner":" 本文分析美元国际货币体系。美元是继英镑之后的第二代 单极国际货币体系，其在中前期有力支撑了美国的经济崛起， 但也蕴含了实体产业空心化、资产价格泡沫化、国际铸币与国 内货币功能矛盾等内生性不可持续因素。 美元国际体系的发展与架构，有三个阶段。第一阶段，国 际信用建设，其是金汇兑本位的黄金锚定货币；第二阶段，国 际信用扩张，其是原油贸易需求支撑的商品锚定货币；第三阶 段，信用螺旋扩张，其是“美元+美债+美股”的美元资产扩张螺 旋支撑的“信用螺旋货币”。","user_judgment":"跟踪","order":2,"pdf_name":"【中信建投黄文涛】美国崛起史（下）：美元货币体系的兴替——”东升西降“系列之八.pdf","pdf_path":"C:/ai/reports/research-board/中信建投研报合集/首席经济学家/【中信建投黄文涛】美国崛起史（下）：美元货币体系的兴替——”东升西降“系列之八.pdf","broker_id":"csc","broker_name_zh":"中信建投","source_folder":"首席经济学家"}]},"20260609":{"batch":{"date":"20260609","date_label":"2026年6月9日","report_count":2,"coverage_tags":["首席经济学家"],"source_dir":"C:/ai/reports/research-board/中信建投研报合集"},"macro_sections":[],"lead_bullets":[{"order":1,"tag":"深度报告","headline":"“东升西降”系列之五","tickers":[],"judgment":"跟踪","text":"英国是唯一完整经历工业崛起、霸权、衰落再繁荣的发达经济体。崛起靠两个多世纪向海图强与产业现代化，叠加金融革命；衰退则与产业空心化、创新教育滞后等因素相关。","source_folder":"首席经济学家","report_id":"csc-r0609-d360e7"},{"order":2,"tag":"深度报告","headline":"“东升西降”系列之六","tickers":[],"judgment":"跟踪","text":"英镑体系改革曾以英格兰银行等机构支撑工业革命。后期产业空心化下，强英镑保铸币与弱英镑保实体的两难加剧制造业衰退，说明金融须坚持服务实体。","source_folder":"首席经济学家","report_id":"csc-r0609-68f842"}],"reports":[{"id":"csc-r0609-d360e7","title_zh":"英国崛起（上）：英国工业革命的兴替——“东升西降”系列之五","type":"macro","sector":"首席经济学家","market":"CN","tickers":[],"priority":"⭐⭐⭐","ms_rating":"","target_price":"","one_liner":" 本文是“东升西降”系列第五篇，分析大国崛起的经济战 略。英国是唯一完整经历工业崛起、全球霸权、相对衰落、回 归繁荣的发达经济体，其兴衰对理解大国经济战略与全球体系 重构有深刻镜鉴意义。 英国崛起并非仅仅是由于工业革命的技术偶然，而是坚持 长达两个多世纪的“向海图强”与“产业现代化”国家战略的 全方位结合，以及持续适应性进化、支持这一战略的金融革命 所共同驱动的系统性综合国力崛起。 英国衰退的重要因素在于产业空心化、工业精神丧失、创 新教育滞后及选民利益分化等。","user_judgment":"跟踪","order":1,"pdf_name":"【中信建投黄文涛】英国崛起（上）：英国工业革命的兴替——“东升西降”系列之五.pdf","pdf_path":"C:/ai/reports/research-board/中信建投研报合集/首席经济学家/【中信建投黄文涛】英国崛起（上）：英国工业革命的兴替——“东升西降”系列之五.pdf","broker_id":"csc","broker_name_zh":"中信建投","source_folder":"首席经济学家"},{"id":"csc-r0609-68f842","title_zh":"英国崛起（下）：英镑货币体系的兴替——“东升西降”系列之六","type":"macro","sector":"首席经济学家","market":"CN","tickers":[],"priority":"⭐⭐⭐","ms_rating":"","target_price":"","one_liner":" 本文是“东升西降”系列第六篇，分析英国崛起进程中的 “英镑货币革命”。英镑货币体系是唯一完整经历了工业崛起、 全球霸权、相对衰落、回归繁荣的货币体系，其兴衰对理解大 国货币战略与全球货币体系重构有深刻镜鉴意义。 英镑货币体系改革，通过建立英格兰银行、伦敦证券交易 所、伦敦商品期货市场等机构，大规模改革货币发行、活跃流 动性、引导社会资金投向、强化产业金融融合，有力的支持了 英国的工业革命胜利。","user_judgment":"跟踪","order":2,"pdf_name":"【中信建投黄文涛】英国崛起（下）：英镑货币体系的兴替——“东升西降”系列之六.pdf","pdf_path":"C:/ai/reports/research-board/中信建投研报合集/首席经济学家/【中信建投黄文涛】英国崛起（下）：英镑货币体系的兴替——“东升西降”系列之六.pdf","broker_id":"csc","broker_name_zh":"中信建投","source_folder":"首席经济学家"}]},"20250427":{"batch":{"date":"20250427","date_label":"2025年4月27日","report_count":1,"coverage_tags":["首席经济学家"],"source_dir":"C:/ai/reports/research-board/中信建投研报合集"},"macro_sections":[],"lead_bullets":[{"order":1,"tag":"深度报告","headline":"“东升西降”系列之二","tickers":[],"judgment":"跟踪","text":"若美坚持保护主义，国债、股市、美元、通胀、产业链、居民企业、地产、经济结构与软实力等九大软肋将放大动荡。关税战难持续，缓和阶段宜逐步提升风险偏好。","source_folder":"首席经济学家","report_id":"csc-r0427-c638fe"}],"reports":[{"id":"csc-r0427-c638fe","title_zh":"贸易战难以持续：美国的软肋——“东升西降”系列之二","type":"macro","sector":"首席经济学家","market":"CN","tickers":[],"priority":"⭐⭐⭐","ms_rating":"","target_price":"","one_liner":" 本文是“东升西降”系列的第二篇，研究美国关税战贸 易战的软肋及前景。如美国继续沿贸易保护主义路线一意孤 行，美国经济在贸易战状态下的九大软肋，将会削弱其竞争 力，引起经济和市场更大的动荡。这九大软肋分别是：国债 其一，股市其二，美元其三，通胀其四，产业链其五，居民 企业其六，房地产其七，经济结构其八，软实力其九。 美国的软肋决定了关税战贸易战不可持续。投资者要抓 住“东升西降”的历史机遇。在关税战边际缓和的过程中， 应逐步提升风险偏好。内容要点 第一章 行有不得，反求诸己，贸易战没有赢家。","user_judgment":"跟踪","order":1,"pdf_name":"【中信建投黄文涛】贸易战难以持续：美国的软肋——“东升西降”系列之二.pdf","pdf_path":"C:/ai/reports/research-board/中信建投研报合集/首席经济学家/【中信建投黄文涛】贸易战难以持续：美国的软肋——“东升西降”系列之二.pdf","broker_id":"csc","broker_name_zh":"中信建投","source_folder":"首席经济学家"}]},"20260805":{"batch":{"date":"20260805","date_label":"2026年8月5日","report_count":1},"macro_sections":[{"order":1,"title":"港股：反弹修复，未证反转","summary":"结论偏估值修复：应用端领涨、硬件回撤；长牛仍看盈利与美元流动性两道门槛。","source_folder":"宏观研究","report_id":"csc-r0805-hk-rebound","hotspot_tags":["港股","AI科技","流动性"],"broker_id":"csc"}],"lead_bullets":[{"order":1,"tag":"深度/系列","headline":"港股研究系列（一）","tickers":[],"judgment":"跟踪","text":"港股反弹是科技硬件退潮下的应用端镜像与自身估值修复，尚未构成趋势反转；需等盈利企稳与美元流动性放松。关注中报与南向/外资回流。","source_folder":"宏观研究","report_id":"csc-r0805-hk-rebound","broker_id":"csc"}],"morning_notes":[{"id":"csc-m20260805","order":1,"title_zh":"中信建投晨会纪要（8月5日）","source_folder":"晨会纪要","pdf_name":"中信建投晨会纪要－20260805.pdf","core_views":[{"sector":"宏观","analyst_title":"首席分析师","analyst_name":"周君芝","title":"A股去杠杆到哪一步？——全球股市流动性跟踪框架（2）","summary":"今年A 股表现的典型特征是两融、私募和个人型ETF 作为增量资金流入市场，高弹性且依赖赚钱效应，强化定价科技行情。评估本轮A 股去杠杆，不仅观察传统显性杠杆（场内和场外杠杆），还需要站在增量资金角度评估隐性杠杆（资金赎回和质押风险）。"},{"sector":"机械","analyst_title":"首席分析师","analyst_name":"许光坦","title":"全球半导体设备进入“量价齐升”通道，国产设备出海进程加速——半导体设备系列报告","summary":"全球半导体设备景气度持续上修，海外设备、零部件已出现“量价齐升”情况，海外交期大幅延长，国产设备、零部件经历“十四五”期间的修炼，能力大幅提升，具备充足的出海潜力。另外一方面，除了外部制裁因素以外，全球缺货使得国内下游客户获取海外设备、零部件的难度进一步提升，我们看好国内市场的国产替代速度大幅加速。"},{"sector":"汽车","analyst_title":"首席分析师","analyst_name":"程似骐","title":"隆鑫通用：铸品牌、拓全球，民族品牌走向世界","summary":"公司是国内摩托车龙头企业，正经历从代工向自主品牌出海的蜕变，自主品牌无极已在欧洲起势，随着产品矩阵完善，公司在欧洲市场的市占率有望持续提升。同时，巴西、哥伦比亚等南美市场也将成为无极品牌未来几年的重要增量市场。受非洲经济快速增长、渠道拓展影响，三轮车业务也正处于快速放量过程中。全地形车收入也逐步成为公司重要收入来源。近两年，公司维持高分红，持续回馈投资者。"}],"stock_recs_by_sector":[{"sector":"轻纺教育","stocks":[{"name":"布鲁可","symbol":"0325.HK"}]},{"sector":"汽车","stocks":[{"name":"宇通客车","symbol":"600066.SH"},{"name":"潍柴动力","symbol":"000338.SZ"},{"name":"禾赛科技","symbol":"2525.HK"}]},{"sector":"医疗器械","stocks":[{"name":"可孚医疗","symbol":"301087.SZ"},{"name":"瑞迈特","symbol":"688580.SH"},{"name":"迈普医学","symbol":"301033.SZ"},{"name":"精锋医疗-B","symbol":"9996.HK"}]},{"sector":"银行","stocks":[{"name":"渣打集团","symbol":"2888.HK"}]},{"sector":"公用","stocks":[{"name":"福能股份","symbol":"600483.SH"}]},{"sector":"中小盘","stocks":[{"name":"青达环保","symbol":"688501.SH"}]}]}],"reports":[{"id":"csc-r0805-hk-rebound","title_zh":"港股是反弹还是反转？——港股研究系列（一）","type":"macro","sector":"宏观研究","market":"HK","tickers":[],"priority":"⭐⭐⭐","ms_rating":"","target_price":"","one_liner":"本轮港股反弹可理解为全球科技从硬件瓶颈转向应用变现的镜像，亦是港股自身压力边际缓和后的估值修复。走向长牛仍需跨过盈利改善与美元流动性松弛两道门槛；此前更接近超跌修复而非趋势反转。","user_judgment":"跟踪","order":1,"pdf_name":"【中信建投宏观研究】港股是反弹还是反转？.pdf","pdf_path":"C:/ai/reports/research-board/中信建投研报合集/宏观研究/【中信建投宏观研究】港股是反弹还是反转？.pdf","broker_id":"csc","broker_name_zh":"中信建投","source_folder":"宏观研究","hotspot_tags":["港股","AI科技","流动性"]}]},"20260703":{"batch":{"date":"20260703","date_label":"2026年7月3日","report_count":0},"macro_sections":[],"lead_bullets":[],"morning_notes":[{"id":"csc-m20260703","order":1,"title_zh":"中信建投晨会纪要（7月3日）","source_folder":"晨会纪要","pdf_name":"中信建投晨会纪要－20260703.pdf","core_views":[{"sector":"其他","analyst_title":"首席分析师","analyst_name":"刘乐文","title":"可选消费品全球复盘系列十社商","summary":"1、K 型分化已经接近极值。2、AI 的发展造成的影响可能掩盖了经济本身的承压。3、贸易争端让位于能源危机成为制约经济发展的威胁。4、消费股价和估值受到压制是全球普遍现象，需等待新的分配体系建立；信用体系潜在风险的积累已经部分反馈。K 型分化难以持续，经济增长的同时中产消费继续向性价比转移。AI 并不一定是主要因素。能源危机重塑供应链体系。"},{"sector":"其他","analyst_title":"首席分析师","analyst_name":"杨艾莉","title":"明略科技-W(2718):AI-Native营销公司，数据与模型优势，驱动Agentic业务AI互联网","summary":"核心观点公司正处于从传统数据智能向Agentic AI 战略转型的关键期，新业务AgenticServices 去年下半年落地即兑现高增长，2025 年收入突破1 亿元。Agentic Services 未来增长点来自：1）强β：AI 需求旺盛，企业AI Agent 赛道万亿市场，长期成长空间充足。"},{"sector":"其他","analyst_title":"首席分析师","analyst_name":"朱玥","title":"聚和材料(688503):国产空白掩模版先行者，致力于打造泛半导体材料平台电新","summary":"光伏银浆龙头地位稳固，致力于打造泛半导体材料平台。公司通过收购SK Enpluse 旗下空白掩模版进军半导体领域，制程覆盖18-90nm 节点，已通过SK 海力士、TMC、迪思微、中微掩模等客户认证并实现批量销售；AI 时代芯片多样化+超级扩产周期共振，制程升级驱动空白掩模版量价倍数级增长；目前国内空白掩模国产化率几乎为零，将直接受益中韩半导体景气周期。"}],"stock_recs_by_sector":[{"sector":"机械","stocks":[{"name":"中国动力","symbol":""}]},{"sector":"医疗器械","stocks":[{"name":"微创机器人","symbol":""},{"name":"惠泰医疗","symbol":""},{"name":"爱康医疗","symbol":""},{"name":"英科医疗","symbol":""},{"name":"迈普医学","symbol":"301033.SZ"}]},{"sector":"电新","stocks":[{"name":"东方电气","symbol":""},{"name":"大金重工","symbol":""}]},{"sector":"地产","stocks":[{"name":"新鸿基地产","symbol":""}]},{"sector":"军工","stocks":[{"name":"国机精工","symbol":""}]},{"sector":"非银","stocks":[{"name":"中国平安","symbol":""}]},{"sector":"家电","stocks":[{"name":"春风动力","symbol":""},{"name":"涛涛车业","symbol":""}]},{"sector":"医药","stocks":[{"name":"欧林生物","symbol":""}]}]}],"reports":[]},"20260710":{"batch":{"date":"20260710","date_label":"2026年7月10日","report_count":1},"macro_sections":[],"lead_bullets":[{"order":1,"tag":"公司点评","headline":"西测测试商业航天载荷超级工厂","tickers":[{"symbol":"301306","sentiment":"跟踪"}],"judgment":"跟踪","text":"西测测试战略
