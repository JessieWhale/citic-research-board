  function hideTip() { tip.classList.remove('visible'); }
  function positionTip(el) {
    const r = el.getBoundingClientRect();
    const margin = 8; const gap = 4;
    let top = r.bottom + gap;
    let left = r.left;
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
    const tr = tip.getBoundingClientRect();
    if (tr.bottom > window.innerHeight - margin) top = r.top - tr.height - gap;
    if (tr.right > window.innerWidth - margin) left = Math.max(margin, window.innerWidth - tr.width - margin);
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';

  function sortReports(reports) {
    return reports.map((r,i) => ({r,i})).sort((a,b) => {
      // 研报清单：时间倒序（新→旧）；同日再按优先级 / 自选 / order
      const da = a.r._date || '';
      const db = b.r._date || '';
      if (da !== db) return db.localeCompare(da);
      const pr = priorityRank(a.r.priority) - priorityRank(b.r.priority);
      if (pr) return pr;
      const wl = Number(onWatchlist(b.r)) - Number(onWatchlist(a.r));
      if (wl) return wl;
      const oa = a.r.order ?? a.i, ob = b.r.order ?? b.i;
      return oa !== ob ? oa - ob : a.i - b.i;
    }).map(x => x.r);

  function tickerBare(sym) {
    return String(sym || '').replace(/\.(HK|SZ|SH|SS)$/i, '');
  }
  function inferNameFromTitle(sym, title) {
    if (!title || !sym) return '';
    const bare = tickerBare(sym).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const re = new RegExp(`([\\u4e00-\\u9fffA-Za-z][\\u4e00-\\u9fffA-Za-z0-9·\\-]{0,24})\\s*[（(]\\s*${bare}`, 'i');
    const m = title.match(re);
    return m ? m[1] : '';
  }
  function buildStockUniverse() {
    const map = new Map();
    Object.keys(BOARDS).sort().forEach(dk => {
      const board = BOARDS[dk];
      (board.reports || []).forEach(r => {
        if (isMorningReport(r)) return;
        (r.tickers || []).forEach(sym => {
          if (!sym) return;
          const key = String(sym).toUpperCase() === sym ? sym : sym;
          let entry = map.get(sym);
          if (!entry) {
            entry = {
              symbol: sym,
              name: KNOWN_STOCK_NAMES[sym] || KNOWN_STOCK_NAMES[sym.toUpperCase()] || '',
              count: 0,
              reports: []
            };
            map.set(sym, entry);
          }
          if (!entry.name) entry.name = inferNameFromTitle(sym, r.title_zh || '');
          entry.count += 1;
          entry.reports.push({
            id: r.id,
            date: dk,
            title_zh: r.title_zh,
            one_liner: r.one_liner,
            user_judgment: r.user_judgment,
            priority: r.priority,
            source_folder: reportFolder(r),
            ms_rating: r.ms_rating,
            target_price: r.target_price,
            sector: r.sector,
            market: r.market
          });
        });
      });
    });
    return [...map.values()]
      .map(e => {
        e.reports.sort((a, b) => b.date.localeCompare(a.date));
        e.label = e.name ? `${e.name} ${e.symbol}` : e.symbol;
        return e;
      })
      .sort((a, b) => a.label.localeCompare(b.label, 'zh'));
  }
  const STOCK_UNIVERSE = buildStockUniverse();
  const STOCK_BY_SYM = Object.fromEntries(STOCK_UNIVERSE.map(s => [s.symbol, s]));

  function boardAsOfKey() {
    const dates = (INDEX.calendar.available_dates || []).slice().sort();
    return dates.length ? dates[dates.length - 1] : '';
  }
  function shiftDateKey(key, deltaDays) {
    if (!key || !/^\d{8}$/.test(key)) return '';
    const d = new Date(+key.slice(0, 4), +key.slice(4, 6) - 1, +key.slice(6, 8));
    d.setDate(d.getDate() + deltaDays);
    return dateKey(d.getFullYear(), d.getMonth() + 1, d.getDate());
  }
  function recentWindowBounds(days = 30) {
    const end = boardAsOfKey();
    if (!end) return { start: '', end: '' };
    return { start: shiftDateKey(end, -(days - 1)), end };
  }
  function topRecentStockRecs(limit = 5) {
    const { start, end } = recentWindowBounds(30);
    const counts = new Map();
    if (!start) return [];
    Object.keys(BOARDS).forEach(dk => {
      if (dk < start || dk > end) return;
      (BOARDS[dk].reports || []).forEach(r => {
        if (isMorningReport(r)) return;
        (r.tickers || []).forEach(sym => {
          if (!sym) return;
          counts.set(sym, (counts.get(sym) || 0) + 1);
        });
      });
    });
    return [...counts.entries()]
      .map(([symbol, count]) => ({
        symbol,
        count,
        label: (STOCK_BY_SYM[symbol] && STOCK_BY_SYM[symbol].label) || symbol
      }))
      .sort((a, b) => b.count - a.count || a.label.localeCompare(b.label, 'zh'))
      .slice(0, limit);
  }
  function topRecentHotspotRecs(limit = 5) {
    const { start, end } = recentWindowBounds(30);
    const counts = new Map();
    if (!start) return [];
    Object.keys(BOARDS).forEach(dk => {
      if (dk < start || dk > end) return;
      (BOARDS[dk].reports || []).forEach(r => {
        if (isMorningReport(r)) return;
        const folder = reportFolder(r);
        if (!folder.includes('宏观')) return;
        inferHotspotTags({ ...r, source_folder: folder }).forEach(tag => {
          counts.set(tag, (counts.get(tag) || 0) + 1);
        });
      });
    });
    return [...counts.entries()]
      .map(([tag, count]) => ({ tag, count }))
      .sort((a, b) => b.count - a.count || a.tag.localeCompare(b.tag, 'zh'))
      .slice(0, limit);
  }

  function inferHotspotTags(report) {
    if (Array.isArray(report.hotspot_tags) && report.hotspot_tags.length) {
      return report.hotspot_tags.slice();
    }
    const text = `${report.title_zh || ''} ${report.one_liner || ''} ${report.source_folder || ''}`;
    const tags = [];
    for (const [tag, aliases] of MACRO_HOTSPOT_FALLBACK) {
      if (tag === '宏观总论' || tag === '海外宏观') continue;
      if (aliases.some(a => text.includes(a))) tags.push(tag);
    }
    if (!tags.length) {
      if ((report.source_folder || '').includes('政策')) tags.push('政策改革');
      else if ((report.source_folder || '').includes('海外')) tags.push('海外宏观');
      else tags.push('宏观总论');
    }
    return tags;
  }
  function buildHotspotUniverse() {
    const map = new Map();
    Object.keys(BOARDS).sort().forEach(dk => {
      const board = BOARDS[dk];
      (board.reports || []).forEach(r => {
        const folder = reportFolder(r);
        if (isMorningReport(r) || !folder.includes('宏观')) return;
        const tags = inferHotspotTags({ ...r, source_folder: folder });
        tags.forEach(tag => {
          let entry = map.get(tag);
          if (!entry) {
            entry = { tag, count: 0, reports: [] };
            map.set(tag, entry);
          }
          entry.count += 1;
          entry.reports.push({
            id: r.id,
            date: dk,
            title_zh: r.title_zh,
            one_liner: r.one_liner,
            user_judgment: r.user_judgment,
            priority: r.priority,
            source_folder: folder,
            hotspot_tags: tags,
            ms_rating: r.ms_rating,
            target_price: r.target_price
          });
        });
      });
    });
    return [...map.values()]
      .map(e => {
        e.reports.sort((a, b) => b.date.localeCompare(a.date));
        return e;
      })
      .sort((a, b) => b.count - a.count || a.tag.localeCompare(b.tag, 'zh'));
  }
  const HOTSPOT_UNIVERSE = buildHotspotUniverse();
  const HOTSPOT_BY_TAG = Object.fromEntries(HOTSPOT_UNIVERSE.map(h => [h.tag, h]));

  function setHotspotPopoverOpen(open) {
    const pop = document.getElementById('hotspot-popover');
    const trigger = document.getElementById('hotspot-trigger');
    if (!pop || !trigger) return;
    pop.classList.toggle('hidden', !open);
    trigger.classList.toggle('open', open);
    trigger.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open) {
      const input = document.getElementById('hotspot-search');
      if (input) {
        input.value = hotspotSearchQuery;
        setTimeout(() => input.focus(), 0);
      }
      renderHotspotOptions();
    }
  }
  function updateHotspotTrigger() {
    const trigger = document.getElementById('hotspot-trigger');
    if (!trigger) return;
    trigger.textContent = selectedHotspot || '选择热点话题';
  }
  function filteredHotspots() {
    const q = hotspotSearchQuery.trim().toLowerCase();
    if (!q) return HOTSPOT_UNIVERSE;
    return HOTSPOT_UNIVERSE.filter(h => h.tag.toLowerCase().includes(q));
  }
  function renderHotspotOptions() {
    const box = document.getElementById('hotspot-options');
    if (!box) return;
    const list = filteredHotspots();
    if (!list.length) {
      box.innerHTML = '<p class="muted" style="padding:10px 12px;margin:0">无匹配热点</p>';
      return;
    }
    box.innerHTML = list.map(h => `
      <button type="button" class="stock-option${selectedHotspot===h.tag?' active':''}" data-hotspot="${escapeHtml(h.tag)}" role="option">
        ${escapeHtml(h.tag)}
        <span class="muted" style="float:right">${h.count}</span>
      </button>`).join('');
    box.querySelectorAll('[data-hotspot]').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        selectedHotspot = btn.dataset.hotspot;
        hotspotSearchQuery = '';
        setHotspotPopoverOpen(false);
        renderMacroHotspot();
      };
    });
  }
  function renderMacroHotspot() {
    updateHotspotTrigger();
    renderHotspotRecommend();
    const body = document.getElementById('macro-hotspot-body');
    if (!body) return;
    if (!selectedHotspot) {
      body.innerHTML = '<p class="muted">请先选择热点话题</p>';
      return;
    }
    const spot = HOTSPOT_BY_TAG[selectedHotspot];
    if (!spot) {
      body.innerHTML = '<p class="muted">未找到该热点</p>';
      return;
    }
    const items = spot.reports;
    body.innerHTML = `
      <div class="row" style="margin-bottom:10px;">
        <strong>${escapeHtml(spot.tag)}</strong>
        <span class="muted">共 ${items.length} 条相关宏观研报</span>
      </div>
      ${items.map(r => `
        <div class="hotspot-track-item">
          <div class="row" style="margin-bottom:6px;justify-content:space-between;">
            <div class="row">
              <span class="muted">${escapeHtml(dateLabel(r.date))}</span>
              ${r.source_folder ? `<span class="lead-tag">【${escapeHtml(r.source_folder)}】</span>` : ''}
              <span class="pill ${judgmentClass(r.user_judgment)}">${escapeHtml(r.user_judgment || '—')}</span>
              <span class="muted">${escapeHtml(r.priority || '')}</span>
            </div>
            <button type="button" class="btn-link" data-goto-report="${escapeHtml(r.id)}" data-goto-date="${escapeHtml(r.date)}">跳转展开清单详情</button>
          </div>
          <div style="margin-bottom:6px">${(r.hotspot_tags || []).map(t => `<span class="hotspot-pill">${escapeHtml(t)}</span>`).join('')}</div>
          <div style="font-weight:600;margin-bottom:4px">${escapeHtml(r.title_zh)}</div>
          <div class="muted" style="font-size:.875rem">${renderGlossHtml(r.one_liner || '暂无观点摘要')}</div>
        </div>`).join('')}`;
    body.querySelectorAll('[data-goto-report]').forEach(btn => {
      btn.onclick = () => gotoReportInList(btn.dataset.gotoReport, btn.dataset.gotoDate);
    });
  }

  function renderAll() {
    renderBrokerBar();
    renderFolderBar();
    if (morningRange) {
      morningRange.updateTrigger();
      if (morningRange.isOpen()) morningRange.renderCalendar();
    }
    if (reportRange) {
      reportRange.updateTrigger();
      if (reportRange.isOpen()) reportRange.renderCalendar();
    }
    renderMorningBrief();
    renderDay();
    renderStockTrack();
    renderMacroHotspot();
  }

  morningRange = createDateRange('morning', morningAvailableDates, {
    onOpen: () => { if (reportRange) reportRange.setOpen(false); },
    onChange: () => { renderMorningBrief(); morningRange.updateTrigger(); }
  });
  reportRange = createDateRange('reports', availableDatesForFilter, {
    onOpen: () => { if (morningRange) morningRange.setOpen(false); },
    onChange: () => {
      expandedReportId = '';
      renderDay();
      reportRange.updateTrigger();
    }
  });
  morningRange.init();
  reportRange.init();
  morningRange.bind();
  reportRange.bind();

  const metaEl = document.getElementById('board-meta');
  if (metaEl) {
    const parts = [];
    if (INDEX.broker_name_zh) parts.push(INDEX.broker_name_zh);
    if (INDEX.mode === 'multi') parts.push('多券商合并');
    else if (MULTI_MODE) parts.push('多券商');
    metaEl.textContent = parts.join(' · ');
  }
  document.getElementById('updated-at').textContent = '更新：' + (INDEX.updated_at || '');
  document.addEventListener('click', () => {
    if (morningRange) morningRange.setOpen(false);
    if (reportRange) reportRange.setOpen(false);
    setStockPopoverOpen(false);
    setHotspotPopoverOpen(false);
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (morningRange) morningRange.setOpen(false);
      if (reportRange) reportRange.setOpen(false);
      setStockPopoverOpen(false);
      setHotspotPopoverOpen(false);
    }
  });

  document.getElementById('stock-trigger').onclick = (e) => {
    e.stopPropagation();
    const pop = document.getElementById('stock-popover');
    setStockPopoverOpen(pop.classList.contains('hidden'));
  };
  document.getElementById('stock-popover').onclick = (e) => e.stopPropagation();
  document.getElementById('stock-search').oninput = (e) => {
    stockSearchQuery = e.target.value || '';
    renderStockOptions();
  };
  document.getElementById('stock-search').onkeydown = (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      const list = filteredStocks();
      if (list.length) {
        selectedStock = list[0].symbol;
        stockSearchQuery = '';
        setStockPopoverOpen(false);
        renderStockTrack();
      }
    }
  };

  document.getElementById('hotspot-trigger').onclick = (e) => {
    e.stopPropagation();
    setStockPopoverOpen(false);
    const pop = document.getElementById('hotspot-popover');
    setHotspotPopoverOpen(pop.classList.contains('hidden'));
  };
  document.getElementById('hotspot-popover').onclick = (e) => e.stopPropagation();
  document.getElementById('hotspot-search').oninput = (e) => {
    hotspotSearchQuery = e.target.value || '';
    renderHotspotOptions();
  };
  document.getElementById('hotspot-search').onkeydown = (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      const list = filteredHotspots();
      if (list.length) {
        selectedHotspot = list[0].tag;
        hotspotSearchQuery = '';
        setHotspotPopoverOpen(false);
        renderMacroHotspot();
      }
    }
  };

  document.getElementById('pdf-back').onclick = () => closePdfReader();
  document.getElementById('xlsx-back').onclick = () => closeXlsxReader();

  const themeBtn = document.getElementById('theme-toggle');
  const saved = localStorage.getItem('research-board-theme');
  if (saved) document.documentElement.dataset.theme = saved;
  themeBtn.onclick = () => {
    const cur = document.documentElement.dataset.theme;
    const next = cur === 'dark' ? 'light' : cur === 'light' ? '' : 'dark';
    if (next) document.documentElement.dataset.theme = next;
    else delete document.documentElement.dataset.theme;
    localStorage.setItem('research-board-theme', next);
  };

  renderAll();
})();
</script>
</body>
</html>
