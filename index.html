2.62 亿元，同比增 加7%，保持稳健。","公司从资管行业向企业级AI 数据平台的跨行 业能力得到验证，商业化进入加速阶段。","3. Token 调用打造第二曲线。","公司未来将推动Token 付费的商业模 式，在核心数据基础设施、垂类模型数据精炼、AI 系统数据底 座、Token 计价商业模式和数据资产化领域建立发展的新方向。"]},{"title":"跟踪点","lines":["Token 商业化节奏与毛利率变化。","跨行业大客户验证与资管主业稳健性。"]}],"title":"收入高增，Token 调用打造第二曲线"},"r0628-guangbang":{"sections":[{"title":"核心观点","lines":["光棒及光纤扩产潮来袭。","今年以来，光纤价格大幅上涨，投资回 报率显著提升，推动亨通光电、远东股份、通鼎互联、合盛硅 业、大族激光等启动光棒扩产计划。","我们认为，AI 的发展对光纤 的需求拉动明显，目前行业依然供不应求。","虽然多家公司计划扩 产，但一是多数公司过往光棒制造经验较少，是否可以如期扩产 仍需观察，二是即使如期扩产，但大部分产能释放要在明年下半 年或者更晚，因此对于今年、甚至明年的行业供需格局影响不 大，而且AI 的需求也可能更为强劲，因此短期内无需过度担忧。","OpenAI发布新一代AI模型GPT-5.6系列，包含Sol、Terra、Luna 三个版本。","我们继续对AI 大模型保持乐观。","我们持续推荐AI 产 业链，建议持续重点配置AI 算力产业链。","行情回顾 本期通信板块有所回调。"]},{"title":"推荐组合（当期）","lines":["中际旭创、新易盛、源杰科技、亨通光电、中天科技、锐捷网络。"]}],"title":"光棒扩产潮无需过度担忧，GPT-5.6 发布，持续推荐 AI 产业链"},"r0629-tencent":{"sections":[{"title":"核心观点","lines":["WorkBuddy 由腾讯云事业群在2026 年3 月推出，目前已经成为 按DAU 计Workbuddy 已成为国内DAU 第一的办公效率智能体。","Workbuddy 以强产品力突出重围，产品亮点在于多模型策略、封 装成熟的场景案例与技能、强harnees 表现。","此外与腾讯生态深 度融合，实现跨产品串流。","WorkBuddy 微信小程序，支持云端沙 箱与本机远程双模式运行，帮助用户在PC 和移动端之间无缝切 换，实现在微信和企微中接收通知、发起任务和查看结果等功能。","当前腾讯 AI 布局较为清晰：微信 Agent，定位C 端和用户的生 活娱乐助手；WorkBuddy：补充B 端场景和用户的生产效率需求。","Workbuddy 超预期的发展速度，是腾讯产品能力和生态能力在AI 领域的体现。","微信agent 小微近期也已开始灰度测试，市场对于 腾讯AI 领域的布局与入口价值仍有所低估。","维持买入评级。"]},{"title":"财务锚点（报告预测）","lines":["2026E 营业收入约 8290 亿元，Non-IFRS 净利润约 2753 亿元（报告表格口径）。"]},{"title":"跟踪点","lines":["WorkBuddy DAU/付费与企业微信协同。","微信 Agent 灰度推进与混元模型产品化。"]}],"title":"WorkBuddy——腾讯 AI 生产力工具布局先锋"},"r0630-karrie":{"sections":[{"title":"核心观点","lines":["2025/26 财年，得益于AI 伺服器产品需求增长，叠加产品结构优 化及泰国基地运营效率改善，公司业绩快速增长，盈利能力提升。","面对AI产业机会，公司积极拓展AI相关新品类与优质客户，ASIC 相关伺服器产品于2025/26 财年下半年批量交付，AI 相关伺服器 产品收入占伺服器机壳比例从2024/25 财年的约3%提升至 2025/26 财年的约12%，AI 业务开始成为公司业绩增长的核心驱 动力，带动整体成长预期乐观。","事件 公司发布2025/26 财年年报。","2025/26 财年，公司营收34.70 亿港 元，同比增长7.4%；公司权益持有人应占溢利2.71 亿港元，同 比增长32.5%。","简评"]},{"title":"跟踪点","lines":["AI/ASIC 机壳订单与泰国基地效率。","新品类与优质客户拓展进度。"]}],"title":"业绩快速增长，AI 服务器业务成核心驱动"},"r0701-diamond":{"sections":[{"title":"核心观点","lines":["金刚石散热材料商业化进程持续提速，AI服务器、消费电子两大赛道均出现规模化落地产品。","算力侧，神达、AMD 金刚石散热AI服务器、曙光数创兆瓦级金刚石铜浸没液冷整机柜已批量商用，Akash金刚石冷却GPU服务器斩获大额订单；消 费端微星游戏显卡、联想AI轻薄本、高端PC水冷头均导入金刚石复合散热方案。","英特尔新一代服务器处理器也有望配套金刚石 导热材料。","伴随AI高算力硬件持续迭代，金刚石高导热材料替代空间广阔，产业链相关标的具备长期投资价值。","金刚石散热应用覆盖全散热链路，三大应用位置完整布局金刚石材料可覆盖芯片散热全环节。","按应用位置分为三大板块：一是 芯片封装内部，单晶金刚石用于2.5D/3D封装中介层、GPU与HBM夹层垫片，解决堆叠芯片热点堆积问题；二是冷板基材，纯金 刚石、金刚石铜复合微通道冷板逐步替代传统纯铜冷板，适配超高热流芯片散热；三是冷板与芯片盖板之间的TIM导热界面材 料，包含固态金刚石导热件、金刚石微粉导热硅脂两类路线，均优于传统液态金属、相变材料，是英伟达Rubin世代液态金属方 案淘汰后的中长期升级方向。"]},{"title":"落地案例","lines":["2026 年 3 月神达联合 AMD、Akash 推出商用金刚石散热 AI 服务器（MI350X）。","曙光数创 C8000 V3.0 采用金刚石铜微通道，单机柜功率最高约 900kW，PUE 可低至 1.04。"]},{"title":"风险","lines":["AI 需求不及预期、新材料商业化不及预期、宏观与贸易/监管变动。"]}],"title":"金刚石——高端散热材料的迈进之路"},"r0702-mininglamp":{"sections":[{"title":"核心观点","lines":["公司正处于从传统数据智能向Agentic AI 战略转型的关键期， 新业务Agentic Services 去年下半年落地即兑现高增长，2025 年收入突破1 亿元。","Agentic Services 未来增长点来自：1）强 β：AI 需求旺盛，企业AI Agent 赛道万亿市场，长期成长空间 充足。","2）场景拓展：Agentic Services 当前主要在营销场景落 地，后续有望向电商代运营、短剧等内容生成等场景拓展；3）新 平台和商业模式的落地：已推出人+Agent 协作的平台Octo，未来 有望基于token 调用收费；4）依托与腾讯的股权、业务合作，AI 应用领域深度合作，有望打开增长空间。","看好公司战略转型，其布局Agentic AI 的核心优势源于20 年行 业深耕积累的线上线下多模态商业数据（秒针营销系统），叠加 自研 DeepMiner 智能体平台等全套模型技术体系。","投资逻辑 Agentic Services 是后续增长的核心驱动。"]},{"title":"评级与价格","lines":["首次评级：买入；发布日股价 207.40 港元（2026-07-02）。"]},{"title":"跟踪点","lines":["Agentic Services 收入占比与大客户扩张。","Octo 商业化及与腾讯生态协同落地。"]}],"title":"AI-Native 营销公司，数据与模型优势驱动 Agentic 业务"},"r0705-ai-weekly":{"sections":[{"title":"核心观点","lines":["国产开源模型能力提升中，与海外模型差距在拉近；其性价比优势也 更多被海外认知到，坚定看好AI产业趋势及国产模型。","本周Meta 筹 建云基础设施业务的报道引发市场对Capex 增长的担忧，同时市场对 AI 需求和大模型公司收入增长斜率放缓的担心也在继续。","我们认为： 1）token 消耗优化是短期温和调整，并不意味着AI 需求增长乏力。","据Evidence Lab，仅8%的企业已在生产环境中大规模部署AI Agent。","泛化的Coding 场景之外，金融、法律、AI For Science 等场景的渗透 均不充分，大模型厂商均在积极推进细分场景的模型落地。","Anthropic 本周推出旗舰科研产品Claude Science，定位\"科研界的 Claude Code\"，帮助自主完成计算生物学与药物研发中的实际工作。","豆包、智谱均已与Wind 在模型方面合作；MiniMax 已推出 \"10x Team\" 计划，高薪招募经济学、金融等顶尖专家，将行业Know- How 转化为模型能力。"]},{"title":"本周线索","lines":["Meta 筹建云基础设施出售富余算力引发 Capex 担忧，报告认为并非算力过剩信号。","Anthropic 推 Claude Science；豆包/智谱与 Wind 合作；MiniMax「10x Team」计划。"]}],"title":"DeepSeek 将实施波峰波谷定价，Meta 拟出售富余算力"},"r0705-comm-w1":{"sections":[{"title":"核心观点","lines":["Anthropic 称Fable5相关限制已于6月30日解除，并从7 月1 日起 恢复访问。","这一事件表明全球顶尖模型能力已进入高敏感、高监 管的新阶段。","Meta 正在推进云业务以出售富余AI 算力。","我们认为，一旦Meta 大模型发展策略转变，或拟推出的云业务发展不及预期，对其未 来资本开支还是有影响的，但这并非是当前算力产能过剩的信 号，继续看好算力产业链中的核心环节。","华为半导体负责人何庭波于7 月3 日发布《面向多层级电子系统 的时间缩微理论》（“韬定律”）V2 版本。","相较V1 版本，新版论 文补充了大量工程落地细节、实测量化数据与产品演进路线，进 一步完善了以时间常数τ为核心的后摩尔时代缩放理论体系。","我 们认为，韬定律对于国内芯片的持续迭代意义重大，持续看好国 产算力链。","行情回顾 本期通信板块有所回调。"]},{"title":"推荐组合","lines":["中际旭创、新易盛、源杰科技、润泽科技、联讯仪器、鼎通科技。"]}],"title":"韬定律更新，看好国产算力产业链"},"r0708-netease":{"sections":[{"title":"核心观点","lines":["公司6 月30 日完成双重主要上市，并于同日进入港股通，流 动性预计持续改善。","2025 财年公司的港股成交量占全球成交 量比重达55%以上，成为首家被动触发该条款的港股上市公 司。","公司选择自2026 年6 月30 日起正式转换，同日已纳入港 股通，预计公司港股流动性将显著提升，估值折价有望收敛。","公司产品战略向“少而精”转变，关注《遗忘之海》《无限大》 等新品周期。","年内新品《遗忘之海》主打海洋冒险开放世界 RPG，产品题材新颖，具备一定差异化属性，PC 端定档7 月9 日；《无限大》定位二次元都市开放世界，市场关注度高，预 计于2027 年上线。","两款产品兼具品质壁垒和全球化潜力，预 计为公司带来确定性利润增量，后续表现值得持续关注。","事件 公司于2026 年3 月2 日因2025 财年港股成交量占全球比重超过 55%阈值，触发“交易重心转移”条款。","公司公告自6 月30 日起 正式转为香港双重主要上市，当日已被纳入港股通。"]},{"title":"跟踪点","lines":["新品首发数据与长线流水。","港股通资金流入与估值修复节奏。"]}],"title":"入通改善流动性，关注《遗忘之海》《无限大》新品周期"},"r0712-ai-weekly":{"sections":[{"title":"核心观点","lines":["坚定看好AI 产业趋势，本周全球多家模型厂商推出新模型，大模型 能力提升与商业化成为两条并行的主线。","预计三季度海内外模型厂商 将密集发布大版本。","1）大模型竞争激烈，头部模型快速迭代以保持自身领先身位，第二梯 队厂商在快速追赶，预计定价仍将继续分化。","本周GPT 5.6 全量上线， 腾讯、Meta 和xAI 陆续发布新模型Hy 3 正式版、Muse Spark 1.1、 Grok 4.5，Agent 能力提升明显，虽然不是SOTA，但性价比突出。","2）快速打造AI 业务商业闭环的重要性日益突显。","从目前态势看， 头部模型的盈利能力显著更优。","多家大模型厂商在通过产品化、自 研芯片、重组已有业务/资源等方式提升盈利性。","SemiAnalysis 预计Anthropic Q3 继续盈利，GAAP 经营利润有望超 10 亿美元（Q2 经营性盈利5 亿美金）对应利润率约6%，综合毛利 率改善至约65%、API 业务毛利率80%以上。"]},{"title":"后续关注","lines":["Seedance 2.5、Gemini 3.5 Pro、海螺 3、GPT-6、Kimi K3 等大版本节奏。"]}],"title":"GPT-5.6、Grok4.5、腾讯混元3 正式版齐上线"},"r0712-comm-w2":{"sections":[{"title":"核心观点","lines":["Meta 扎克伯格出来解释布局AI云业务是顺应外部客户对模型和算 力的旺盛需求，同时提升基础设施投入的利用率和变现效率，并 不意味着Meta 削减AI 投入或算力需求见顶。","Meta 仍计划将计算 能力由2026 年约7GW 提升至2027 年14GW。","DeepSeek与智谱传出布局自研AI芯片的消息。","两家公司向芯片环 节延伸，将推动国产算力产业链持续迭代。","我们持续看好国内大模型厂商及算力产业链（含国内与北美）。","我国长征十号乙运载火箭于海南商业航天发射场首飞，一子级通 过全球首创海上网系捕获方案，实现我国首次大运力入轨火箭一 子级完整可控回收，标志着中国成为继美国后，第二个掌握大运 力可回收液体火箭完整工程体系的国家。","这对国内商业航天、卫 星互联网、太空算力等发展意义重大，建议关注。","行情回顾 本期通信板块有所回调。"]},{"title":"推荐组合","lines":["中际旭创、新易盛、源杰科技、鼎通科技、铖昌科技、润泽科技。"]}],"title":"继续看好 AI 链，关注火箭回收投资机会"},"r0719-ai-weekly":{"sections":[{"title":"核心观点","lines":["坚定看好AI 产业趋势。","我们认为，K3 是本周全球大模型行业的分水 岭事件，也是另一个DeepSeek 时刻：K3 的发布意味着中国大模型第 一次以“竞争威胁”身份进入全球大模型叙事——2.8 万亿参数 + 100 万上下文 + Code Arena 登顶，证明国产模型已在Agentic Coding 主 战场与美国前沿模型正面交锋。","其他建议重点关注应用层机会：1）K3 提升了开源模型智能水平，应用层使用tier1 模型的门槛、成本预计均 将降低，利好后续应用场景进一步打开；2）头部和第二梯队模型厂商 的竞争均较为激烈，竞争维度已经从模型能力延伸至价格、产品力、 场景拓展、成本优化等，我们认为利好应用层。","1）国产开源模型在全球大模型叙事中的身位再进一步，K3 的入局 预计将加剧Tier1 模型的竞争。","①OpenAI、Anthropic 动作不断以提升自身模型的吸引力。"]},{"title":"投资含义","lines":["继续看好 AI 产业趋势，重点关注应用层机会。"]}],"title":"Kimi K3 达全球 Tier1，国产再现 DeepSeek 时刻"},"r0719-comm-w3":{"sections":[{"title":"核心观点","lines":["月之暗面推出新一代开源旗舰模型Kimi K3，总参数规模达到2.8 万亿，是首个进入近3 万亿参数级别的开源模型。","Kimi K3 在复杂推理、代码生成、长上下文处理及Agent 任务执行 等核心能力上实现明显跃升，反映国产大模型正加速缩小与海外 前沿模型的差距，并由单纯参数扩张转向模型能力、推理效率和 应用落地的全面突破。","随着国产模型持续迭代、用户调用量和推理需求快速增长，国内 算力基础设施有望迎来新一轮扩容，建议重点关注国产大模型厂 商，以及国产算力产业链投资机会。","行情回顾 本期通信板块有所回调。","通信（申万）指数下跌13.14%，跑输沪 深300 指数7.87pcts 。","二级子行业（申万）中，通信服务下跌 5.27%，通信设备下跌14.13%。","推荐组合 本期推荐：中际旭创、新易盛、源杰科技、鼎通科技、润泽科 技。","上期回顾：上期投资组合“中际旭创、新易盛、源杰科技、鼎通科 技、铖昌科技、润泽科技”，相同权重测算平均下跌16.28% ，跑 输通信(申万)指数3.14pcts，跑输沪深300 指数11.01pcts。"]},{"title":"推荐组合","lines":["中际旭创、新易盛、源杰科技、鼎通科技、润泽科技。"]}],"title":"月之暗面发布 Kimi K3，看好国产 AI 产业链"},"r0721-yuewen":{"sections":[{"title":"核心观点","lines":["看好加码AI 短剧漫剧，推出自有平台，完善变现路径。","公司 先后上线海外漫剧平台ToonScroll 和国内短剧平台起点剧场，并 发布升级版AI 创作工具漫剧助手DramaBuddy，构建起“网文— IP 改编—AI 制作—发行—变现”的完整闭环。","从布局看，公司有望借助AI 进一步提升IP 变现潜力。","头部 网文IP 继续推进影游作品的经典变现路径，中长尾IP 借助AI 寻 求新路径，打破中长尾IP 难变现的困境。","AI 有效减少影游作品的 制作成本和时间，再通过公司构建的自有发行平台或第三方流量 平台，中长尾网文IP 能逐步获得稳定的变现出路。","对公司而言， 深厚的IP 库得以发挥出更大的商业化潜力。","我们预计2026-2028 年公司实现归母净利润10.13/13.14/ 14.02 亿元，同比增长230.57%/29.68%/6.67%，2026 年7 月20 日 收盘价对应PE 为19.95/15.39/14.42x。"]},{"title":"跟踪点","lines":["自有平台流水与 AI 制作占比。","利润兑现与 PE 修复。"]}],"title":"自有短漫剧平台，完善全系 IP 变现路径"},"r0722-zheshu":{"sections":[{"title":"核心观点","lines":["此次更名将更贴合公司“文化+科技”深度融合战略，体现公司 的战略决心。","本次更名是公司上市15 年来由传统媒体经营向数 字文化科技持续转型的阶段性确认：目前主营涉及游戏、在线 社交、技术信息服务、数字营销4 大板块，25 年营收占比 40%、7%、21%、30%。","公司以AI为核心打造“一中心、两矩阵、两网”：即新一代智 能算力中心；精品数字文娱游戏和文化新业态矩阵、AI 应用矩 阵；传播大脑“全省一张网”、以AI 应用为基础的数据营销网 络。","科技：公司自研3 个行业垂类大模型—传播大模型、浙浙 大模型、文生义大模型通过国家网信办备案；并布局杭州富 阳、北京四季青和杭州大江东三大数据中心，合计机柜超1 万 台，为阿里、网易等多家互联网科技公司提供算力服务。","事件 7 月15 日，公司发布公告，拟将中文名称由“浙报数字文化集团 股份有限公司”变更为“浙数文化科技集团股份有限公司”，证券 简称、证券代码及主营业务保持不变。"]}],"title":"拟更名科技集团，突显文化+科技战略"},"r0723-meta":{"sections":[{"title":"核心观点","lines":["Meta 近期将Spark 1.1 通过Meta Model API 向美国开发者开 放测试，该模型定位面向agentic 任务的多模态推理模型；同时推 出首款AI 图像模型Muse Image，有望与广告生产工具协同，助 力业务增长。","此外还披露下一代闭源模型“Watermelon”和首款 AI 视频模型Muse Video 的计划。","云服务有望成为新的增长曲线：扩建数据中心、锁定新兴云 厂产能、提高资本开支，通过实际行动回应AI 算力过剩的担忧。","AI 构筑增长发动机，广告支撑投入现金流：主业由AI 驱动 广告量价提升，Threads 和WhatsApp 带来增量库存。","基于全球社 交用户体量、品牌声量和技术积累等核心优势，智能眼镜和 AR/VR 眼镜有望成为Meta 布局端侧AI 的入口。","展望未来，我们认为近期应重点关注以下事项：1）2026 年 7 月底发布第二季度财报，预计将更新下半年甚至明年的AI CapEx指引；2）AI 图像模型Muse Image 正式上线后的用户的采 用率以及与广告业务的协同；3）代号“Watermelon”的下一代大 模型和AI 视频模型Muse Video 发布。"]},{"title":"近期关注","lines":["2026 年 7 月底 Q2 财报与 AI CapEx 指引更新。","Muse Image 采用率及与广告协同；Watermelon / Muse Video 发布时间表。"]}],"title":"AI 构筑主业基石，云服务打开增长空间"},"r0726-ai-weekly":{"sections":[{"title":"核心观点","lines":["大模型竞争趋于激烈，市场对CapEx 的持续性、AI 需求的增长有一 定担心，我们依然坚定看好AI 产业趋势。","1）线索1：高性能、性价 比模型的可得性显著提升，利好token 调用提升，应用场景突破。","本 周Opus 5 发布，模型能力优于Opus 4.8，定价与其持平；部分评分高 于2 倍价格的Fable 5，刷新了头部模型的性价比前沿；K3 显著提升 开源模型的能力，开源与闭源前沿首次贴身竞争，高性价比突出的模 型的智能水平贴近前沿模型。","且第三方数据显示Anthropic 7 月ARR 增长斜率依然陡峭。","2）线索2：大模型公司纷纷加大算力建设。","我们 认为，反映了AI 赛道的核心玩家对产业中长期看好，Infra 的投入可 承接更大的AI 需求、优化推理成本提升竞争优势。"]},{"title":"跟踪点","lines":["CSP 财报对 CapEx 与 AI 需求叙事的验证。","Anthropic ARR 增长斜率与开源权重落地。"]}],"title":"Opus 5 实现 SOTA 且定价与 4.8 齐平；关注 CSP 财报"},"r0726-comm-w4":{"sections":[{"title":"核心观点","lines":["谷歌再度上调2026 年资本支出指引，从此前的1800 亿美元至 1900亿美元上调至1950 亿美元至2050 亿美元。","三星电子、SK 集 团与美国科技巨头宣布达成总价值9500 亿美元的芯片合作伙伴关 系。","总体来看，目前人工智能产业景气度依旧。","近期，人工智能板块明显调整。","我们认为，原因应该叠加了交易 层面的调仓与对于未来预期的担忧。","目前算力产业链景气度依然 高企，短期存在超跌情况，但后续的产业变化也需密切跟踪。","2026Q2 通信行业公募基金持仓市值前十大个股依次为：中际旭 创、新易盛、天孚通信、亨通光电、永鼎股份、中天科技、长芯 博创、光迅科技、剑桥科技、仕佳光子，持仓市值占比通信行业 公募基金持仓总市值的94.36%。","行情回顾 本期通信板块有所回调。"]},{"title":"推荐组合","lines":["中际旭创、新易盛、工业富联、中国移动、中国电信、亿联网络。"]}],"title":"谷歌再上调 Capex，关注产业变化"},"r0802-ai-weekly":{"sections":[{"title":"核心观点","lines":["降价+开源+办公Agent 进展快，重视互联网及AI 应用机会。","1）模型 能力提升的同时，综合token 价格降低。","本周GPT-5.6 系列降价，Luna 降80%，Terra 降20%；DeepSeek V4 Flash 正式版发布，以284B 总参 /13B 激活达到国产前沿模型水平，定价为同水平模型最低。","2）Ope nAI 7 月ARR 有望提速增长，办公Agent 进展快，验证旺盛的AI 应用需 求。","OpenAI 本周内部会上，其CFO 表示7 月ARR 超过整个Q2；海 内外均在推进办公Agent 落地，国内BAT 在密集纷纷推动产品升级、 组织架构调整，海外OpenAI 推出ChatGPT Work，与Codex 整合后的 Agent 周活快速过1000 万，月内翻倍增长。","3）多模态模型快速迭代， 并走向开源，海螺3 提升前沿多模态模型可得性。","本周重要进展"]},{"title":"投资含义","lines":["降价与开源确认应用落地成本拐点，重视互联网及 AI 应用、游戏个股机会。"]}],"title":"DeepSeek V4 Flash 国产前沿最低价；看好互联网与游戏个股"},"r0803-comm-w1":{"sections":[{"title":"核心观点","lines":["2026Q2，北美头部云厂商资本开支继续高增。","2026 年四家北美云 厂商资本开支指引合计约为7200亿—7450亿美元，反映北美云厂 商仍在围绕AI 基础设施持续扩张。","目前来看，AI 算力产业链的景气度依旧，但市场近期出现明显调 整，我们认为存在超跌情况。","未来建议持续关注：一是大模型 ARR，尤其是Coding 场景ARR 的增长情况，毕竟北美大模型近 期在降价促销，如果ARR 增长短期遇到瓶颈，可能影响市场对于 未来算力需求的预期；二是Coding 之外，大模型在其它应用场景 的落地及发展情况；三是算力通胀链未来一段时间的价格走势； 四是AI 产业链各环节的融资情况及市场风偏。","此外，鉴于二季度AI 产业链持仓较重，市场近期调整，出现高低 切迹象，建议关注低估值、高股息标的。","行情回顾 本期通信板块有所回调。","通信（申万）指数下跌-10.39%，跑输沪 深300 指数9.07pcts 。","二级子行业（申万）中，通信服务上涨 2.66%，通信设备下跌12.24%。"]},{"title":"推荐组合","lines":["中际旭创、新易盛、中国移动、中国电信、中国联通、亿联网络。"]}],"title":"北美云厂 Capex 高增，关注算力超跌与高股息"},"csc-r0705-comp25":{"sections":[{"title":"核心观点","lines":["全球大模型调用量预计连续11 周环比走高，国产模型凭高 性价比占据流量前列，海外头部厂商营收预期上调。","国内厂商商 业化提速，DeepSeek 将推出分时定价，豆包已上线多档会员； Anthropic 收紧Claude 访问限制，合规地缘因素下国产替代逻辑 凸显。","算力硬件全线涨价，Intel 上调消费、服务器CPU 售价， AMD 下半年提价在即；预计三季度DRAM、NAND 合约价持续 上涨，服务器存储产能紧缺缺口延续至2027 年。","Agent AI 改变算 力成本结构，CPU、存储需求激增，硬件涨价从GPU 扩散至整条 数据中心产业链。","行情回顾： 本周，计算机（申万）指数上涨1.98%，跑赢沪深300 指数2.52pp。","投资组合： 本期建议：深信服、海光信息、鼎捷数智、浪潮信息、中科曙光、 软通动力、中控技术、海天瑞声、国能日新。","上期回顾：上期建议组合为——深信服、海光信息、鼎捷数智、 浪潮信息、中科曙光、软通动力、中控技术、海天瑞声、国能日 新，同权重下上期组合涨幅为-1.73%，同期计算机（申万）指数 涨幅为1.98%，组合超额收益-3.71%。"]},{"title":"组合提示","lines":["本期建议关注：深信服、海光信息、鼎捷数智等。"]}],"title":"大模型商业化加速，CPU等硬件持续提价"},"csc-r0712-comp26":{"sections":[{"title":"核心观点","lines":["A 股计算机中报预告与海外模型迭代共同验证AI 产业链景 气度延续：一方面，AI 服务器、智算基础设施等硬件链条业绩弹 性突出，软件及AI 应用企业也开始体现经营修复和收入落地； 另一方面，OpenAI、xAI、Meta 等海外模型持续强化Agent、 Coding、多模态和办公入口，模型竞争从能力验证转向高频场景 落地，推理侧算力消耗、基础设施投入和AI 应用商业化有望继 续共振。","推荐标的：海光信息、中科曙光、智谱（H 股）、Min iMa x （H 股）、浪潮信息、深信服、中控技术、国能日新、软通动力、 晶泰控股（H 股）、视源股份。","行情回顾： 本周，计算机（申万）指数上涨2.74%，跑赢沪深300 指数4.01pp。","投资组合： 本期建议：深信服、海光信息、鼎捷数智、浪潮信息、中科曙光、 软通动力、中控技术、海天瑞声、国能日新。","上期回顾：上期建议组合为——深信服、海光信息、鼎捷数智、 浪潮信息、中科曙光、软通动力、中控技术、海天瑞声、国能日 新，同权重下上期组合涨幅为+7.71%，同期计算机（申万）指数 涨幅为+2.74%，组合超额收益+4.97%。"]},{"title":"推荐标的","lines":["海光信息、中科曙光、智谱、MiniMax、浪潮信息、深信服、中控技术、国能日新、软通动力、晶泰控股、视源股份。"]}],"title":"AI算力景气持续，模型迭代驱动推理扩张"},"csc-r0713-xtalpi":{"sections":[{"title":"核心观点","lines":["剂泰医药与Deerfield Management 旗下Boulevard 公司达成 MTS-128 全球独家授权合作，公司获得2,000 万美元首付款，最 高16 亿美元里程碑付款及潜在销售分成，是目前国内临床前阶 段TCE 项目最大规模的授权交易。","MTS-128 从PCC 到完成BD 仅 耗时半年，验证公司\"平台合作+产品合作\"双轮驱动商业模式的高 效落地能力。","MTS-128 是NanoForge 平台AiProtein 驱动开发和优 化的三特异性TCE，后续随着AiLNP、AiRNA 以及AiTEM 平台持续 产出高质量资产，公司NanoForge 平台价值和商业化兑现能力有 望加速释放。","事件 MTS-128 实现全球授权 2026 年7 月2 日，剂泰医药宣布与Deerfield Management 旗下专注免疫疗法、抗体疗法的Boulevard 公司达成MTS-128 全 球独家授权合作。","根据协议，Boulevard 将获得MTS-128 全球范 围的开发、生产和商业化权利，公司将获得2,000 万美元首付款， 并有资格获得最高16 亿美元的开发、注册及商业化里程碑付款， 同时保留royalty 销售分成权益。"]},{"title":"跟踪点","lines":["后续 AiLNP/AiRNA/AiTEM 资产产出与 BD 节奏。"]}],"title":"MTS-128 全球授权落地，AI 蛋白平台价值加速兑现"},"csc-r0715-jd":{"sections":[{"title":"核心观点","lines":["我们预计2026Q2 京东集团收入、利润与市场一致预期基本相符， 核心盈利拐点落地。","预计集团整体收入下滑4%至3422 亿元，集 团收入增速较零售高2pct；4-5 月受去年国补高基数拖累偏弱，6 月环比明显改善。","利润侧，Q2 预计集团净利润增速同比转正， Non-GAAP 净利润为76.8 亿元，对应净利率为2.24%，去年同期 为2.07%。","26Q2 出现利润端拐点，Q3 基数改善带动收入增速修 复，出现收入侧拐点，重点跟踪苹果新机销售、消费复苏、家电 天气扰动三大变量。","简评 2026Q2 前瞻：收入、利润与市场一致预期基本相符，核心盈利 拐点落地。","预计集团整体收入下滑4%至3422 亿元，集团收入增 速较零售高2pct；4-5 月受去年国补高基数拖累偏弱，6 月环比 明显改善。"]},{"title":"评级","lines":["维持买入；目标价（6 个月）157.49 港元；发布日股价 113.80 港元（2026-07-15）。"]}],"title":"2026Q2 业绩前瞻——利润拐点，Q3 收入有望转正"},"csc-r0719-comp27":{"sections":[{"title":"核心观点","lines":["Kimi K3 发布，国产开放权重模型开始参与全球能力边界和 商业定价权竞争；后续重点观察完整权重开放后的社区部署规 模、API 调用量以及付费转化。","台积电业绩超预期并上调全年收 入指引，此前下游芯片、服务器、交换机相关公司业绩预告同样 表现亮眼，AI 硬件链条景气度传导持续，最终体现在模型侧持续 迭代与应用落地，继续看好GPU、CPU、存储、高速网络及算力 租赁服务等环节。","推荐标的：海光信息、中科曙光、智谱（H 股）、 MiniMax（H 股）、浪潮信息、深信服、中控技术、国能日新、软 通动力、晶泰控股（H 股）、视源股份。","行情回顾： 本周，计算机（申万）指数下跌9.74%，跑输沪深300 指数4.47pp。","投资组合： 本期建议：深信服、海光信息、鼎捷数智、浪潮信息、中科曙光、 软通动力、中控技术、海天瑞声、国能日新。","上期回顾：上期建议组合为——深信服、海光信息、鼎捷数智、 浪潮信息、中科曙光、软通动力、中控技术、海天瑞声、国能日 新，同权重下上期组合涨幅为-14.11%，同期计算机（申万）指数 涨幅为-9.74%，组合超额收益-4.38%。"]},{"title":"推荐标的","lines":["海光信息、中科曙光、智谱、MiniMax、浪潮信息、深信服、中控技术、国能日新、软通动力、晶泰控股、视源股份。"]}],"title":"Kimi K3 发布，台积电法说会超预期"},"csc-r0720-agent":{"sections":[{"title":"核心观点","lines":["通用办公Agent 是AI 大模型商业化落地的核心赛道之一，正处 于从产品验证向规模化渗透的转折点。","阿里巴巴以QoderWork 为 先导产品，率先完成桌面级Agent 的产品化与公测，并在集团层 面将其定位为打通大模型与数字世界的核心接口。","当前阿里正推 进QoderWork、悟空与MuleRun 三大To B Agent 的深度整合， 进一步强化通用办公Agent 赛道布局。","建议关注AI Agent 在通用 办公领域的发展及阿里在该赛道的进展。","投资要点 QoderWork：阿里ATH事业群应用层底座级产品 QoderWork是阿里巴巴面向非技术员工推出的桌面级AI Agent 产 品，是国内大厂中最快实现技术转化与全面公测的通用办公 Agent。","阿里将QoderWork 定位为打通大模型与数字世界的核心 接口，归属CEO 吴泳铭直管的ATH 事业群。","2026 年6 月吴泳铭 披露其日活、周活及Token 用量在集团所有AI 工具中位列第一。"]},{"title":"跟踪点","lines":["QoderWork DAU/付费、三大 ToB Agent 整合进度、阿里 AI 业务披露。"]}],"title":"通用办公 Agent 风起，关注阿里及 QoderWork 进展"},"csc-r0723-cnai":{"sections":[{"title":"核心观点","lines":["在出口管制持续收紧与国产替代制度性红利共振下，国产AI 芯 片正从\"政策采购标的\"向\"市场化主动选择\"跃迁，未来几年是从 规模验证走向盈利兑现的关键窗口。","我们看到供给端国产芯片产 能持续释放，需求端推理负载爆发（日均Token 调用量两年增逾 千倍）与头部CSP 持续加码的资本开支（阿里FY26 达1,261 亿 元、字节2025E 约1,600 亿）为国产芯片提供确定性需求锚。","变 现端，利润率遵循\"规模摊薄→结构优化→生态溢价\"三阶段路径， 当前处于以量换价的阶段一，未来进一步实现系统级方案出售， 通过软件+硬件绑定实现利润率的大幅优化。","要点 在出口管制持续收紧与国产替代制度性红利共振的背景下，国产 AI 芯片正从政策采购标的向市场化主动选择跃迁。","我们判断，未 来2-3 年是国产AI 芯片从规模验证走向盈利兑现的关键窗口期， 核心矛盾转向\"能不能规模化交付并持续迭代\"。","本报告回答两个 核心问题：1）空间问题：训练/推理需求增长×国产化替代率×有 效供给（制程/封装/HBM/集群交付）= 潜在市场空间。"]},{"title":"约束与机会","lines":["关注先进制程、HBM、先进封装等供给瓶颈；系统级软硬一体方案有望抬升利润率。"]}],"title":"国产 AI 基础设施的价值升级"},"csc-r0726-comp28":{"sections":[{"title":"核心观点","lines":["Intel26Q2 财报发布，单季收入增速创15 年以来新高， Hyperscaler 和企业客户强劲需求推动数据中心与AI 业务成为主 要增长引擎，Intel 预计将进一步提升资本开支以满足下游算力投 资带来的CPU 强需求。","AMD 大会上调中远期TAM，新品量产节 奏加速，CPU 景气度持续。","SK 集团与英伟达达成5000 亿美元合 作协议，围绕新一代AI 内存解决方案研发与长协供货，提升上 游扩产确定性。","AI 硬件链条景气度持续，最终体现在模型侧持续 迭代与应用落地，继续看好GPU、CPU、存储、高速网络及算力 租赁服务等环节。","推荐标的：海光信息、中科曙光、智谱（H 股）、 MiniMax（H 股）、浪潮信息、深信服、中控技术、国能日新、软 通动力、晶泰控股（H 股）、视源股份。","行情回顾： 本周，计算机（申万）指数上涨0.14%，跑输沪深300 指数2.51pp。","投资组合： 本期建议：深信服、海光信息、鼎捷数智、浪潮信息、中科曙光、 软通动力、中控技术、海天瑞声、国能日新。"]},{"title":"推荐标的","lines":["继续看好 GPU/CPU/存储/高速网络及算力租赁；组合仍围绕海光、曙光、浪潮、深信服等。"]}],"title":"头部 CPU 财报亮眼，持续推荐 AI 产业链"},"csc-r0727-adas":{"sections":[{"title":"核心观点","lines":["智能驾驶产业正由单一产品竞争迈向平台化竞争，全栈自研车 企、第三方算法供应商及智能驾驶芯片企业三类主体分别依托整 车生态、算法平台和软硬一体能力构建差异化竞争优势。","随着软 件定义汽车（SDV）持续推进，产业价值加速由硬件向软件、算 法和数据迁移，推动芯片企业向平台方案商升级，第三方算法供 应商则凭借跨品牌、跨芯片和全球化量产能力持续提升竞争力。","尽管头部车企全栈自研渗透率不断提高，但受研发投入、数据闭 环及工程能力等门槛限制，第三方平台仍是海外车企、传统车企 及中小品牌实现高阶智能驾驶量产的重要路径。","在行业整体规模 持续扩大的背景下，第三方平台市场空间仍将保持增长，平台化、 全球化及软硬协同能力将成为未来智能驾驶产业竞争的核心。"]},{"title":"跟踪点","lines":["第三方算法份额、Robotaxi 量产节奏、芯片平台化进展。"]}],"title":"车企自研格局分层，第三方供应商长期价值凸显"},"csc-r0803-comp29":{"sections":[{"title":"核心观点","lines":["海外CSP 云收入持续超预期，AI 商业化与算力投入形成正 向循环。","26Q2，Google Cloud、Azure 和AWS 收入分别同比增长 82%、43%和37%，微软商业RPO、Google Cloud backlog 和AWS backlog 分别达到6780、5139 和4960 亿美元，相当于各自年度资 本开支的2.3-4.4 倍。","谷歌、亚马逊和Meta 将2026 年资本开支指 引分别提升至1950-2050 亿美元、约2200 亿美元和1300-1450 亿 美元，微软预计FY27Q1 资本开支超过500 亿美元。","尽管高投入 导致部分厂商自由现金流承压，但服务器回收周期不足3 年、使 用寿命约5-6 年，长期合同为投资回报提供支撑；同时Copilot 付 费席位超过3000 万，企业AI 需求正由算力向办公及Agent 场景 扩散。","继续看好算力服务、国产芯片与超节点，以及B 端AI 应 用。","行情回顾： 本周，计算机（申万）指数上涨5.59%，跑赢沪深300 指数6.90pp。"]},{"title":"投资方向","lines":["关注服务器/光模块/国产芯片与超节点，以及 B 端 AI 应用；组合含深信服、海光、鼎捷、浪潮、税友等。"]}],"title":"CSP 云收入持续超预期，AI 商业飞轮持续"},"csc-r0701-3c2aa0":{"sections":[{"title":"核心观点","lines":["“六张网”是“十五五”时期我国基础设施投资的顶层统筹框架， 标志着基建投资从传统“铁公基”模式，向覆盖全要素、网络化、重安 全韧性的现代化体系实现范式升级。","本文测算“十五五”时期“六张网” 核心领域累计投资规模区间约为24.1 万亿元至29.2 万亿元，基准情景 下约26.4 万亿元，年均5.3 万亿元；整体呈现“地下管网大幅跃升、数 字与电力基建稳步抬升、传统民生类板块绝对增长但占比回落”的结构 特征与“前高后稳、结构分化”的节奏特征，资金端形成“财政核心牵 引+央企中坚支撑+社会资本重要补充”的三层架构。","产业链沿上中下游 逐层传导，工程施工、核心设备等环节率先受益，跨网协同将催生新增 量赛道。"]},{"title":"跟踪要点","lines":["来源文件夹：宏观-政策研究","报告类型标签：深度报告"]}],"title":"“六张网”投资规模全景测算与产业链受益路径探析"},"csc-r0707-705e5b":{"sections":[{"title":"核心观点","lines":["本周重点关注三方面政策：（1）证监会发布再融资改革征求意见稿， 建立储架发行制度，小额快速融资上限提升至6 亿元，兼顾融资效率与市 场稳定。","（2）国务院常务会议加码人工智能，将“超大规模智算集群建 设”上升至国家战略高度，AI 产业从“技术突破”迈向“基建先行”的新 阶段。","（3）美国6 月非农新增就业仅5.7 万人，远低于预期，加息预期骤 降推动全球资产重新定价。","短期看，非农爆冷暂时缓解了美联储7 月加息 的紧迫性，利好美债、黄金和利率敏感型成长股，利空美元；中长期看， 后续通胀数据的走向将是决定美联储政策路径的关键变量。"]},{"title":"跟踪要点","lines":["来源文件夹：宏观-政策研究","报告类型标签：重大事件"]}],"title":"本周重点关注三方面政策：（1）证监会发布再融资改革征求意见稿， 建立储架发行制度，小…"},"csc-r0731-1efa73":{"sections":[{"title":"核心观点","lines":["7 月政治局会议核心聚焦五方面：一是形势判断更加辩证务实，充分 肯定经济“动能向新、结构向优”，同时强调政策支持仍有必要。","二是宏 观政策进一步转向“发力提效”，明确充分释放存量政策效能、及时谋划 务实管用的增量政策，加大逆周期调节力度。","三是扩大内需更加注重政 策落地，消费端挖掘服务消费潜力，投资端推动“六张网”扎实推进，并 强化财政金融协同。","四是供给侧治理与科技创新同步升级，人工智能政 策向基础研究、产业化应用和新兴支柱产业培育延伸，“反内卷”迈向制 度化、常态化治理。","五是风险处置更加精准，稳定房地产市场，推进地方 中小金融机构改革化险、减量提质，同时强化就业、“一老一小”和防灾 减灾保障。"]},{"title":"跟踪要点","lines":["来源文件夹：宏观-政策研究","报告类型标签：政策解读"]}],"title":"发力提效，关注落地"},"csc-r0721-11a5b9":{"sections":[{"title":"核心观点","lines":["本周重点关注三方面政策：（1）国务院批复同意《扩大消费“十五 五”规划》。","作为首份国家级消费五年专项规划，从六大维度部署28 项 任务，明确拓宽居民财产性收入渠道，推动促消费由短期刺激转向长效机 制构建。","（2）国家发展改革委等部门发布《人工智能合作发展行动计划》。","这是国内首份AI 开放合作国家级专项文件，围绕八大方向全链条部署， 突出产学研协同、跨境开放与安全并重，将提振算力、数据要素与AI 出 海产业预期。","（3）美联储鹰派表态升温，油价供给端冲击下通胀传导风 险隐现，因地缘局势主动权旁落，货币政策陷入被动，压制全球风险偏好。"]},{"title":"跟踪要点","lines":["来源文件夹：宏观-政策研究","报告类型标签：政策解读"]}],"title":"本周重点关注三方面政策：（1）国务院批复同意《扩大消费“十五 五”规划》"},"csc-r0705-3fed36":{"sections":[{"title":"核心观点","lines":["《城市更新“十五五”规划》作为我国首部城市更新领域国家级专项 规划，标志着城市更新正式从地方零散探索上升为系统性国家战略。","经 测算，“十五五”期间全口径市场总规模约15 万亿元，将成为对冲房地 产下行、稳增长扩内需的核心压舱石。","政策基调从增量扩张转向存量提 质，构建房屋体检、养老金、保险三大全生命周期安全制度，彻底扭转 过去 “重建设轻管理” 的模式。","产业链价值呈现明显“微笑曲线”，利润 从传统施工环节向前端检测鉴定、规划设计和后端物业管理、资产运营 转移。","建议重点把握前端入口、核心工程、后端运营、配套支撑四条投 资主线，优先布局具备全链条系统集成能力的龙头企业。"]},{"title":"跟踪要点","lines":["来源文件夹：宏观-政策研究","报告类型标签：深度报告"]}],"title":"城市更新“十五五”规划解读与投资机遇分析"},"csc-r0804-7ece3f":{"sections":[{"title":"核心观点","lines":["本周重点关注三方面政策：（1）中共中央政治局会议分析研究当前 经济形势并部署下半年经济工作。","实施好更加积极的财政政策和适度宽松 的货币政策，充分发挥存量政策效能；推进“两重”“两新”和“六张网” 建设，深入实施“人工智能+”行动，继续整治“内卷式”竞争，并深化 资本市场投融资综合改革。","（2）中国人民银行于7 月29 日至31 日每日 开展6000 亿元隔夜逆回购，并安排8 月3 日再开展3000 亿元操作，合计 规模达到2.1 万亿元。","（3）美联储维持联邦基金利率3.50%—3.75%不变， 会议投票出现3 张反对加息票，内部鹰派分歧升温。","油价及地缘政治风险 支撑通胀韧性，后续货币政策仍面临被动调整压力。"]},{"title":"跟踪要点","lines":["来源文件夹：宏观-政策研究","报告类型标签：政策解读"]}],"title":"本周重点关注三方面政策：（1）中共中央政治局会议分析研究当前 经济形势并部署下半年经…"},"csc-r0723-9ca8c7":{"sections":[{"title":"核心观点","lines":["沃什上任后的政策变化，核心并非立即加息，而是以“第一性原理” 重新审视美联储货币政策框架。","7 月国会听证和《货币政策报告》显示， 五个工作组相关议题已由主席倡议进入美联储内部研究和政策评估范 围；6 月CPI、PPI 与褐皮书则表明，通胀短期降温但生产端成本仍有黏 性，经济与就业保持韧性但结构分化明显。","我们认为，沃什当前政策取 向可概括为“目标偏鹰、判断审慎、路径开放”：短期维持利率仍是基 准情景，后续方向取决于价格压力是否扩散、AI 需求能否被供给和生 产率提升吸收，以及就业和需求是否持续恶化。"]},{"title":"跟踪要点","lines":["来源文件夹：宏观-政策研究","报告类型标签：深度报告"]}],"title":"沃什政策框架的首次集中检验"},"csc-r0804-814553":{"sections":[{"title":"核心观点","lines":["7 月FOMC 会议维持联邦基金利率目标区间不变，美联储延续“观察 —确认—调整”的政策节奏，未释放明确降息信号。","6 月PCE 数据显示， 美国通胀继续改善，能源价格回落推动整体价格压力缓解，但核心通胀仍 高于2%的政策目标，服务价格黏性和消费韧性限制政策快速转向。","当前 美联储更加关注通胀回落的持续性以及货币政策框架调整后的有效性。","短 期内，维持限制性政策仍是基准情景，后续政策转向仍需更多通胀和就业 数据确认。"]},{"title":"跟踪要点","lines":["来源文件夹：宏观-政策研究","报告类型标签：重大事件"]}],"title":"美联储7月议息会议点评：通胀延续降温，政策转向仍待更多确认"},"csc-r0803-1fa894":{"sections":[{"title":"核心观点","lines":["① 美债本身处于熊市思维中，本次会议虽按兵不动，但不足以扭转空头叙事，这是根本。","② 沃什的鸽派框架，在仅有一个月非农、CPI 走弱的背景下，暂时无法被市场接受，反而酝酿 了“信誉危机”与“通胀叙事”，加剧了波动。","② 美伊恶化、美股反弹、日元干预等，在侧面起到了推波助澜。","④ 沃什的争议，并不在于其沟通方式，也不在于市场的评判，最终的审判官，还是基本面数据。","只要三季度CPI 没有二次反弹，市场会逐步接受其理念，美债仍有希望；反之，若数据指向通胀确实 上行，沃什也会认清现实，加息将不可避免。","事件： 上周，美债长端收益率出现向上突破迹象，10Y 最高升至4.745%，30Y 突破最高升至 5.28%。","简评： 上周美债的异动，市场疑惑较大。","我们对主流叙事进行梳理，判断哪些逻辑更有可能是 核心催化，并对未来走势进行展望。"]},{"title":"跟踪要点","lines":["来源文件夹：宏观-海外经济与大类资产","报告类型标签：宏观研报"]}],"title":"4．7％的美债，在交易什么？ 美债札记"},"csc-r0709-cad48b":{"sections":[{"title":"核心观点","lines":["AI 对下游的传导能力更强，但油价暂时对通胀的拉动 更大。","核心CPI 同比今年上行0.2%，而二者合计拉动近0.5%， 基本解释全部通胀压力，且剩余分项整体偏下行。","展望下半年， 基准情形下，油价去年Q4 过低，同比贡献虽下降，但仍不低；AI 贡献较当前或翻倍；二者整体影响维持在偏高水平。","通胀回落需 要期待：①油价下降、②核心商品通缩、③明年油价基数切换。","今年美国通胀两个新的上行担忧，来自AI 和能源成本的上升， 其在核心CPI 中有多少体现？"]},{"title":"跟踪要点","lines":["来源文件夹：宏观-海外经济与大类资产","报告类型标签：重大事件"]}],"title":"AI和原油对核心CPI的传导如何？"},"csc-r0727-f7dcc0":{"sections":[{"title":"核心观点","lines":["谅解备忘录的违约，与伊朗“海峡自治”和美国“自由通航”的理念分歧有关。","战事三阶段：速攻（颠覆政权、未果），佯攻（边打边谈、撤出）、久攻（以打促谈、恢复通航）。","进入阶段3，冲突长期化风险增加： ① 前期颠覆政权目标失败后，美国无意长期作战，但眼下通航目标难让步，会持续打击； ② 美国内外舆论压力下降，开始用低成本武器，长期打击可行性上升。","谈判希望仍在：伊朗要筹码，美国想通航，均有让步空间。","时点上，美国看市场和通胀反噬，伊 朗看经济约束。","与此前不同，不光要特朗普TACO，美国诉求满足/伊朗妥协也很关键。","市场方面，冲突风险上升，油价美债压制，叠加联储态度模糊、美股泡沫担忧，维持Q3 海外资 产高波动的判断，等待风险释放。","事件： 7 月11 日，美军重新启动对伊朗的军事打击，连续空袭共13 天；7 月24 日，特朗普否 决新一轮打击方案，下令暂停空袭。"]},{"title":"跟踪要点","lines":["来源文件夹：宏观-海外经济与大类资产","报告类型标签：宏观研报"]}],"title":"地缘：美伊局势，反复or反转"},"csc-r0715-dba976":{"sections":[{"title":"核心观点","lines":["① 租金在统计方法干扰后回落，下半年租金维持低位，是通胀不大幅反弹的底气。","② 核心商品通缩，显示关税影响趋尾，而能源和AI 的成本抬升向下游传导不畅，美国消费偏弱， 较难实现全面性的通胀扩散。","③ 世界杯的影响在6 月不明显，酒店价格负增，不排除涨价高峰在前期已呈现。","④ AI 扩散：最相关的设备商品价格疑似筑顶，后续关注服务类价格。","本月CPI 数据较低，逻辑线索也指向下半年上行风险可控，加息担忧将获缓解，市场迎来一丝喘息。","但目前核心矛盾，并不是CPI 高低，甚至不是联储加息，而是科技股行至高位后的泡沫担忧、以及 去杠杆风险，这些问题不会因CPI 利好而彻底解决。","仍预期三季度市场会处于高波动状态，不排除更大幅度的回撤。","事件： 6 月美国核心CPI 环比负增长0.02%，大幅低于市场预期。"]},{"title":"跟踪要点","lines":["来源文件夹：宏观-海外经济与大类资产","报告类型标签：重大事件"]}],"title":"完美CPI≠市场风险化解"},"csc-r0802-e7a786":{"sections":[{"title":"核心观点","lines":["日元5 次跳涨，从163.9 降至157.4，官方干预特征明显。","① 本次干预时点选择，重在借势：美元指数松动、贝森特背书等，4 月末干预同样发生在FOMC 后。","② 本次美国协助，不再停留在口头询价上，而是采取了抛欧元+买日元的实质动作，意图或是缓 解日本抛售美元资产。","③ 展望后续：美国实质介入或增强日元支撑（2011 年美国也曾干预日元升值，其影响远超日本 单方干预），日元短期或在155-160 震荡，但下半年大概率回到160 上方，无法逆转走弱的大 趋势；若日元再度失序贬值，财务省不排除持续干预。","④ 市场方面：干预放大短期美债压力，但美元偏弱有助于全球股市流动性改善；只要日元不持 续升值，套息逆转概率较低，但由于日元空头仓位高，若贬值趋势超预期逆转，冲击较大。","事件： 7 月30 日至8 月1 日间，日元出现多次跳涨。","截至本周收盘，美元兑日元已由163.9 的 阶段高点下行至157.4，日元升值4%。","简评： 从价格走势看，本周日元汇率有一定的官方干预特征：USD/JPY 多次在数分钟内直线下 跌，且成交量明显放大；据彭博等估算，7 月30 日首轮日元买入干预规模可能达到8.45 万亿 日元（约528 亿美元）。"]},{"title":"跟踪要点","lines":["来源文件夹：宏观-海外经济与大类资产","报告类型标签：宏观研报"]}],"title":"日元再干预，本次何不同？ 全球外汇跟踪"},"csc-r0713-43374e":{"sections":[{"title":"核心观点","lines":["日元摇摇欲坠，美元兑日元一度突破162 大关。","关注 4 个问题：（1）近期走弱，是短期基本面主导，还是长期叙事主 导？","（2）后续贬值压力到底多大？","（3）日本财务省何时再出手， 观察什么信号？","（4）又要担心套息交易逆转吗？","日元短期仍承 压，中期存在修复可能，财务省干预的概率偏低，套息交易逆转 较难发生，但一旦出现，冲击将不低。"]},{"title":"跟踪要点","lines":["来源文件夹：宏观-海外经济与大类资产","报告类型标签：宏观研报"]}],"title":"日元走弱的4个问题：全球外汇跟踪"},"csc-r0719-8e677e":{"sections":[{"title":"核心观点","lines":["① 本轮下跌主要由流动性冲击驱动，但资金流出力量已进入超卖区间，整体资金流与融资盘持续流 出，两项风险偏好指标同步下探到-1 sigma 极值区，后续卖盘力量预计边际减弱。","② 从衡量市场位置与下行空间的指标看，市场正逐步接近左侧底部。","指数筹码盈利因子已回落至-2 sigma 附近，进入较具性价比的左侧建仓区间；自“9·24”行情以来，历次该指标触及-2 sigma， 事后看均对应季度级别的阶段底部。","③ 从反弹节奏看，短期走势仍可能反复，右侧趋势尚需进一步确认。","反抽能否演化为趋势性行情， 一方面取决于技术面的二次确认，另一方面仍受产业叙事能否重新强化及美伊冲突后续演绎影响。","以3 月为例，市场通过二次探底完成底部确认，低位亦吸引短线反转资金参与，因此当前交易性 反抽的概率较高。","从指标看，若技术得分向上突破1 sigma，且指数随后未再回踩，则可视为右侧 趋势逐步开启的重要信号，后续需重点跟踪。","④ 结构上，周度更看好调整幅度最大的通信、电子等硬科技板块，中期上看均衡配置。"]},{"title":"跟踪要点","lines":["来源文件夹：宏观-海外经济与大类资产","报告类型标签：宏观研报"]}],"title":"权益见底的量价信号"},"csc-r0706-e988ff":{"sections":[{"title":"核心观点","lines":["联储内部政策立场分歧较大，沃什上任后，如何消除 对立、统一战线，成为下半年的核心看点。","第一步，7 月：人事 安排，工作组人事任命，制衡委员会；第二步，Q3：框架调整， 需求侧转向供给侧，生产率和薪资成核心；第三步，Q4：立场转 换：前两步铺垫下，联储转鸽，降息交易重启。","可以期待流动性 改善，美债、黄金、科技叙事相对有利，但短期谨防波动。","下半年，沃什核心任务，是完成对联储的统一战线，计划分三步： （一）人事安排：7 月，工作组人员任命，制衡委员会 沃什在内部面临根基不深、独立性质疑、立场分歧等挑战，因此 “重建一套班子”，成立工作组，并赋予核心政策地位。","后续工作 组将承担部分引导市场预期的任务。","（二）框架调整：Q3，需求侧转向供给侧，生产率和薪资成核心 传统的就业和通胀指标，短期波动大，形成共识难。","AI 革命给沃 什提供了引入供给侧新框架的机会，有助于其引导联储立场趋于 一致。","新框架长什么样？"]},{"title":"跟踪要点","lines":["来源文件夹：宏观-海外经济与大类资产","报告类型标签：宏观研报"]}],"title":"沃什统一战线的三步走：沃什预期差 ③"},"csc-r0720-0be1ec":{"sections":[{"title":"核心观点","lines":["短期，提示回撤风险，纳指不排除从前高下跌10%以 上。","中期，2028 年不排除是美股科技的一个“大限”。","要么在此 之前，通过内生（应用端爆发、新周期接力or 产业证伪）或外在 方式（中国AI 赶超、联储加息）解决泡沫，要么K 型分化加剧， 引发反AI 社会思潮，被两党所利用，在2028 年大选等来政策的 反噬，例如对AI 巨头加强监管、反垄断、加税。","本美股科技牛市，最终会以何种方式结束、在何时结束？"]},{"title":"跟踪要点","lines":["来源文件夹：宏观-海外经济与大类资产","报告类型标签：宏观研报"]}],"title":"美股科技：终局的猜想"},"csc-r0711-0abf7f":{"sections":[{"title":"核心观点","lines":["本周，美联储宣布了五大工作组的具体人事任命，由 外部经济学家、企业高管和前央行官员共同领导。","沃什的改革或 遵循“人事安排、框架调整、立场转换”三步走，作为第一步， 人员的安排至关重要，他们的理念、风格等将直接影响后续新框 架的阐述、以及货币政策的决策。","本文对五个工作组的官方定位、 以及负责人的背景和相关观点进行介绍。","① 政策沟通组：不确定环境下，如何对外传达政策决策过程 本组，Fisher（联储、财政部、贝莱德）、Fraga（巴西央行行长）、 King（英国央行行长），都重视央行信誉和通胀预期，不赞成央行 过度依赖单一路径和精确预测，认为央行应明确目标和决策依 据，同时保留根据经济和市场变化调整政策的空间。","② 资产负债表组：审视规模和构成，是否存在更合适的框架 本组分歧，不是扩表与否，而是在刺激经济、稳定金融、和减少 长期依赖之间如何取舍。","Dynan（联储、财政部、哈佛）对扩表中 性，经济疲弱时可以使用，但效果有限；Rajan（印度央行行长、 IMF、芝大）担心银行对准备金形成依赖，主张缩小央行长期介入； Stein（哈佛、联储）认为，准备金有助于降低短期融资风险。"]},{"title":"跟踪要点","lines":["来源文件夹：宏观-海外经济与大类资产","报告类型标签：宏观研报"]}],"title":"联储工作组：人事安排解读"},"csc-r0730-b5d123":{"sections":[{"title":"核心观点","lines":["沃什立场依然含糊，但强调美债收益率上行对加息的替代、工作组对供给和通胀等研究仍在进展 中、会和工作组进行回访沟通，仍给市场很大鸽派想象空间。","但利好持续时间较短，市场叙事再 度回归高油价和高利率。","展望后续，尽管市场加息定价高，但联储仍有较大不确定性。","只要CPI 压力不足够大，美债收 益率不足够低，沃什会尽量等待工作组研究结论出炉，再做方向性选择，宽松希望未完全熄灭。","海外市场波动还将延续，但可能接近阶段性底部。","一方面，宏观上高利率和高油价的组合没有系 统性逆转；另一方面，眼下市场核心矛盾，还是泡沫担忧和去杠杆压力，这些风险较难通过一次 议息会议的预期调整所解决。","目前纳指距前高回撤已有10%，可能正在进入调整的后期。","事件： 美东时间7 月29 日周三，美联储维持联邦基金利率的目标区间在3.50%至3.75%不变， 2026 年以来的五次货币政策会议均按兵不动，但有三位官员投反对票。"]},{"title":"跟踪要点","lines":["来源文件夹：宏观-海外经济与大类资产","报告类型标签：重大事件"]}],"title":"行动胜于雄辩：FOMC点评"},"csc-r0801-f41db2":{"sections":[{"title":"核心观点","lines":["① 由超跌向修复过渡，代表市场赚钱效应的指数筹码盈利因子已修复至-1 sigma 上方，初步走出恐 慌区间；远期估值因子自7 月23 日出现拐点后亦持续回升。","② 资金流开始回暖，但融资仍弱，目前还未出现强烈的右侧信号。","资金流因子刚刚回升至-1 sigma 附 近；融资成交占比则在周五再度回落，说明增量杠杆资金的参与意愿仍偏谨慎。","目前技术得分已 突破1 sigma，先释放右侧信号，但趋势能否真正成立仍需资金端进一步确认。","③ 市场仍在轮动期。","中期维度上，继续推荐有色与电力设备，核心逻辑仍在于公募持仓处于低位， 同时板块成交活跃度持续回升，资金流入迹象逐步增强。","短期维度上，可重点关注通信、电子超 跌反弹，操作上不宜追高，可等待波动率回落、价格企稳后分批布局。","事件： 7 月31 日上证指数反弹0.72%。"]},{"title":"跟踪要点","lines":["来源文件夹：宏观-海外经济与大类资产","报告类型标签：宏观研报"]}],"title":"量化：关注流动性改善的持续性"},"csc-r0726-f9b75d":{"sections":[{"title":"核心观点","lines":["① 流动性压力尚未完全缓解，资金流与融资成交占比仍处低位；但随着融资盘持续去杠杆，被动止 损压力已接近尾声。","② 代表市场赚钱效应的指数筹码盈利已修复至-1 sigma，远期估值也于周四出现拐点迹象，两项指标 进一步强化了市场处于左侧底部区域的判断。","右侧趋势的最终形成，需要资金流、融资成交占比 及量能进一步回暖的确认。","③ 从反弹节奏看，右侧信号将于下周测试。","我们过去提到， “从指标看，若技术得分向上突破1 sigma， 且指数随后未再回踩，则可视为右侧趋势逐步开启的重要信号。","”目前该指标即将来到1 sigma， 后续观测修复持续性。","④ 结构上，再平衡开启。","电力设备与有色环比减持幅度居前。"]},{"title":"跟踪要点","lines":["来源文件夹：宏观-海外经济与大类资产","报告类型标签：宏观研报"]}],"title":"量化：流动性拐点，下周或见分晓"},"csc-r0729-a5e7bf":{"sections":[{"title":"核心观点","lines":["历史上，韩元与韩股多数时候同向变化，但近期呈现“韩股上涨、 韩元贬值，韩股回调、韩元升值”的反常组合。","如何理解韩元走 势？","后续若韩国股市继续波动，韩元能否维持强势？","我们认为：韩元短期节奏更多由跨境资金流决定，而后者受到韩 国股市显著影响；短期仍看多韩元，但上行空间有限；中长期， 韩元则受到储蓄过剩、强美元及半导体周期压制。"]},{"title":"跟踪要点","lines":["来源文件夹：宏观-海外经济与大类资产","报告类型标签：宏观研报"]}],"title":"韩股跌，韩元为何涨？全球外汇跟踪"},"csc-r0804-76e259":{"sections":[{"title":"核心观点","lines":["今年A 股表现的典型特征是两融、私募和个人型ETF 作为增 量资金流入市场，高弹性且依赖赚钱效应，强化定价科技行情。","评估本轮A 股去杠杆，不仅观察传统显性杠杆（场内和场外 杠杆），还需要站在增量资金角度评估隐性杠杆（资金赎回和 质押风险）。","通过系统指标梳理之后，我们发现，当前并非宏观流动性收紧 引发的资产负债表全面收缩，而是低利率环境下居民资产再 配置催生的结构性行情，在内外部科技交易共振逆转后，出现 的一轮拥挤度再平衡。","目前显性杠杆去化压力最大时期已经过去，后续去杠杆风险可 控。","后续去杠杆能否确认结束，观察两点，一是境内融资卖出 和高融资行业补跌是否停止；二是海外AI 交易能否重新企稳。"]},{"title":"跟踪要点","lines":["来源文件夹：宏观研究","报告类型标签：深度报告"]}],"title":"A股去杠杆到哪一步？"},"csc-r0712-89cb6e":{"sections":[{"title":"核心观点","lines":["K 型分化不仅是资本市场的定价劈叉，而是渗透至各国方方面面。","K 型分化之下的大国选择极其决定的世界格局： ①科技依然是大国首要关注的竞合选项，因为这关乎未来一国的底 层竞争力。","②面对科技和极致K 型分化，美国的财政和货币或将比市场预期的 更为宽松，而政策外溢性通过美元潮汐转由他国承担。","体现为压不 下的通胀和更强势的美元指数。","③在这样一种少见的宏观环境中，全球将展开经济、政治和资金流 重塑，所以我们正在经历并将继续见证更高的市场波动、更反复的 地缘博弈，以及更极致的市场分化。","在此过程中，一国“硬核资产”不在内需消费，而在三个支撑力— —资源安全、科技优势和供应链能力。","这也是极致分化的世界中， 资金最终理性选择的“归宿”。","本周全球大类资产表现一览： 本周A 股高位震荡，H 股大幅反弹。"]},{"title":"跟踪要点","lines":["来源文件夹：宏观研究","报告类型标签：周报"]}],"title":"K 型分化不仅是资本市场的定价劈叉，而是渗透至各国方方面面"},"csc-r0726-77fa5e":{"sections":[{"title":"核心观点","lines":["年初美伊冲突推高油价，一改市场对美联储政策路径的预期，有色 行情戛然而止。","目前市场对于有色行情存在非常大的分歧。","我们如何理解？","我们持有两大判断: 第一，当下点位，金价跌幅有限，更多呈现震荡格局。","下一个金价上涨催化剂或在美国超预期的财政货币宽松。","逻辑是，去年底至今年美伊冲突之前，金价暴涨本质上来自于流动 性宽松预期所对应的欧美ETF 购金。","这部分需求已在油价高位波动 之后迅速洗去。","随后黄金回归基本面定价，即央行购金。"]},{"title":"跟踪要点","lines":["来源文件夹：宏观研究","报告类型标签：周报"]}],"title":"【中信建投宏观·周君芝团队】铜金有机会"},"csc-r0723-01b4d7":{"sections":[{"title":"核心观点","lines":["美伊围绕霍尔木兹摩擦升级，并非协议破裂，而是备忘录进入执 行阶段后，海峡管理权、执法权与安全保障机制等制度空白集中 暴露，通航安排争议升级为控制权之争。","霍尔木兹持续封锁难以成为稳定终局，未来通行模式可能有三 种：伊朗—阿曼双航道管理、伊朗收费开放，美国主导自由航行， 目前我们无法判断哪种可能性更高。","长期中东多国将加大管道建设绕行，降低长期对海峡的单一依赖 度过高风险。","霍尔木兹海峡控制权问题是中东安全架构重塑的关键节点，同时 也是难点之一。","地缘博弈主导供给，牵引油价在70~100 区间内 反复拉扯，短期内需求不是油价的主导因素。"]},{"title":"跟踪要点","lines":["来源文件夹：宏观研究","报告类型标签：深度报告"]}],"title":"【中信建投宏观·周君芝团队】霍尔木兹的未来可能性"},"csc-r0705-b4cd08":{"sections":[{"title":"核心观点","lines":["本周探讨一个话题，十年中债利率是否要反弹？","最长期维度，产业趋势、居民资配还是股债资产演绎都在指向， 2022 年以来中国正在经历经济转型，全球同步探索新旧秩序更迭。","在此背景下，全球利率定价框架在重塑。","海外债券利率中枢系统性 高于2022 年之前水平，中国利率中枢系统性低于此前水平，这是 一个大时代决定的方向。","相对中期维度，中国地产对债券利率的下压正逐步缓解，地产慢慢 走出最糟糕状态，内需基本面走出低谷，利率也是。","更短期视角，今年2~5 月债市利率受益于一波超级流动性宽松，背 后是高息存款到期之后的居民资配重置影响，对此我们之前也有专 题深刻探讨过。","这一点近期正迎来逆转，预估未来债市利率上行， 2~5 月的流动性债牛暂告段落。","本周全球大类资产表现一览： 本周全球权益市场周内波动加剧，市场担忧AI 算力过剩，尽管美 股三大指数上涨，但AI 硬件板块出现大幅回调，前期热门板块出 现快速去杠杆的特征。"]},{"title":"跟踪要点","lines":["来源文件夹：宏观研究","报告类型标签：周报"]}],"title":"中债是否到了反转时刻"},"csc-r0729-a4da79":{"sections":[{"title":"核心观点","lines":["资本开支增速快于经营现金流，是2026 年AI债务融资扩张 的直接原因。","无论是公司债、项目融资还是表外合作，本质都是以母公司 信用、项目资产和长期合同为支撑，将尚未兑现的AI 收入提前 资本化，并把全球长期储蓄导向GPU、数据中心和电力资产。","因此，本轮AI 投资已不只是科技巨头的内部资本开支，而 是一轮由企业信用、项目资产和长期资金共同推动的信用扩张。","其真正脆弱性不在银行或非银杠杆，而在融资条件能否持续：低 成本、高抵押率和快速审批是否还能维持。","只要AI 需求与现金流路径未被证伪，当前债务扩张更接近 超级资本开支周期，而非终极泡沫。"]},{"title":"跟踪要点","lines":["来源文件夹：宏观研究","报告类型标签：深度报告"]}],"title":"债务流动性视角：谁将为AI超级周期买单？"},"csc-r0715-5a3cf4":{"sections":[{"title":"核心观点","lines":["当下全球面临极致分化。","分化已不再局限于特定国家的收 入，就业，更广泛的国家同样经历财富、增长驱动力的内部 劈叉。","分化还渗透在资本市场以及社会情绪。","多维指标指向 一点，当前分化深度与广度，均突破过往科技周期极值。","很多人将当下分化归咎于AI 带来就业冲击，其实AI 崭露头 角之前，全球已处极致分化状态。","正如任何一轮科技革命， AI 提高全社会生产效率同时，加速分化。","我们可预期K 形分化会随着AI 演进而深化，这一趋势之下， 美国或动用政策勉力控制国内分化张力，但美国政策的外溢 性由弱国承担。","所以全球会在更强科技中迎来国与国之间大 分化，而这就是科技革命掀起国家力量重构结果。"]},{"title":"跟踪要点","lines":["来源文件夹：宏观研究","报告类型标签：宏观研报"]}],"title":"全球K型分化走到了哪一步？"},"csc-r0802-e7d2cc":{"sections":[{"title":"核心观点","lines":["上周有关科技行情持续性的分歧加深，市场关注其他板块机会。","我们认为，全球正处于一轮供给侧主导的“超级周期”。","科技之 外，我们关注资源品机会。","上半年内需数据始终偏弱，7 月制造业PMI 再度回落至荣枯线以 下，恰逢政治局会议召开，市场也有关注内需板块机会。","关于内需，我们强调两点。","第一，所谓上半年经济偏弱，主要体现在社融、社零、基建、固投 指标，背后都有财政收敛因素。","因为出口大超预期，所以财政转为 克制，说明内需政策总体思路以稳为主。","第二，政治局会议对短期需求刺激着墨并不多。"]},{"title":"跟踪要点","lines":["来源文件夹：宏观研究","报告类型标签：周报"]}],"title":"科技之外可以关注什么"},"csc-r0731-eaa136":{"sections":[{"title":"核心观点","lines":["信息技术革命演绎遵循一条核心规律：技术突破→成本下降→渗 透率提升→生态平台化。","科技浪潮微观对应关键技术突破，中观对应成本下降和渗透率提 升，宏观上国别价值链重构。","回顾上一轮信息技术革命： 产业变革的重大推进，往往发生在标准统一与生态形成之后；基 础设施投入前置，应用盈利兑现滞后；美国赚标准与生态红利， 日韩赚先进制造红利，中国赚规模与场景红利。","虽然市场近期对AI 资本开支扩张存在疑虑，但对照信息技术革 命，当前AI 尚处“基建与应用探索并行”早期阶段，应用商业 闭环仍待验证。","后续产业趋势的关键不是模型演示能力有多强，而是普及率、使 用频次、单位成本、付费意愿和传统行业改造深度可否上台阶。"]},{"title":"跟踪要点","lines":["来源文件夹：宏观研究","报告类型标签：深度报告"]}],"title":"科技产业变革如何推进？"},"csc-r0719-1e7c3a":{"sections":[{"title":"核心观点","lines":["科技行情是否结束了？","这是当下市场最关注的话题。","复盘历史经验，科技是否迎来“泡沫崩溃”，取决于三点， 第一，科技的产业趋势是否真的终结； 第二，流动性是否到了非紧不可的地步； 第三，传统增长是否迎来反转。","如果不是，我们尚不能认为科技终结。","当下对科技行情的讨论和5 月份对美伊冲突的关注一样。","我们观点没有变化，全球当下正在经历一轮供给侧，科技尚未终 结，地缘也是。","本周全球大类资产表现一览： 本周全球资产整体呈现“风险偏好降温、AI 链条去杠杆、避险与防 御占优”的特征。","美股结束反弹，芯片股跌入熊市区间，资金向价值、消费和金融轮 动；A 股、港股均明显调整，科技成长、AI 硬件外溢赛道及资源品 承压，银行、消费、煤炭等防御板块相对抗跌； 美债利率在偏软通胀推动下小幅回落；商品端原油受地缘冲突大 涨，黄金承压、铜温和修复；外汇市场美元高位回落，商品货币修 复，人民币短期仍围绕美元和风险偏好波动；中债窄幅震荡，权益 走弱支撑长端利率。"]},{"title":"跟踪要点","lines":["来源文件夹：宏观研究","报告类型标签：周报"]}],"title":"科技尚未终结，地缘也是"},"csc-r0730-180489":{"sections":[{"title":"核心观点","lines":["在AI 硬件交易极度拥挤的情景之下，债务融资担忧、中国大模型竞争力提升、国产设备突围，三个因素巧妙 叠加在一起，打碎了AI 硬件“涨价瓶颈”的叙事。","加上去杠杆，全球AI 交易迎来广泛回调。","如何理解硬件行情潮落？","科技革命规律显示，凡可被标准化的硬件环节，最终难以吃掉行业大部分利润。","掌握规模优势和用户入口的下 游应用，反而会享受行业利润大头。","如何看待科技行情走向？","大模型商业模式终局，是来自规模足够大的低利润率生意，“在万亿美元级收入上赚取适度毛利”（Altman）。","当前AI 基建层行情调整并不等于科技大行情终结。"]},{"title":"跟踪要点","lines":["来源文件夹：宏观研究","报告类型标签：宏观研报"]}],"title":"科技行情走向何方？"},"csc-r0716-9fa744":{"sections":[{"title":"核心观点","lines":["构建在科技优势之上的增长模式，我们称之为“美国模式”，美国 主导的全球秩序框架亦以此为基础： ①选择科技意味着美国面对强货币和高成本，国内制造竞争力削 弱，供应链外迁成为美国科技发展的代价。","②供应链外包驱动全球化分工，美国依靠科技攥住利润厚的强定 价权环节，他国参与价值链偏低的生产制造。","③科技赋予美国资本市场繁荣，金融账户黑字和经常账户赤字成 为美元潮汐的两端。","当通胀、分化、科技并立，美国政策选择排序或是：力保科技排 序最前，其次是勉力弥合国内分化，最后才考虑压低全球通胀。","所以短期内全球或将见证：更强科技、更大的国与国分化、压不 下的通胀；地缘缓和之后的全球大复苏或者，AI 证伪后的衰退或 滞胀，短期概率不高。"]},{"title":"跟踪要点","lines":["来源文件夹：宏观研究","报告类型标签：深度报告"]}],"title":"科技选择、美国模式和K型走向"},"csc-r0715-1eddd1":{"sections":[{"title":"核心观点","lines":["2026 年二季度，北向资金净流入约1580 亿元，创下 近两年单季度净流入规模新高，相较于2022-2025 年间明显改善。","行业配置聚焦科技和制造板块，电子成为第一大重仓行业，通信、 新能源、机械行业明显超配。","长期来看，全球G2 格局深化，中 美并驾齐驱，产业激烈角逐。","流动性环境修复叠加产业优势，北 向资金有望开启“4.0 时代”，全球资金战略性配置中国资产。","北向资金二季度净流入创近两年新高 2026 年二季度，据测算北向资金单季度净流入规模约1580 亿元， 为开通以来第三高水平，仅次于2023 年一季度与2019 年四季度， 创下近两年单季度净流入规模新高。","2026 上半年，北向资金净流入约1418 亿元，相较于2022-2025 年间出现明显改善。","行业配置聚焦科技和制造板块 一季度北向资金流入通信和电力设备行业较多，分别超过190 亿 元，从有色金属、汽车、非银金融行业流出均超过100 亿元。","二 季度继续加码对电力设备行业的配置力度，资金流入超过800 亿 元，同时电子、机械设备、汽车行业也分别获得了超过200 亿元 的资金流入，而对通信行业则进行了部分浮盈兑现操作。"]},{"title":"跟踪要点","lines":["来源文件夹：投资策略","报告类型标签：策略观点"]}],"title":"北向资金有望开启“4．0时代”"},"csc-r0803-23a6fc":{"sections":[{"title":"核心观点","lines":["7月A股整体回调，成长风格深度调整。","上证综指、创业板指分别下跌6.4%、23.0%，小盘成长承压显著；煤炭、石油石化、银行逆势上 涨。","创业板指滚动月跌幅达20%，随着中报披露及海外科技事件扰动落地，市场定价逻辑回归基本面，关注科技成长估值修复机会。","景气度方面， 科技制造与工业金属景气占优：存储涨价持续演绎，海外云厂商资本开支持续上修；工业机器人产量同比高增28%，自动化资本开支持续兑现；工 业金属库存低位叠加供给约束，价格获供需两端支撑。","配置上，建议关注7月超跌但景气度仍在上行的科技成长反弹机会，同时兼顾业绩改善确定性 较强的周期与制造方向。"," 7月市场回顾：7月宽基指数普跌，成长风格领跌，周期红利相对抗跌，两融余额回落，市场风险偏好明显收缩。","宏观层面，6月制造业PMI回升 至50.3%重返扩张区间，工业增加值同比5.3%，工业企业利润同比12.3%；出口保持韧性，6月出口同比升至27.0%，流动性整体平稳，经济延 续修复态势。"]},{"title":"跟踪要点","lines":["来源文件夹：投资策略","报告类型标签：策略观点"]}],"title":"定价回归基本面，把握成长修复窗口"},"csc-r0801-3627eb":{"sections":[{"title":"核心观点","lines":["7 月初，受TMT 板块交易拥挤影响，市场结构脆弱加剧，情绪指 数反弹未能回到高涨区，随后掉头向下。","7 月中旬开始，韩股去 杠杆引发科技和小微盘加速下跌，市场情绪大幅下滑至50 以下， 一度接近低迷区。","期间仅在关键均线附近出现短暂的技术性反弹 行情。","不过，随着大型IPO 落地、科技巨头财报、美联储议息会 议和政治局会议等重大事件扰动落地，情绪指数在7 月下旬基本 稳定在30 附近窄幅波动，实现企稳。","我们预计8 月情绪指数将 有所回升，市场整体有望迎来修复行情。","情绪企稳，8 月市场有望修复 换手率： 5-6 月换手率多次超过2%警戒线，7 月市场换手率则大 幅下滑，一度降至1.55%，市场整体明显缩量。","偏股型基金新发量：受科技股大跌影响，7 月偏股型基金新发量 继续下滑，总体处于中位偏低水平。","融资买入占比：融资买入占比指标7 月出现了明显的下滑，从月 初10.2%以上降至30 日最低8.4%，这反映出杠杆资金情绪已明 显恶化，未来需警惕该指标创下本轮牛市以来新低。"]},{"title":"跟踪要点","lines":["来源文件夹：投资策略","报告类型标签：行业跟踪"]}],"title":"情绪企稳，8月市场有望修复"},"csc-r0701-f7a361":{"sections":[{"title":"核心观点","lines":["6 月初，受美联储鹰派信号及科技板块获利回吐影响，情绪指数 延续上月下滑趋势。","6 月8 日情绪指数降至55 附近后市场开启低 位反弹，这也符合牛市中情绪指数降至50-55 附近时，市场往往 展开反弹行情的经验规律。","随后市场情绪大幅震荡，6 月11 日情 绪指数最低降至44 以下，之后大幅回升，在6 月23 日升至73 以 上。","此后，随着市场结构分化加剧，情绪指数再度回落，6 月26 日又一次接近55 并触发反弹行情。","总的来看，当前市场情绪处 于牛市中偏低水平，反映市场强弱势水平的分项指标同样处于低 位，意味着市场短期反弹动能较强，特别是前期超跌板块有望轮 动反弹，这将有助于市场情绪修复。","情绪大幅震荡，结构分化加剧 换手率：月初月末两次超过2%预警线，市场交易热度持续偏高。","6 月初换手率超过2%警戒线，市场交易过热后引发市场回调，月 中一度降至2%下方，但月末又再次超过预警线。","偏股型基金新发量：6 月维持中位水平，略有回落。"]},{"title":"跟踪要点","lines":["来源文件夹：投资策略","报告类型标签：行业跟踪"]}],"title":"情绪大幅震荡，结构分化加剧"},"csc-r0722-32c1f3":{"sections":[{"title":"核心观点","lines":["二季度美伊地缘冲突阶段性缓和，市场风险偏好修复， 重新聚焦科技主线，AI 算力和半导体板块强劲领涨，上证指数 也在5 月中旬创下近十年来新高。","配置层面，双创板块配置比例 首次超过主板，成长风格配置比例达到78%，主动超配力度显著。","电子行业配置和超配比例翻倍，有色、化工、电力设备、汽车、 食品饮料、医药等行业则有明显减配和资金流出。","极致的抱团现 象在二季度加速演绎，目前产业趋势逻辑尚无强有力证据证伪， 后续接力资金的需求日益迫切。","股票仓位：提升0.2pct 至83.2%，历史分位80% 整体来看，主动权益基金股票仓位达到83.2%，环比提升0.2pct， 处于2010 年以来80%的历史分位水平。","其中港股仓位降至6.8%，环比下降3.4pct，处于2015 年以来67% 的历史分位水平。","板块配置：双创板块成长风格主动超配 分板块来看，主板配置比例降至43.6%，科创板和创业板的配置 比例合计提升14.4pct，超配比例提升7.7pct，其中科创板的配置 比例和超配比例提升幅度均更大。"]},{"title":"跟踪要点","lines":["来源文件夹：投资策略","报告类型标签：深度报告"]}],"title":"抱团虹吸之后，关注有效资金接力"},"csc-r0711-ab01f0":{"sections":[{"title":"核心观点","lines":["2026 年二季度，市场盘面极致分化、结构性行情明显、核心矛 盾在于行业基本面具备绝对优势与交易结构绝对拥挤。","4 月上旬 美伊冲突持续，海峡封锁高通胀与流动性紧缺。","4 月8 日停战后 风险偏好快速修复，一季报密集披露算力产业链业绩普遍超预 期，资金迅速向海外算力链条集中。","4 月底至5 月上旬，海外科 技巨头资本开支指引上修，市场切换为业绩驱动，全球科技股 共振大涨。","5 月下旬至6 月中旬，算力赛道对全市场产生显著虹 吸，算力内部呈现梯队式轮动。","期间地缘事件反复、高利率高 油价加剧宏观扰动，全球波动加大亚太市场经历多轮共振大 跌。","6 月下旬市场企稳修复，美伊达成协议创造宏观利多，极致 交易拥挤边际缓解，金融、周期、消费、医药等低位板块陆续 轮涨，资金尝试向均衡配置扩散。","2026 年Q2 复盘 Q2 市场行情大致可以分为以下5 个阶段： 1）阶段一（4.1-4.8）： 4 月上旬美伊冲突及流动性紧张，市场 继续回调，海峡封锁原油价格巨震。"]},{"title":"跟踪要点","lines":["来源文件夹：投资策略","报告类型标签：深度报告"]}],"title":"深度复盘2026Q2"},"csc-r0731-e0d400":{"sections":[{"title":"核心观点","lines":["2026 年上半年，海外云厂商资本开支持续高增长并多次上修， AI 服务器出货增速显著领先整体服务器市场，全球算力基础设 施仍处于集中建设期。","与此同时，HBM 对先进DRAM 晶圆及封 装产能的挤占推动存储供需收紧，涨价进一步向覆铜板、电子 布、被动元器件及其他高端零部件扩散，价格上涨和产品结构 升级共同改善产业链盈利。","但随着存储等涨价敏感资产经历去 杠杆和风险重定价，市场开始重新评估价格上涨斜率和高利润 率的持续性。","我们认为，2026 年下半年并非由涨价向放量的彻 底切换，而是涨价仍在、斜率可能边际放缓，市场定价逐步提 高对订单、产能和交付兑现的关注。","当前算力产业链的驱动因素正在重新排序。","一是云厂商资本开 支仍处于扩张阶段，若存储等关键零部件涨价斜率放缓，采购 压力有望缓解，资本开支向AI 芯片、服务器、网络设备及配套 基础设施转化的效率可能改善。","二是晶圆代工、存储及先进封 装厂商扩大资本开支，将进一步拉动半导体设备、零部件和材 料需求。"]},{"title":"跟踪要点","lines":["来源文件夹：投资策略","报告类型标签：策略观点"]}],"title":"算力核心逻辑变了吗？"},"csc-r0525-e4f285":{"sections":[{"title":"核心观点","lines":["1. 近年来，尽管关税和贸易政策波动剧烈，但全球贸易总量并 未收缩。","与此同时，贸易流向呈现明显的近岸、友岸化特征。","2. 与2018 年第一轮关税相比，特朗普第二轮关税的影响对象更 接近中国当前出口结构中的核心制造品类，也更靠近全球电 子、通信与电池产业链的主干部分。","3. 中国贸易形势出现三重变化：产品结构上，向价值链上游跃 迁；地理分布上，拓展全球南方新空间；贸易形态上，服务 贸易、数字贸易和绿色贸易实现跨越式发展。"]},{"title":"跟踪要点","lines":["来源文件夹：首席经济学家","报告类型标签：深度报告"]}],"title":"“东升西降”中的国际贸易重构"},"csc-r0623-420f72":{"sections":[{"title":"核心观点","lines":["1. “十五五”期间，科技政策的重心将围绕国家能力建设展开， 优先补足算力、数据、基础软件、关键材料、工业母机、高 端仪器等薄弱环节。","2. 指标层面，重点关注研发投入强度、基础研究权重、创新质 量、成果转化效率和关键核心技术自主可控程度五个维度。","3. 政策工具层面，供给端注重能力建设，需求端强调场景创造， 制度环境形成正向激励，并通过新型举国体制形成合力。"]},{"title":"跟踪要点","lines":["来源文件夹：首席经济学家","报告类型标签：深度报告"]}],"title":"中国科技政策：从重点攻关到产业闭环建设"},"csc-r0518-7c887d":{"sections":[{"title":"核心观点","lines":["1. 需求侧复苏偏弱，实体动能仍待修复。","地产下滑背景下，居民部门谨慎储蓄倾向仍在。","当前促消费的政策 重点应注重居民收入和预期的实质性修复。","2. 供给侧结构性分化，新质生产力起到支撑作用。","新质生产力从产量到利润已有清晰数据验证。","3. 价格显现修复迹象，但基础仍待稳固。","4 月 CPI 的回升，很大一部分来自能源和出行服务。","PPI 出现大幅 转正，有望对下半年经济形成正向反馈。"]},{"title":"跟踪要点","lines":["来源文件夹：首席经济学家","报告类型标签：重大事件"]}],"title":"产业结构升级与非均衡复苏：4月经济数据解读"},"csc-r0527-8131f8":{"sections":[{"title":"核心观点","lines":["1. 随着财政成为债券定价的核心变量，发达国家国债作为绝对 无风险资产的底层逻辑开始松动，主权风险面临重估。","2. 受制于通胀预期和财政扩张，美债利率短期或维持高位震荡， 中期关注通胀冲击与增长放缓的交替。","3. 英债收益率短期预计继续偏高波动，长债对政治不确定性、 能源价格和财政纪律信号更敏感。","中期来看，整体市场情绪 仍较为脆弱。","4. 由于通胀粘性、央行正常化预期和财政压力持续存在，日本 将持续处于真实中性利率重估的过程中。"]},{"title":"跟踪要点","lines":["来源文件夹：首席经济学家","报告类型标签：宏观研报"]}],"title":"供给冲击与主权风险重估：近期发达国家国债市场分析与展望"},"csc-r0623-eac39e":{"sections":[{"title":"核心观点","lines":["1. 本报告基于统一的生产函数框架，对中国与美国的趋势TFP 进行估计，并通过指数形式比较两国技术进 步路径的差异，以揭示不同发展阶段下技术进步在经济增长中的角色。","2. 近年趋势中国TFP 保持温和上行，表明中国技术进步正从追赶型特征向以内生创新和效率优化为主的阶 段过渡。","相比之下，美国作为长期处于技术前沿的经济体，其趋势TFP 呈现相对稳定的上升轨迹。","3. 在此基础上，我们测算并拆解中国的产出缺口比例。","从历史趋势来看，中国的产出缺口呈现周期性变化， 其中全要素生产率缺口是重要的影响因素，且呈现出强周期性特征。","与中国相比，美国TFP 缺口在危机 期显著放大，但恢复速度较快，显示出较强的资源再配置与技术扩散能力。","信息： 《“十五五”规划纲要》将全要素生产率（TFP）提升为衡量高质量发展的核心目标之 一。","纲要在主要目标中明确提出，高质量发展取得显著成效，不仅要“GDP 增长保持在合 理区间”，更要求“全要素生产率稳步提升，科技进步和制度创新对经济增长的贡献持续加 大。"]},{"title":"跟踪要点","lines":["来源文件夹：首席经济学家","报告类型标签：深度报告"]}],"title":"全要素生产率视角下的中美增长分析"},"csc-r0611-031982":{"sections":[{"title":"核心观点","lines":["1. 中间品、资本品出口扩容是“十五五”货物贸易升级的主轴， 出口链投资重心有望向产业链中上游转移，更加利好具备技 术壁垒、客户绑定能力的企业。","2. 高科技产品出口正转向新能源、装备制造和新型工业品，集 成电路、半导体设备、生物医药等低占比、高空间赛道更值 得关注。","3. 跨境服务贸易、数字贸易和文化出海将成为主要增量，服务 出海与制造出海联动利好跨境电商、国际物流、软件服务、 工程设计、工业服务和互联网平台等方向。"]},{"title":"跟踪要点","lines":["来源文件夹：首席经济学家","报告类型标签：深度报告"]}],"title":"制度型开放打造贸易新高地"},"csc-r0715-77f8df":{"sections":[{"title":"核心观点","lines":["1. 6 月数据表明，增长斜率有所改善，结构分化尚未扭转。","2. K 型分化加深体现为四个层面：生产强于需求，外需强于内需，高技术强于传统部门，短期融资强于长期 融资。","3. 近期政策思路与当前矛盾的匹配度提高。","政策主线聚焦于提升消费能力，盘活城市存量，建设现代基础设 施。","城市更新和“六张网”有望托底投资，消费与就业政策则决定内需修复的持续性。","信息： 上半年GDP 同比增长4.7%，其中一季度增长5.0%，二季度回落至4.3%。","6 月规模以上 工业增加值、服务业生产指数、社会消费品零售总额和出口同比分别增长5.3%、4.7%、1.0% 和20.8%，较5 月均有不同程度改善；但固定资产投资累计下降5.7%，房地产开发投资下降 18.0%，民间投资下降8.5%。","简评： 6 月工业、服务业、消费和出口均较5 月改善，经济仍有韧性。"]},{"title":"跟踪要点","lines":["来源文件夹：首席经济学家","报告类型标签：重大事件"]}],"title":"硅基延续高景气，内需待政策接力"},"csc-r0616-bc00e1":{"sections":[{"title":"核心观点","lines":["1. 5 月经济数据表明，经济正在出现“硅基”部门与“碳基” 部门的二元分化。","2. 价格方面，硅基产业链的爆发是推升PPI 的重要原因。","碳基 产品价格偏弱，主要原因在于居民部门生活资料的名义需求 收缩。","3. 生产端，高技术产业亮眼，但硅基内部也有所分化。","强行业 内部也存在头部盈利、长尾亏损的K 型结构。","4. 需求侧，内需承压，外需托底，K 型分化加深。"]},{"title":"跟踪要点","lines":["来源文件夹：首席经济学家","报告类型标签：重大事件"]}],"title":"硅基高景气，碳基慢修复，K型分化再确认"},"csc-r0415-e3928c":{"sections":[{"title":"核心观点","lines":[" 展望二季度，全球宏观叙事主线正在快速变化，市场对美 国经济增长、资产价格和美元的信心在衰退，对我国和欧洲的 经济增长、资产价格和货币的信心在走强。"," 当美国例外论破产与全球资金再平衡，未来可能出现的 传导是，美元相对欧元走弱，进而美元指数走弱，非美货币走 强，人民币币值坚挺，欧洲和中国政策空间较大，资金从美国 向欧洲和中国流动。"," 我国的科技创新和产业升级，正在改变国内外对中国科 技创新、核心竞争力、经济前景和资产定价的认知，后续关注 财政、企业和居民部门支出节奏。","美国的财政紧缩和滥用关 税，正带来经济衰退和资产价格泡沫破裂风险。","德国财政的大 规模刺激计划，将引领欧元区和欧盟国家启动财政转向。","内容要点 第一章 美国例外论：历史演变及经济内涵。","伴随着国际经济局势的不断演进，海外鼓吹“美国例外论”的 重点在不断调整，同时也不断面临新的挑战。","第二章 美国例外论的破产：对MAGA 经济叙事的分析。"]},{"title":"跟踪要点","lines":["来源文件夹：首席经济学家","报告类型标签：深度报告"]}],"title":"美国例外论的破产与全球资金再平衡"},"csc-r0727-26c7f8":{"sections":[{"title":"核心观点","lines":[" A 股市场将长期致胜。","当前我国A股的长期趋势是向上的， 整体市值是扎实的，投资机遇是广阔的，虽有少数个股泡沫现 象，但整体市场没有系统性风险，产业进步和业绩成长显著。","而美股全市场系统性泡沫因素极高，虽其仍有科技、货币优势， 但全市场产业空心化、价格泡沫化系统性风险不容忽视。"," 相较美股，A 股有八个不同与优势。","其一，总市值水平不 同，为安全边际优势；其二，杠杆规模不同，为流动性条件优 势；其三，货币信用不同，为主权信用优势；其四，AI 发展模 式不同，为AI 前景优势；其五，产业更新节奏不同，为向新 速度优势；其六，产业链质量不同，为产业链优势；其七，产 业实绩不同，为成长业绩优势；其八，未来潜力不同，为重估 潜力优势。","内容要点 6 月以来，本轮美股科技板块下跌，主要是由其在商业化前景、 流动性预期、监管干预、市值集中、散户杠杆、地缘冲突等六 个方面的风险上行所引致。"]},{"title":"跟踪要点","lines":["来源文件夹：首席经济学家","报告类型标签：深度报告"]}],"title":"A股长期致胜的八个宏观视角"},"csc-r0929-d3acc3":{"sections":[{"title":"核心观点","lines":[" 本文是“东升西降”系列的第四篇，分析国际货币变革， 人民币的崛起，及其历史性投资机遇。","今年9 月1 日，习近平 总书记首次提出“全球治理倡议”，央行表示金融要做倡议的坚 定践行者。"," 建设强大的货币，加快发挥人民币的国际货币功能，优化 国际货币体系的资源错配，必将带来全球资产价格体系的重塑， 其中，以人民币资产为代表的我国核心资产，也将持续的受益 于本轮国际货币的革故鼎新。"," 面向未来，我们有八大趋势展望。","一）黄金归来，白银相 随；二）美元转弱，人民币稳；三）联储降息，流动性宽；四） 中债宜稳，货币宜宽；五）A 股港股，有“新四牛”；六）美股 何去，观察债务；七）美债何从，财政美元；八）国际货币， 中国智慧。","内容要点 第一章 全球治理改革，国际货币为公 1）国际货币原理，讲信修睦，天下为公；2）国际货币兴替， 科技革命，五浪康波；3）国际货币发展，全球倡议，大道之行； 4）人民币国际化，货币崛起，强大金融。"]},{"title":"跟踪要点","lines":["来源文件夹：首席经济学家","报告类型标签：深度报告"]}],"title":"人民币国际化的历史机遇：资产的视角"},"csc-r0526-699674":{"sections":[{"title":"核心观点","lines":[" 本文是“东升西降”系列的第三篇，研究美国贸易战与资产 价格。","美国在近一百年历史上，主要发动主导了五次贸易战，本 文分析比较其贸易战前后的主要资产价格、关键经济指标走势， 包括股市、债市、美元、黄金、白银、原油、房地产价格，及出 口、生产、消费、经济的关键指标。"," 五次贸易战对资产价格的影响，有“向好、震荡与恐慌”三 种模式。","其中，既有共性经验、也有特性差异，对这些模式的分 析，有助于我们在经济层面更好地应对和发展，有助于我们在市 场层面更好地投资和配置。"," 未来1-6 个月将是关键窗口期。","届时无论特朗普政策如何继 续摇摆，市场可能都将对本轮贸易战的经济及资产价格影响，做 出更明确的模式选择和“用配置交易投票”。","内容要点 第一章 前言：美国五次贸易战与资产价格。","“经济规律不是原本 存在的，而是人类造就出来的”——罗斯福评贸易战，1932 第二章 贸易战四大目标：贸易、财政、产业与经济地位 第三章 贸易战三大抓手：关税、汇率与其他限制性措施 第四章 贸易战三层冲击：反制、宏观结构和最终贷款人 第五章 美联储框架改革：防范恐慌失控和稳定资产价格 第六章 贸易战与资产价格：向好、震荡与恐慌三条路径。"]},{"title":"跟踪要点","lines":["来源文件夹：首席经济学家","报告类型标签：深度报告"]}],"title":"美国五次贸易战与资产价格：向好、震荡与恐慌"},"csc-r0615-6fbe3b":{"sections":[{"title":"核心观点","lines":[" 本文分析美国经济崛起的底层架构、三次超越，及当前面 临的产业空心化问题。","美国在学习英国体系的基础上，通过三 次系统性创新超越，构建了支撑其崛起的美式经济架构体系。"," 第一次超越，是GDP 体系与宏观经济货币化，美国建立 起了货币化、总量化、结构化的宏观治理架构；第二次超越， 是科技金融体系与多层次资本市场，打通了“科技+金融+产业” 的循环；第三次超越，是双轮驱动与科技耐用品消费，打通了 “科技+产品+消费”的循环。"," 但从次贷危机以来，美国经济持续存在“脱实向虚”问题， 面临“实体产业空心化+资产价格泡沫化”双重压力，长期可持 续发展的稳定性减弱，这与美国坚持推行美元单极国际货币体 系有紧密关系。","内容要点 第一章 美国经济的崛起：底层架构、原始积累与美式创新 1）底层架构，对英式体系的学习；2）原始积累，殖民与边疆 的扩张；3）一超崛起，宏观经济架构的三次创新超越。","第二章 第一次创新超越：“GDP 体系”与宏观经济货币化 1）直接成因，大萧条催生一种货币化逆周期工具；2）深层创 新，英式治理缺乏一套总量结构架构；3）核心特征，货币化、 总量化、结构化，强调生产。"]},{"title":"跟踪要点","lines":["来源文件夹：首席经济学家","报告类型标签：深度报告"]}],"title":"美国崛起史（上）：美国经济架构的兴替"},"csc-r0615-31fdc1":{"sections":[{"title":"核心观点","lines":[" 本文分析美元国际货币体系。","美元是继英镑之后的第二代 单极国际货币体系，其在中前期有力支撑了美国的经济崛起， 但也蕴含了实体产业空心化、资产价格泡沫化、国际铸币与国 内货币功能矛盾等内生性不可持续因素。"," 美元国际体系的发展与架构，有三个阶段。","第一阶段，国 际信用建设，其是金汇兑本位的黄金锚定货币；第二阶段，国 际信用扩张，其是原油贸易需求支撑的商品锚定货币；第三阶 段，信用螺旋扩张，其是“美元+美债+美股”的美元资产扩张螺 旋支撑的“信用螺旋货币”。"," 当前单极货币体系被武器化，其构建的扩张螺旋不可持续， 国际货币体系正在迈向多极化。","从国际货币体系演进的客观规 律看，人民币与人民币资产崛起有坚实的综合国力基础。","内容要点 序言 美元与美元国际货币体系的过去、现代和未来 美元以其单极国际货币发行地位，在经济发展的关键时期，大 规模的以账面货币换取全球关键生产要素和优质资源，进而支 撑起科技研发、安全军事、消费水平等核心利益。"]},{"title":"跟踪要点","lines":["来源文件夹：首席经济学家","报告类型标签：深度报告"]}],"title":"美国崛起史（下）：美元货币体系的兴替"},"csc-r0609-d360e7":{"sections":[{"title":"核心观点","lines":[" 本文是“东升西降”系列第五篇，分析大国崛起的经济战 略。","英国是唯一完整经历工业崛起、全球霸权、相对衰落、回 归繁荣的发达经济体，其兴衰对理解大国经济战略与全球体系 重构有深刻镜鉴意义。"," 英国崛起并非仅仅是由于工业革命的技术偶然，而是坚持 长达两个多世纪的“向海图强”与“产业现代化”国家战略的 全方位结合，以及持续适应性进化、支持这一战略的金融革命 所共同驱动的系统性综合国力崛起。"," 英国衰退的重要因素在于产业空心化、工业精神丧失、创 新教育滞后及选民利益分化等。","大国崛起需战略定力与长期主 义，产业立国是根基，而与之配套的货币金融革命是支撑产业 革命的另一关键支柱。"]},{"title":"跟踪要点","lines":["来源文件夹：首席经济学家","报告类型标签：深度报告"]}],"title":"英国崛起（上）：英国工业革命的兴替"},"csc-r0609-68f842":{"sections":[{"title":"核心观点","lines":[" 本文是“东升西降”系列第六篇，分析英国崛起进程中的 “英镑货币革命”。","英镑货币体系是唯一完整经历了工业崛起、 全球霸权、相对衰落、回归繁荣的货币体系，其兴衰对理解大 国货币战略与全球货币体系重构有深刻镜鉴意义。"," 英镑货币体系改革，通过建立英格兰银行、伦敦证券交易 所、伦敦商品期货市场等机构，大规模改革货币发行、活跃流 动性、引导社会资金投向、强化产业金融融合，有力的支持了 英国的工业革命胜利。"," 英镑国际货币体系的后期，随着英国产业的空心化，英国 陷入“强英镑”保国际铸币与“弱英镑”保实体产业的两难，丘吉 尔的强英镑保铸币，加速了制造业衰退和英镑体系解体。","这也 再次证明，金融是国之重器，必须坚持服务实体产业。"]},{"title":"跟踪要点","lines":["来源文件夹：首席经济学家","报告类型标签：深度报告"]}],"title":"英国崛起（下）：英镑货币体系的兴替"},"csc-r0427-c638fe":{"sections":[{"title":"核心观点","lines":[" 本文是“东升西降”系列的第二篇，研究美国关税战贸 易战的软肋及前景。","如美国继续沿贸易保护主义路线一意孤 行，美国经济在贸易战状态下的九大软肋，将会削弱其竞争 力，引起经济和市场更大的动荡。","这九大软肋分别是：国债 其一，股市其二，美元其三，通胀其四，产业链其五，居民 企业其六，房地产其七，经济结构其八，软实力其九。"," 美国的软肋决定了关税战贸易战不可持续。","投资者要抓 住“东升西降”的历史机遇。","在关税战边际缓和的过程中， 应逐步提升风险偏好。","内容要点 第一章 行有不得，反求诸己，贸易战没有赢家。","贸易赤字只是表象，互利共赢才有出路。"]},{"title":"跟踪要点","lines":["来源文件夹：首席经济学家","报告类型标签：深度报告"]}],"title":"贸易战难以持续：美国的软肋"},"csc-r0723-01-f178":{"title":"中国船舶（600150）：高价订单集中交付推动盈利提升，订单充足支撑业绩持续增长","sections":[{"title":"核心观点","lines":["公司预计2026 年上半年实现归母净利润92—110 亿元，按吸收 合并后的重述口径同比增长143.56%—191.21%；扣非归母净利润 90—108 亿元，同比增长211.34%—273.61%，主营业务盈利改善 更为明显。","按一季度业绩倒算，2026Q2 预计实现归母净利润 43.68—61.68 亿元，同比增长81.75%—156.66%，中值约52.68 亿 元，环比增长约9.0%。"]},{"title":"其他要点","lines":["来源文件夹：军工及新材料","报告类型标签：公司点评"]}]},"csc-r0722-02-5dae":{"title":"北化股份（002246）：硝化棉价格增长，推动上半年业绩高增","sections":[{"title":"核心观点","lines":["公司预计2026H1 实现归母净利润2.00-2.50 亿元，同比增长 87.39%—134.24%；扣非归母净利润1.80-2.25 亿元，同比增长 118.70%—173.37%。","2026Q2 预计实现归母净利润1.28-1.78 亿元， 中值约1.53 亿元，环比增长约111%，二季度盈利进一步提速。"]},{"title":"其他要点","lines":["来源文件夹：军工及新材料","报告类型标签：公司点评"]}]},"csc-r0726-03-714e":{"title":"引力一号“一箭九星”发射成功，星座组网运力保障持续增强","sections":[{"title":"核心观点","lines":["7 月22 日，引力一号遥四运载火箭在上海东部海域成功完成 “一箭九星”发射任务，此次任务开创了我国民营商业火箭在长三 角东海海域实施海上发射的先河，标志着引力一号迈入可稳定履约 的商业化、规模化运营阶段。","远海发射有望为中国星网、千帆星座 等低轨星座密集组网提供更加灵活的运力保障。"]},{"title":"其他要点","lines":["来源文件夹：军工及新材料","报告类型标签：行业跟踪"]}]},"csc-r0714-04-a7a9":{"title":"未来产业投资地图系列之“可控核聚变”","sections":[{"title":"核心观点","lines":["可控核聚变因其能量密度极高、原料近乎无限、安全清洁等特性，被视为人类理想的终极能源。","全球主要国家已突破科学可行性验证，正 加速向工程可行性及商业化迈进，标志性装置不断刷新参数，氘氚、氘氘、氘氦3、氢硼燃料各具优势，托卡马克、仿星器、FRC等技术路径齐头并进。","中国已将可控核聚变纳入“未来能源”体系，2025年首次入法、2026年首次单独写入五年规划，政策支持力度显著增强。"]},{"title":"其他要点","lines":["来源文件夹：军工及新材料","报告类型标签：行业跟踪"]}]},"csc-r0710-05-9323":{"title":"西测测试（301306）：商业航天载荷超级工厂，从“检测切入”走向“一站式服务”","sections":[{"title":"核心观点","lines":["西测测试战略定位正从传统检测向商业航天“一站式制造+检测”超级工厂升级，直击行业“研发强、制造 弱”痛点，提供从设计验证到整星交付的全链条服务。","公司卡位商业航天规模化爆发期，深度绑定头部客户，静候订单放 量拐点。","同时，公司作为第二大股东参与设立“西部航天科技”，布局卫星在轨交付全链条，并获三角防务董事长双重战 略投资，产业协同持续深化。","财务层面，战略性亏损正边际收窄，拐点信号已现。"]},{"title":"其他要点","lines":["来源文件夹：军工及新材料","报告类型标签：公司点评"]}]},"csc-r0711-06-cd29":{"title":"长征十号乙运载火箭首飞成功，复用技术实现历史性突破","sections":[{"title":"核心观点","lines":["7 月10 日，长征十号乙运载火箭首飞成功，全球首创海上网系 回收一子级，复用状态下近地运力16 吨，标志着我国可复用火箭技 术历史性突破。","从产业进展看，我国可重复使用火箭完成从方案到 工程的关键跨越，将为低轨卫星互联网等产业带来供给侧深层变革。","未来常态化火箭回收，中国星网GW、垣信千帆星座等大型星座的部 署节奏有望飞速提升、建设成本压力有望大幅降低。"]},{"title":"其他要点","lines":["来源文件夹：军工及新材料","报告类型标签：行业跟踪"]}]},"csc-r0731-07-43b1":{"title":"中国铀业（001280）：国家核燃料安全压舱石，有望实现“核动力”成长","sections":[{"title":"核心观点","lines":["双碳目标、能源安全、AI 热潮之下，全球核能复苏带动铀需求稳 中有增，叠加供给刚性、库存持续去化，天然铀价格有望长牛。","公司作为天然铀保障供应的国家队、主力军，境内外资源控制量 丰富，同时掌握以CO₂+O₂地浸采铀技术为代表的复杂砂岩型铀矿 地浸采铀技术体系，伴随4 个天然铀募投项目的建成投产，以及 海外罗辛铀矿、亚兰格海因里希铀矿、埃坦戈铀矿产能释放，公 司有望开启高成长新周期。"]},{"title":"其他要点","lines":["来源文件夹：军工及新材料","报告类型标签：公司点评"]}]},"csc-r0719-08-02c7":{"title":"军工板块进入半年报预告期，关注船舶等业绩稳健领域","sections":[{"title":"核心观点","lines":["近日，多家国防军工板块公司发布了半年报业绩预告，主机厂方面， 中国船舶、航发动力等公司业绩实现较大幅度上涨。","航天彩虹、纵横股 份等无人机公司业绩持续回升。","航空产业链业绩下滑，如中航沈飞半年 报业绩同比减少58.23%，中简科技转亏。","受传统军工板块新签订单下降 影响，军工信息化公司普遍出现不同程度的业绩下滑，如四创电子、七 一二、海格通信、烽火电子等。"]},{"title":"其他要点","lines":["来源文件夹：军工及新材料","报告类型标签：行业跟踪"]}]},"csc-r0706-09-34ee":{"title":"超级卫星工厂通过贯通评审，继续看好商业航天投资机会","sections":[{"title":"核心观点","lines":["6 月17 日10 时44 分，长征十二号运载火箭在海南商业航天发射场 点火起飞，随后成功将卫星互联网低轨22 组卫星送入预定轨道，发射任 务取得圆满成功。","卫星互联网低轨22 组卫星由中国航天科技集团有限公 司五院抓总研制。","近期商业航天板块受到部分火箭发射失利/推迟以及市 场风偏变化等影响，出现较大幅度回调，后续催化密集，随着市场风偏 的修复，看好商业航天板块后续表现。"]},{"title":"其他要点","lines":["来源文件夹：军工及新材料","报告类型标签：行业跟踪"]}]},"csc-r0721-10-1793":{"title":"屹唐股份（688729）：面向全球的半导体设备龙头，受益国内、海外共振向上——半导体设备系列报告（深度）","sections":[{"title":"核心观点","lines":["与摘要  核心观点：公司是财政国资局控制的全球化半导体设备企业，核心子公司MTI长期深耕集成电路设备领域，客户覆盖全球头部fab厂，公司产 品覆盖干法去胶、快速热处理、干法刻蚀及等离子体表面处理等关键前道工艺环节，其中干法去胶和快速热处理设备已形成较强的全球竞争 力，2025年份额位于全球第二，公司发力刻蚀设备，面向先进制程的等离子体表面处理和材料改性设备具有稀缺性。"]},{"title":"其他要点","lines":["来源文件夹：机械","报告类型标签：深度报告"]}]},"csc-r0728-11-e362":{"title":"杰瑞股份（002353）：斩获14.65亿美元AIDC燃机订单，头部客户合作持续深化","sections":[{"title":"核心观点","lines":["杰瑞股份与全球知名云服务提供商签署14.65 亿美元燃气轮机发电机 组供应合同，计划于2027 年分批交付。","此次订单既是同一客户的再 次采购，也意味着公司燃机业务开始由单个项目突破转向大规模、持 续性供货。"]},{"title":"其他要点","lines":["来源文件夹：机械","报告类型标签：公司点评"]}]},"csc-r0707-12-f4fa":{"title":"AI PCB需求放量、高阶升级趋势明确，打开设备耗材新空间","sections":[{"title":"核心观点","lines":["及摘要 2 核心观点：算力需求正成为PCB行业最重要的结构性增量，推动AI场景PCB升级为高多层、高密度、高速、低损耗和高可靠的平台型产品。"]},{"title":"其他要点","lines":["来源文件夹：机械","报告类型标签：行业跟踪"]}]},"csc-r0804-13-e1d1":{"title":"专用设备：全球半导体设备进入“量价齐升”通道，国产设备出海进程加速——半导体设备系列报告","sections":[{"title":"核心观点","lines":["全球半导体设备景气度持续上修，海外设备、零部件已出现 “量价齐升”情况，海外交期大幅延长，国产设备、零部件经 历“十四五”期间的修炼，能力大幅提升，具备充足的出海潜 力。","另外一方面，除了外部制裁因素以外，全球缺货使得国内 下游客户获取海外设备、零部件的难度进一步提升，我们看好 国内市场的国产替代速度大幅加速。"]},{"title":"其他要点","lines":["来源文件夹：机械","报告类型标签：深度报告"]}]},"csc-r0803-14-34cb":{"title":"周观点：宇树IPO顺利推进看好机器人板块后续进展，半导体设备关注涨价及出海","sections":[{"title":"核心观点","lines":["（1）人形机器人：谷歌DeepMind 发布全新机器人模型，宇树 IPO 渐行渐近，特斯拉人形机器人迈向量产，板块催化不断。","（2）AIDC 发电设备：需求高景气与产能扩张共振，供需缺口 延续，坚定看好国产燃机出海。","（3）工程机械：6 月挖机内外 销继续超预期，低位坚定布局。","（4）半导体设备：全球半导体 设备进入大周期，关注去日化+出海。"]},{"title":"其他要点","lines":["来源文件夹：机械","报告类型标签：周报"]}]},"csc-r0714-15-0467":{"title":"周观点：工程机械6月挖机内外销继续超预期，半导体设备全球景气周期持续确认","sections":[{"title":"核心观点","lines":["（1）人形机器人：板块多重催化共振，特斯拉人形机器人迈向 量产，看好板块持续性。","（2）AIDC 发电设备：行业仍然保持 高景气，坚定看好国产燃机出海。","（3）工程机械：6 月挖机内 外销继续超预期，低位坚定布局。","（4）半导体设备：全球半导 体设备进入大周期，关注涨价+出海。","（5）锂电设备：储能接 力+固态破局，设备端高景气与产业化提速共振。"]},{"title":"其他要点","lines":["来源文件夹：机械","报告类型标签：周报"]}]},"csc-r0719-16-2315":{"title":"周观点：工程机械销量高增持续，燃机海外财报季有望强化全球景气度","sections":[{"title":"核心观点","lines":["（1）人形机器人：板块多重催化共振，特斯拉人形机器人迈向 量产，看好板块持续性。","（2）AIDC 发电设备：行业仍然保持 高景气，坚定看好国产燃机出海。","（3）工程机械：6 月挖机内 外销继续超预期，低位坚定布局。","（4）半导体设备：全球半导 体设备进入大周期，关注涨价+出海。","（5）锂电设备：固态电 池新国标落地，产业发展从初步验证走向规模化建设。"]},{"title":"其他要点","lines":["来源文件夹：机械","报告类型标签：周报"]}]},"csc-r0706-17-0d97":{"title":"周观点：特斯拉人形机器人迈向量产，西门子上修燃气轮机需求预测","sections":[{"title":"核心观点","lines":["（1）人形机器人：人形机器人边际催化不断，特斯拉人形机器 人迈向量产，看好板块持续性。","（2）AIDC 发电设备：行业仍 处供需失衡，坚定看好国产燃机出海。 同发力期，规模效益初步显现。","7 月 16 日，全资子公司博源智驱拟以增资方式向宸裕精密投资5000 万元， 增资完成后持有其55.56%股权，实现控股并表。"]},{"title":"其他要点","lines":["来源文件夹：机械","报告类型标签：公司点评"]}]},"csc-r0701-24-045b":{"title":"聚和材料（688503）：国产空白掩模版先行者，致力于打造泛半导体材料平台","sections":[{"title":"核心观点","lines":["光伏银浆龙头地位稳固，致力于打造泛半导体材料平台。","公司通过收购SK Enpluse旗下空白掩模版进军半导体领域，制程覆盖18-90nm节点，已通过SK海 力士、TMC、迪思微、中微掩模等客户验证并实现批量销售；AI时代芯片多样化+超级扩产周期共振，制程升级驱动空白掩模版量价倍数级增长；目前国内空白掩模国 产化率几乎为零，将直接受益中韩半导体景气周期。"]},{"title":"其他要点","lines":["来源文件夹：电力设备与新能源","报告类型标签：公司点评"]}]},"csc-r0728-25-98e0":{"title":"800VDC将成为供电架构迭代的关键催化，受益方向包括柜内、柜外、板级电源等","sections":[{"title":"核心观点","lines":["800VDC 强趋势已成为各AI 芯片、电源企业共识，为供电架构 演进的关键催化。"]},{"title":"其他要点","lines":["来源文件夹：电力设备与新能源","报告类型标签：行业跟踪"]}]},"csc-r0706-26-b030":{"title":"上能电气（300827）：海外光储驱动收入增长，毛利率改善支撑盈利修复","sections":[{"title":"核心观点","lines":["公司2025 年收入保持稳健增长，利润端同步提升但增速略低于 收入，主要受国内业务毛利率偏低、费用端扰动等因素影响。","业务结构看，光伏逆变器仍是收入主体，储能业务维持较高占 比；分地区看，海外收入同比高增78.14%，且毛利率显著高于 国内，是公司业绩增长和利润弹性的核心来源。","公司后续增长 点在于，海外地面光伏订单高增、海外PCS 出货和美伊战争后 户储需求延续修复。"]},{"title":"其他要点","lines":["来源文件夹：电力设备与新能源","报告类型标签：公司点评"]}]},"csc-r0712-27-51d2":{"title":"供需分歧是回调原因，但北美长期电力缺口形势将在下半年走向清晰","sections":[{"title":"核心观点","lines":["本文复盘了2026 年4 月底至6 月北美缺电板块的回调本质是发电设备 供需的长期能见度担忧，我们从理论和事实层面给出“供需缺口仍在” 的依据：①理论测算显示2026 至2028 年每年分别有14、20、20GW 电 力缺口需填补。"]},{"title":"其他要点","lines":["来源文件夹：电力设备与新能源","报告类型标签：行业跟踪"]}]},"csc-r0705-28-9fdb":{"title":"供需趋紧钠电放量，格局优异铝箔可期","sections":[{"title":"核心观点","lines":["铝箔环节作为锂电材料中小而美的赛道，一方面行业竞争格局集 中，龙头市占率38%左右，另一方面今年以来铝箔对客户的涨价 落地覆盖度高，加工费的累计涨幅达到1000-1500 元/吨，且我们 测算2026 下半年到2027 年铝箔行业供需仍将持续改善，为后续 的涨价奠定基础。","同时，钠离子电池商业化进展进入从1 到10 的阶段，铝箔环节技术路线确定、单位用量翻倍，将充分受益。"]},{"title":"其他要点","lines":["来源文件夹：电力设备与新能源","报告类型标签：行业跟踪"]}]},"csc-r0725-29-46de":{"title":"储能的持续增长，推动锂电行业2027年增速预计落在25％-32％区间","sections":[{"title":"核心观点","lines":["告目的，不包括香港、澳门、台湾）提供。","在遵守适用的法律法规情况下，本报告亦可能由中信建投（国际）证券有限公司在香港提供。","同时请务必阅读正文之后的免责条款和声明。"]},{"title":"其他要点","lines":["来源文件夹：电力设备与新能源","报告类型标签：行业跟踪"]}]},"csc-r0718-30-8127":{"title":"国内新能源车跟踪：6月市场持续修复，出口渗透率57％创新高","sections":[{"title":"核心观点","lines":["6 月中汽协口径国内新能源车销量164.3 万辆，同/环比+23.6%/+9.8%； 其中出口52.3 万辆，同/环比+155.1%/+17.2%，维持高增趋势，海外需 求持续旺盛。","乘联会口径新能源乘用车批售148.1 万辆，同/环比 +19.3%/+9.6%，渗透率62.8%，环比+1.7pct。"]},{"title":"其他要点","lines":["来源文件夹：电力设备与新能源","报告类型标签：行业跟踪"]}]},"csc-r0728-31-9c47":{"title":"宁德时代（300750）：2026年半年报点评：出货高增盈利稳健","sections":[{"title":"核心观点","lines":["公司26H1 实现营收/归母/扣非2769/433/390 亿元，同比+55%/+42%/ +43%；其中26Q2 实现营收/归母/扣非1478/225/209 亿元，同比+57%/ +36%/+36%，环比+14%/+9%/+16%。"]},{"title":"其他要点","lines":["来源文件夹：电力设备与新能源","报告类型标签：公司点评"]}]},"csc-r0727-32-0769":{"title":"欧洲6月电车跟踪：欧洲九国新能源车销量40.39万辆，高增趋势稳定","sections":[{"title":"核心观点","lines":["欧洲九国6 月电车销量40.39 万辆，同比+44%，环比+29%，渗透 率37.7%，同比+8.3pct，环比+2.1pct，主要国家销量表现分析：法 国销量同比+68%，补贴作用下销量同比增速稳定，政策刺激持续 推动；德国26 年起重启补贴，6 月销量同比高增60%；英国25 年 12 月扩大购车直接补贴资金规模，6 月同比+32%；葡萄牙6 月正 式启动第二阶段零排放车辆购置补贴，销量同比+…"]},{"title":"其他要点","lines":["来源文件夹：电力设备与新能源","报告类型标签：行业跟踪"]}]},"csc-r0719-33-cf61":{"title":"每周观察：AI驱动PCB需求升级，感光干膜加速高端化与国产化","sections":[{"title":"核心观点","lines":["感光干膜是PCB 电路图形转印的核心耗材之一，当前全球PCB 及封装基板已经进入一轮由AI 服务器、数据中心和高速网络设 备驱动的结构性增长周期，我们预计2026-2030 年感光干膜市场 空间分别为95/104/113/124/136 亿元，对应2025-30 年CAGR 约 为9.4%。"]},{"title":"其他要点","lines":["来源文件夹：电力设备与新能源","报告类型标签：周报"]}]},"csc-r0803-34-5281":{"title":"碳酸锂深度报告：产能逐步释放，2027年全年仍难言过剩","sections":[{"title":"核心观点","lines":["核心要点：2026H2需求旺季到来，预计碳酸锂供给缺口将逐步放大，Q4来到缺口峰值，若虑产业链提前备货，年内价格高点可能在Q3末-Q4初， 2027年预计需求持续景气，碳酸锂供给逐步释放但全年仍难言过剩。"]},{"title":"其他要点","lines":["来源文件夹：电力设备与新能源","报告类型标签：深度报告"]}]},"csc-r0730-35-1d14":{"title":"美国6月电车跟踪：销量9.9万辆，同比降幅显著收窄","sections":[{"title":"核心观点","lines":["6 月美国新能源汽车销量9.89 万辆，同比-22.8%，环比-1.3%，渗透率 7.0%，同比-2.8pct，环比+0.4pct。","其中纯电销量8.11 万辆，同比-19.7%， 环比-8.0%；插混销量1.78 万辆，同比-34.4%，环比+48.7%。"]},{"title":"其他要点","lines":["来源文件夹：电力设备与新能源","报告类型标签：行业跟踪"]}]},"csc-r0712-36-dd6d":{"title":"亮眼业绩夯实有色回升基础","sections":[{"title":"核心观点","lines":["本周有色商品价格以震荡为主，守住了对美联储加息预期纠偏的回升成果，但美 伊局势再现紧张，价格未能更进一步。","然而，有色权益端近期表现相对不错，在 科技大幅波动之际，有色公司陆续公布上半年亮眼的业绩预增公告，吸引了市场 再均衡资金的流入，有色标的估值得以修复。","往后看，有色供需状态良好，能够 支撑价格维持高位或更上一台阶，在此背景下，尚处于低PE 的有色权益标的往 上的动能远大于往下的压力。"]},{"title":"其他要点","lines":["来源文件夹：金属及金属材料","报告类型标签：行业跟踪"]}]},"csc-r0712-37-da61":{"title":"供给宽松预期压制锂价，淡季不淡有望反弹","sections":[{"title":"核心观点","lines":["锂：本周锂价大幅下行，供给边际宽松预期给予压制，主要是江 西锂矿复产及津巴布韦锂精矿到港均将在7 月兑现，但精矿维持 紧现实格局，部分锂盐厂因原料偏紧及检修等因素出现减量，辉 石及云母产量下降，周内产量维持降势；同时库存方面依然维持 去化，部分散单惜售挺价。"]},{"title":"其他要点","lines":["来源文件夹：金属及金属材料","报告类型标签：行业跟踪"]}]},"csc-r0802-38-8cfa":{"title":"供需双弱稀土价格盘整，旺季预期有望助力向上","sections":[{"title":"核心观点","lines":["稀土：7 月稀土各品种表现差异明显，氧化镨钕先扬后抑，氧化 铽跳涨后回调，氧化镝整体平稳。","供给端，由于废料厂原料紧张 问题导致产量明显下滑，据SMM，7 月氧化镨钕产量环比下降 11%，8 月或有边际改善，但总体产量仍被压制。"]},{"title":"其他要点","lines":["来源文件夹：金属及金属材料","报告类型标签：行业跟踪"]}]},"csc-r0705-39-845e":{"title":"加息预期纠偏，有色触底回升","sections":[{"title":"核心观点","lines":["周四美国6 月非农就业数据全面不及预期，不仅新增就业仅5.7 万，且5 月和4 月数据双双下修，该数据令市场对美联储年内加息预期显著降温，美元和美债收 益率承压，黄金领衔工业金属反弹，被压制已久的有色板块表现亮眼。","我们一直 强调，工业金属的基本面良好，在供应干扰及下游消费边际改善的情况下。","铜、 锡、铝维持大幅去库。"]},{"title":"其他要点","lines":["来源文件夹：金属及金属材料","报告类型标签：行业跟踪"]}]},"csc-r0720-40-44ef":{"title":"基本面优异，工业金属跑出相对","sections":[{"title":"核心观点","lines":["本周大盘大幅调整，但是，基本工业金属表现出很强的抗跌性，主要是有色商品 价格坚挺，有色公司预告的上半年业绩亮眼，且工业金属股票本已经在很低的位 置上。","展望后期，有色供需状态良好，铜、铝、锡等金属均呈现持续去库状态， 且供应端还陆续有扰动出现，如刚果（金）查封KCC、电解铝生产事故等，有动 力将推上新台阶，在此背景下，尚处于低PE 的有色权益标的在沉寂过后有望重 新获得资金青睐，走出回升的趋势。"]},{"title":"其他要点","lines":["来源文件夹：金属及金属材料","报告类型标签：行业跟踪"]}]},"csc-r0802-41-3ab0":{"title":"库存持续高强度去化，铝价反弹延续","sections":[{"title":"核心观点","lines":["6 月中东通航引发货物流出及远期海外新增投产数量较多的担忧压力，使得铝价 被沽空，跌破24000 关口至22400 止跌，止跌的支撑来自于持续高强度的库存去 化，即年内全球120 万吨的缺口正在不断的通过消化库存来呈现。","这个逻辑还会 继续演绎，为铝价进一步反弹提供动力，预计在国内库存下破80 万吨过程中铝 价有望重回2.4-2.5w 区间。"]},{"title":"其他要点","lines":["来源文件夹：金属及金属材料","报告类型标签：行业跟踪"]}]},"csc-r0726-42-bc9a":{"title":"弱预期强现实，锂价有望维持反弹","sections":[{"title":"核心观点","lines":["锂：周内锂价走出止跌反弹趋势，当前价格过度计价远期宽松预 期，伴随周度库存维持下降，价格短线超跌。","年内而言基本面依 然强劲，供给端保持紧张，据百川，近期部分锂盐厂陆续公布检 修计划，本月及下月将形成阶段性减量，对短期供给带来一定收 缩预期，南美盐湖遭遇暴雪，可能进一步影响三季度产量和发运 节奏。"]},{"title":"其他要点","lines":["来源文件夹：金属及金属材料","报告类型标签：行业跟踪"]}]},"csc-r0719-43-be8c":{"title":"淡季不淡旺季可期，锂价有望低位反升","sections":[{"title":"核心观点","lines":["锂：由于锂价近期快速下行，上游惜售情绪加重，挺价明显，部 分散单报价仍维持在16 万元/吨以上；同时下游逢低采购，材料 厂15 万元/吨以下的采购情绪较为积极，但采购行为依然谨慎， 整体以刚需为主。","供给端，碳酸锂产量下行，部分锂盐厂按计划 进入检修，导致锂辉石产线减量明显。"]},{"title":"其他要点","lines":["来源文件夹：金属及金属材料","报告类型标签：行业跟踪"]}]},"csc-r0705-44-b752":{"title":"现货收紧需求预期走高，稀土价格有望上行","sections":[{"title":"核心观点","lines":["稀土：周内稀土价格继续上行，氧化镨钕周涨幅3.05%，由于废 料趋紧，回收企业开工率下降，导致稀土产量整体下调，据SMM， 6 月氧化镨钕产量下降约6%，再生氧化镨钕占氧化镨钕总产量的 比例，已由五月的44%降至本月的37%。","供给端整体偏紧，短期 难有增量预期。"]},{"title":"其他要点","lines":["来源文件夹：金属及金属材料","报告类型标签：行业跟踪"]}]},"csc-r0801-45-e162":{"title":"豫光金铅（600531）：铅铜冶炼为盾，高纯稀贵金属及新材料为矛","sections":[{"title":"核心观点","lines":["公司主要从事铅、铜、金、银冶炼回收以及新材料业务，目前已 成为我国最大的铅冶炼企业、白银生产企业，规模优势显著且具 备较强壁垒，伴随金银铜等金属价格中枢上涨以及项目投产带动 产量增加，公司冶炼利润有望持续兑现增长。"]},{"title":"其他要点","lines":["来源文件夹：金属及金属材料","报告类型标签：公司点评"]}]},"csc-r0726-46-08b4":{"title":"铜价尝试向上摆脱区间束缚","sections":[{"title":"核心观点","lines":["近期铜价尝试站上区间上沿，一则美联储年内加息预期有所下调；二则供给扰动 频发，需求保持稳定增长，供需存在缺口；三则全球库存分布极其不均匀，COMEX 独占70 万吨、LME 约28 万吨、国内近10 万吨。","国内低库存导致现货流动趋紧， 出现现货升水伴随期货价格一同走高的局面。","总体来看，铜价稳中求进，年内有 冲击11 万的动力。","价格有看点，资源属性无争议，建议优先配置铜矿资源标的。"]},{"title":"其他要点","lines":["来源文件夹：金属及金属材料","报告类型标签：行业跟踪"]}]},"csc-r0802-47-38da":{"title":"钢铁周观点：7月PMI反映经济磨底，钢市承压","sections":[{"title":"核心观点","lines":["7 月宏观经济与钢铁产业链数据同步交出一份偏弱答卷，制造业 PMI 回落至49.2%，较6 月下滑1.1 个百分点，三大指数——制 造业、非制造业商务活动、综合PMI 产出分别为49.2% 、 49.0%、49.3%，全线跌入收缩区间，为近一年来少见。","落到钢 铁这个高耗能代表行业，7 月数据可以用“弱现实全面显性化” 概括。"]},{"title":"其他要点","lines":["来源文件夹：金属及金属材料","报告类型标签：周报"]}]},"csc-r0805-hk-rebound":{"title":"港股是反弹还是反转？","sections":[{"title":"核心观点","lines":["本轮港股反弹：全球科技周期上可理解为从硬件瓶颈走向“应用变现”；港股自身则是多重重压边际改善后的反弹。","港股与日韩AI硬件行情呈跷跷板，内部呈K型分化——消费/互联网/汽车等应用端领涨，前期拥挤AI硬件回撤。","反弹因前期极致压抑缓和：大模型降价利好应用端、外汇储备增配香港与南向资金、美元指数震荡缓释分母压力、盈利下修放缓。","真正长牛需跨过两大门槛：企业盈利改善（决定趋势）与美元流动性松弛（决定弹性）；此前更接近估值修复。","跟踪：8月中报季重点公司盈利、美债长端与美元流动性、南向与外资回流是否持续。"]},{"title":"跟踪要点","lines":["来源文件夹：宏观研究","报告类型标签：深度/系列（港股研究系列）"]}]},"csc-r0809-01-fdf0":{"title":"周观点：开源模型商业化提速，看好国产多模态与AI应用共振","sections":[{"title":"核心观点","lines":["继续看好开源模型与AI应用。"]},{"title":"其他要点","lines":["来源文件夹：全球AI创新与互联网","报告类型标签：周报"]}]},"csc-r0808-02-73e4":{"title":"SpaceX二季度业绩高增，卫星互联网商业闭环加速成型","sections":[{"title":"核心观点","lines":["8 月4 日，SpaceX 发布2026 年第二季度业绩，营业收入同比增 长92%至78.14 亿美元，其中，连接业务收入42.91 亿美元，同比 增长66%。","从产业进展看，SpaceX 正加快打通“低成本发射—星座 组网—终端连接—运营服务”商业闭环。"]},{"title":"其他要点","lines":["来源文件夹：军工及新材料","报告类型标签：行业跟踪"]}]},"csc-r0806-03-c747":{"title":"7月非农前瞻：会来惊喜吗","sections":[{"title":"核心观点","lines":["（1）可能呈现非农低于预期（5 万左右，预期8 万）、失业率高于预期（4.3%以上，预期4.2%） 的组合。","（2）看多非农的逻辑集中在：一是，初请失业金人数近期偏低；二是，6 月休闲酒店就业在世界 杯加持下，异常下降，本月或反弹。","但均存疑问。"]},{"title":"其他要点","lines":["来源文件夹：宏观-海外经济与大类资产","报告类型标签：行业跟踪"]}]},"csc-r0808-04-f211":{"title":"反弹级别有望扩大","sections":[{"title":"核心观点","lines":["① 指数筹码盈利月线已突破1 sigma，季线同步上行，估值持续修复。","若月线维持1 sigma 以上、季 线继续回升，赚钱效应有望进一步扩散，行情级别或继续抬升。","② 融资由弱转强，右侧苗头出现。","目前技术得分已连续一周维持在1 sigma 以上，融资成交占比同 步修复至月度均值附近，价格与增量资金开始形成共振。"]},{"title":"其他要点","lines":["来源文件夹：宏观-海外经济与大类资产","报告类型标签：行业跟踪"]}]},"csc-r0808-05-a0e3":{"title":"非农：为何暑期崩盘一再上演","sections":[{"title":"核心观点","lines":["① 当前不支持长期单向交易，经济韧性程度不足以和更高美债利率/联储加息构成稳定均衡，而 利率下行对基本面的催化又易触发通胀担忧，同样难持续。","因此，经济数据、联储预期、市 场叙事，均反复切换。","② 7 月非农走弱，或有噪音，这是偶然；但Q2 利率飙升，就业在下半年某个时点重新走弱，或 是必然。"]},{"title":"其他要点","lines":["来源文件夹：宏观-海外经济与大类资产","报告类型标签：行业跟踪"]}]},"csc-r0809-06-9bcf":{"title":"迎接美元流动性宽松叙事——全球大类资产周观点（115）","sections":[{"title":"核心观点","lines":["全球资本市场定价难以忽视美元流动性。","直到最近，一则大幅不及预期的非农数据挑破美联储困境：通胀、 美元（背后是科技）、就业，如何取舍？","全球从高通胀因而紧货币的叙事中逆转，再度迎来宽松流动性定 价。","我们之前曾论述过： 第一，美联储政策底色是为服务美国基本利益。","所谓的联储独立性 以及货币框架，均会因时调整，1970s 便是最好例证。"]},{"title":"其他要点","lines":["来源文件夹：宏观研究","报告类型标签：周报"]}]},"csc-r0807-07-77f2":{"title":"创科实业（0669）：盈利能力持续提升，Milwaukee增长依旧强劲——工具五金系列报告","sections":[{"title":"核心观点","lines":["2026 年上半年公司营收稳健增长，Milwaukee 经调整后销售同比 增长10.5%，带动专业业务较快增长；消费者业务受退出HART 及户外产品需求偏弱影响有所承压。","盈利端，关税缓解持续见效， 叠加供应链及生产效率优化、高毛利核心业务占比提升，公司毛 利率同比提升2.6 个百分点，归母净利润同比增长17.5%，自由 现金流同比增长60.9%。"]},{"title":"其他要点","lines":["来源文件夹：机械","报告类型标签：深度报告"]}]},"csc-r0808-08-1587":{"title":"利柏特（605167）：核电站批量批复有望推动模块化业务放量，股权激励彰显信心——模块化设备系列报告","sections":[{"title":"核心观点","lines":["公司以工业模块制造为核心，具备大型、超大型模块设计制造及 EPFC 全产业链服务能力，持续拓展高端工业模块及工程服务市 场。","国内核电项目保持批量核准，模块化建造需求有望扩容，公 司凭借历史项目经验有望受益。","第二期员工持股计划覆盖核心骨 干，分期解锁并设置业绩考核，强化中长期利益绑定，同时彰显 对后续业绩增长信心。"]},{"title":"其他要点","lines":["来源文件夹：机械","报告类型标签：深度报告"]}]},"csc-r0809-09-e32e":{"title":"周观点：宇树IPO定价超出预期利好机器人板块，半导体设备关注去日化与出海","sections":[{"title":"核心观点","lines":["（1）人形机器人：宇树IPO 定价超出预期，有望带动本体厂商 估值重塑；预计板块后续催化不断，建议聚焦优质环节。","（2） AIDC 发电设备：三巨头财报落地，再次印证燃机行业高景气。","（3）工程机械：7 月挖机内外销继续共振向上，板块将迎来逐 季度改善。","（4）半导体设备：全球半导体设备进入大周期，关 注去日化+出海。","（5）锂电设备：锂电排产连续创新高，固态 电池迈入装车新阶段。"]},{"title":"其他要点","lines":["来源文件夹：机械","报告类型标签：周报"]}]},"csc-r0807-10-55e6":{"title":"宇树科技（688836）：全球通用机器人领跑者，全栈自研构建商业化飞轮","sections":[{"title":"核心观点","lines":["宇树科技是全球高性能通用机器人领跑者，形成“四足机器人+人 形机器人”双轮驱动的产品格局，招股书披露2025 年两类产品出 货量均居全球第一。","公司凭借全栈自研体系构筑核心壁垒，盈利 能力显著领先同行，业绩高速增长，营收三年十倍。","此外，公司 在运动控制领域持续领跑，募投项目持续加码机器人模型研发。"]},{"title":"其他要点","lines":["来源文件夹：机械","报告类型标签：公司点评"]}]},"csc-r0809-11-22ca":{"title":"越疆（2432）：H回A高效过会，具身智能加速发展","sections":[{"title":"核心观点","lines":["2026 年7 月22 日，越疆创业板IPO 获深交所上市委审议通过， 成为大湾区首单“H 回A”案例，从受理到过会仅用86 天，审核 节奏高效紧凑。","公司回A 上市，有望深化境内外资本市场联动， 加速公司核心战略落地。","创业板IPO 公司拟募资12 亿元，将持 续加大在具身智能机器人领域的研发投入，并加速推进具身智能 产业化落地。"]},{"title":"其他要点","lines":["来源文件夹：机械","报告类型标签：公司点评"]}]},"csc-r0809-12-2f65":{"title":"唯品会（VIPS）：2Q26业绩前瞻：短期收入承压，供应链优势稳固","sections":[{"title":"核心观点","lines":["受疲软消费环境压制，我们预计公司2026Q2 收入略有压力，预 计收入为247 亿元人民币，yoy-4.3%，QoQ-7.0%。","利润端仍保持 稳健，预计GAAP 归母净利润为15.3 亿元（NPM 6.2%）,Non- GAAP 净利润为19.3 亿元（NPM 7.8%），同比-7.1%；Non-GAAP 经营利润为21.3 亿元（经营利润率8.6%）。"]},{"title":"其他要点","lines":["来源文件夹：海外研究","报告类型标签：公司点评"]}]},"csc-r0807-13-468a":{"title":"小米集团-W（1810）：26Q2业绩前瞻：存储压力边际缓和，关注澎程新车催化","sections":[{"title":"核心观点","lines":["短期来看，全球存储涨价斜率逐步放缓，存储成本压力迎来边际 缓解；手机端持续执行提价+结构调整策略，ASP 再创阶段新高， 手机毛利率保持一定韧性。"]},{"title":"其他要点","lines":["来源文件夹：海外研究","报告类型标签：公司点评"]}]},"csc-r0809-14-b0cb":{"title":"周报26年第30期：模型Scaling持续，AI自我改进加速","sections":[{"title":"核心观点","lines":["前沿模型Scaling 进入多路径并行阶段。","Anthropic Mythos 5、 Fable 5 被行业估算为8 万亿和5 万亿参数，Kimi K3 总参数达到 2.8万亿，字节据报正在预训练最高10万亿参数模型；Post-training 进一步延伸至百万Token Agent 轨迹、数千次工具调用和持续数 小时的复杂任务。"]},{"title":"其他要点","lines":["来源文件夹：计算机","报告类型标签：周报"]}]},"csc-r0809-15-aeda":{"title":"周报2026年8月第2期：DeepSeek拟提价，持续关注国产大模型及算力产业链","sections":[{"title":"核心观点","lines":["8月3日，阿里发布新一代旗舰模型Qwen3.8-Max，总参数量达到 2.4 万亿、激活参数约950 亿，模型在推理、代码及Agent 等能力 上进一步提升。","DeepSeek 于8 月6 日公告称，计划近期整体上调 API 服务定价。","鸿海7 月营收单月首次突破9000 亿新台币并创历史新高。","TrendForce 将2026 年全球AI 服务器出货量同比增速上调至接近 31%。"]},{"title":"其他要点","lines":["来源文件夹：通信及人工智能&科技前瞻","报告类型标签：周报"]}]},"csc-r0810-16-4896":{"title":"7月稀土出口量进一步下滑，量减价涨海外紧张格局延续","sections":[{"title":"核心观点","lines":["稀土：据海关总署数据，7 月稀土出口量明显回落，均价上涨。","7 月稀土出口量4223.5 吨，同比下降29.54%，环比下降17.26%， 为3 月以来的单月最低水平；1‑7 月累计出口34706.3 吨，同比 下滑10%。","但对应出口均价12.34 美元/千克，同比大涨 103.14%， 出口结构向高价值中重稀土产品倾斜，海外市场接受高价原料， 全球稀土供给紧张格局延续。"]},{"title":"其他要点","lines":["来源文件夹：金属及金属材料","报告类型标签：行业跟踪"]}]},"csc-r0809-17-c65b":{"title":"AI基建提速叠加海外军工补库，持续看好“算力金属”及“军工金属”","sections":[{"title":"核心观点","lines":["伴随全球人工智能算力基础设施建设提速，钽、铟、锡三种AI 敞口较 大的小金属价格中枢持续上移；此外，据CCTV 国际时讯，美国总统特 朗普当地时间8 月7 日宣布，联邦政府将向多个关键矿产和电池项目投 资30 亿美元，旨在增加美国国内产量，并以此推动国家安全与产业政策。","分析指出，特朗普政府现正急需关键矿产，来补充在与伊朗冲突中消耗 的武器库存。"]},{"title":"其他要点","lines":["来源文件夹：金属及金属材料","报告类型标签：行业跟踪"]}]},"csc-r0809-18-b098":{"title":"美国非农不及预期，助力有色持续反攻","sections":[{"title":"核心观点","lines":["本周有色呈现股期联动上涨的势头，一方面，有色价格在供应端出现扰动、消费 尚可及美国加息预期缓解的背景下保持强势，金价创7 周以来新高，铜价直逼历 史前高，铝价重夺24000 关口；另一方面，极致的市场风格再均衡，处于低配的 有色板块以其优异的业绩和较低的PE 持续吸引资金的流入。"]},{"title":"其他要点","lines":["来源文件夹：金属及金属材料","报告类型标签：行业跟踪"]}]},"csc-r0811-01-c199":{"title":"军工板块发布半年报预告，船舶增速显著航发企稳","sections":[{"title":"核心观点","lines":["近日，多家国防军工板块公司发布了半年报业绩预告，主机厂方面， 中国船舶、航发动力等公司业绩实现较大幅度上涨。","中无人机、航天彩 虹、纵横股份等无人机公司业绩持续回升。","航空产业链业绩下滑。","受传 统军工板块新签订单下降影响，军工信息化公司普遍出现不同程度的业 绩下滑，如四创电子、七一二、海格通信、烽火电子等。","整体来讲，上半 年国防军工板块业绩增长点主要为船舶和军贸拉动，预计下半年仍然延 续该趋势。"]},{"title":"其他要点","lines":["来源文件夹：军工及新材料","报告类型标签：行业跟踪"]}]},"csc-r0811-02-3f2e":{"title":"六张网的政策深意：科技和民生","sections":[{"title":"核心观点","lines":["“六张网”规模多大，资金从何而来？","十五五期间累计规模有望达25 万亿，2026 年超7 万亿元。","算力、 电网、通信、物流网以市场化投资为主，其中算力网更青睐民间 投资；水网、地下管网更依赖财政与政策性资金。","“六张网”投资中哪些跟AI基建有关？","AI 基建相关的是三张网——算力网、新型电网、新一代通信网。","三者累计投资有望超过11 万亿，仅算力网可达4 万亿元。"]},{"title":"其他要点","lines":["来源文件夹：宏观研究","报告类型标签：行业跟踪"]}]},"csc-r0812-01-cd07":{"title":"“十五五”规划密集出台锚定产业新方向，霍尔木兹僵局与美联储分歧升温（2026年8月3日-8月9日）","sections":[{"title":"核心观点","lines":["本周重点关注三方面政策：（1）国内产业政策密集落 地，《集成电路布图设计保护条例》二十年来首次系统性修 订并将光子、量子芯片纳入保护范围，新型电力系统等“十 五五”专项规划集中出台，明确中长期产业方向。","（2）宏 观与货币政策协同发力，7 月CPI 温和回落、进出口延续高 增；央行通过买断式逆回购等工具净投放中长期流动性，外 储保持稳定，黄金连续二十一个月增持。"]},{"title":"其他要点","lines":["来源文件夹：宏观-政策研究","报告类型标签：公司点评"]}]},"csc-r0812-02-b0ff":{"title":"逆转叙事，还差什么：7月美国CPI点评","sections":[{"title":"核心观点","lines":["地产、消费偏弱，租金、核心商品内生涨价动能不足，核心CPI 有望保持低位，3 个月环比中枢已掉 至0.2%以内，低于年初水平，而彼时有2-3 次降息预期。","但是，当前与年初比，有三大不同，这是宽松交易能否进阶为降息交易的关键： （1） 油价。","美伊不确定性大，不论是机票分项对核心通胀的拉动，还是整体物价观感，油价影响 不可忽视。","（2） 就业。","年初就业市场衰退担忧较浓，目前系统性改善。"]},{"title":"其他要点","lines":["来源文件夹：宏观-海外经济与大类资产","报告类型标签：行业跟踪"]}]},"csc-r0812-03-f383":{"title":"阳光电源（300274）：多重利空price in，底部信号明确 ——阳光电源深度报告","sections":[{"title":"核心观点","lines":["公司业绩波动的关键矛盾是储能业务的量、利变化，我们得出以下结论：（1）分别测算公司在悲观、中性、乐观场景下储能业务的量、利，即使在公司丢失大部分北美、 部分欧洲市场的悲观场景下，公司明年业绩底部约130亿，市值底部约2000亿，目前市值反映的是最悲观预期，实际情况将好于此；（2）25Q4以来储能盈利能力已偏 离过往中枢，为订单周期较长导致签单价格与成本错配所引起，但随着新签订单逐步传导，这只是利润…"]},{"title":"其他要点","lines":["来源文件夹：电力设备与新能源","报告类型标签：深度报告"]}]},"csc-r0812-04-bb5b":{"title":"纽威股份（603699）：推出限制性股票激励计划，盈利考核与核心团队绑定进一步强化","sections":[{"title":"核心观点","lines":["公司推出2026 年限制性股票激励计划，拟向188 名董事、高管、中层 管理人员及核心技术（业务）骨干授予499.43 万股，占总股本0.64%。","考核采用“公司-事业部-个人”三层体系，公司层面要求2026-2028 年 归母净利润较2025 年分别增长不低于10%、21%、33%，对应约10% 的复合增速。"]},{"title":"其他要点","lines":["来源文件夹：电力设备与新能源","报告类型标签：公司点评"]}]},"csc-r0813-01-c8b6":{"title":"阅文集团（0772）：2Q26业绩点评：IP运营表现亮眼，关注H2游戏授权增量","sections":[{"title":"核心观点","lines":["上半年业绩增长稳健，IP 运营表现亮眼。","收入同比增长 10.7%，毛利同比增长11.1%，其中IP 运营业务收入同比增长 40.3%，短剧和漫剧、IP 衍生等业务表现突出。","看好公司短剧漫剧布局。","上半年收入突破4.3 亿元，同比增 长2.3 倍。","公司已构建“网文—IP 改编—AI 制作—发行— 变现” 的完整闭环，短剧爆款率达市场平均4 倍，漫剧百万播放率达行 业平均5 倍。"]},{"title":"其他要点","lines":["来源文件夹：全球AI创新与互联网","报告类型标签：公司点评"]}]},"csc-r0814-02-f600":{"title":"滴滴出行-ADR（DIDIY）：主要经营指标表现强劲，国际生态延续投入趋势","sections":[{"title":"核心观点","lines":["2026Q2 滴滴实现营业收入625.22 亿元，同比增长10.85% ； 经调整净利润为2.84 亿元，对应经调整净利率为0.45%。"]},{"title":"其他要点","lines":["来源文件夹：海外研究","报告类型标签：公司点评"]}]},"csc-r0816-01-3937":{"title":"周观点：国产模型密集发布：GLM 5.3、DeepSeek V4 Pro","sections":[{"title":"核心观点","lines":["模型竞争从能力强延展至产品好用，继续看好开源模型与AI 应用； Q2 财报密集发布中，重点关注。","本周腾讯资本开支确认加速，模型迭 代竞争激烈，开源、闭源模型的价格进一步收敛。","1/模型竞争从单点能力转向“模型 × Harness × 工作流”，DeepSeek Harness 推出，智谱Zcode 用户突破100 万，智谱同步为全部GLM Coding Plan 用户重置额度。"]},{"title":"其他要点","lines":["来源文件夹：全球AI创新与互联网","报告类型标签：周报"]}]},"csc-r0816-02-5cc7":{"title":"科技之外哪些板块值得关注——全球大类资产周观点（116）","sections":[{"title":"核心观点","lines":["市场寻找科技之外板块机会。","讨论主要集中在三个领域， 内需消费，资源品红利，港股。","我们怎么理解？","①消费有定价修复的机会，但暂时看不到大贝塔机会。","原因是中国 已经度过了以土地为锚的杠杆时代，消费的黄金时代已经过去。","②资源品红利我们尤其看好铜金机会，我们在此前的周报《铜金有 机会》中也有所提示。"]},{"title":"其他要点","lines":["来源文件夹：宏观研究","报告类型标签：周报"]}]},"csc-r0815-03-9302":{"title":"杰瑞股份（002353）：中东冲突及汇兑干扰二季度利润，燃机订单高增逐步进入交付期","sections":[{"title":"核心观点","lines":["公司2026H1 收入76.46 亿元保持稳健增长，海外业务、油气工程及技 术服务表现较好；利润端受中东项目延期、汇兑损失及出售光明能源 有所下降，但不改长期增长趋势。","传统油气业务保持韧性，2026H1 新 订单100.46 亿元，油气装备与天然气项目持续推进；电力及数据中心 业务实现突破，自2025 年11 月至报告披露日累计获取燃机及配套设 备订单超31 亿美元。"]},{"title":"其他要点","lines":["来源文件夹：机械","报告类型标签：公司点评"]}]},"csc-r0814-04-84ae":{"title":"鸿仕达（920125）：泛半导体放量驱动业绩高增，业务结构升级打开盈利弹性","sections":[{"title":"核心观点","lines":["2026 年上半年公司实现营业收入2.72 亿元，同比增长38.67% ，归母 净利润0.24 亿元，同比增长332.00%。","业绩大幅增长主要系泛半导体 与新能源业务高速扩张，同时高毛利业务占比提升带动盈利水平显著 改善。","收入结构持续优化，泛半导体业务收入同比增长超4 倍，毛利 率达52.43%，成为核心增长引擎。"]},{"title":"其他要点","lines":["来源文件夹：机械","报告类型标签：公司点评"]}]},"csc-r0816-05-f452":{"title":"优利德（688628）：越南产能释放推动业绩高增，高端化升级构筑长期动能（更新）","sections":[{"title":"核心观点","lines":["2026H1 公司实现营业收入8.15 亿元，同比增长32.02%；归母净利润 1.40 亿元，同比增长42.82%。","北美市场订单增长叠加越南产能全面释 放，推动境外收入同比增长51.08%，主营产品毛利率提升2.71pct。","高 端示波器加快批量出货，射频测试产品矩阵持续完善；收购信测通信 进一步拓展光通信测试及电磁环境监测领域。"]},{"title":"其他要点","lines":["来源文件夹：机械","报告类型标签：公司点评"]}]},"csc-r0814-06-8908":{"title":"京东健康（6 <script>
(function() {
  const DATA = JSON.parse(document.getElementById('board-data').textContent);
  const INDEX = DATA.index;
  const BOARDS = DATA.boards;
  const REPORT_DETAILS = DATA.report_details;
  const REPORT_PDFS = DATA.report_pdfs || {};
  const REPORT_PDF_EMBEDS = DATA.report_pdf_embeds || {};
  const REPORT_ATTACHMENTS = DATA.report_attachments || {};
  const REPORT_ATTACHMENT_EMBEDS = DATA.report_attachment_embeds || {};
  const REPORT_ATTACHMENT_SHEETS = DATA.report_attachment_sheets || {};

  function reportAttachmentName(report) {
    return report.attachment_name || '';
  }

  function renderSourceEmbed(report) {
    const pdfHtml = renderPdfEmbed(report);
    const attachName = reportAttachmentName(report);
    const sheets = REPORT_ATTACHMENT_SHEETS[report.id];
    if (!attachName || !sheets) return pdfHtml;
    const attachBlock = `<div class="pdf-block"><h4 style="margin:0 0 8px">模型附件</h4><button class="btn-pdf-open" type="button" data-open-xlsx="${escapeHtml(report.id)}">${escapeHtml(attachName)}</button></div>`;
    return pdfHtml + attachBlock;
  }

  function xlsxDataUri(reportId) {
    const b64 = REPORT_ATTACHMENT_EMBEDS[reportId];
    return b64 ? `data:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;base64,${b64}` : '';
  }

  function renderXlsxTable(sheet) {
    const maxCols = sheet.rows.reduce((m, row) => Math.max(m, row.length), 0);
    const body = sheet.rows.map((row, ri) =>
      `<tr>${Array.from({length: maxCols}, (_, ci) => `<td>${escapeHtml(row[ci] ?? '')}</td>`).join('')}</tr>`
    ).join('');
    return `<table class="xlsx-table"><tbody>${body}</tbody></table>`;
  }

  let xlsxReaderReportId = '';

  function openXlsxReader(reportId) {
    const payload = REPORT_ATTACHMENT_SHEETS[reportId];
    if (!payload) return;
    const report = findReport(reportId);
    const attachName = report?.attachment_name || reportId;
    xlsxReaderReportId = reportId;
    document.getElementById('xlsx-reader-title').textContent = attachName;
    const dl = document.getElementById('xlsx-download');
    const uri = xlsxDataUri(reportId);
    if (uri) {
      dl.href = uri;
      dl.download = attachName;
      dl.classList.remove('hidden');
    } else {
      dl.classList.add('hidden');
    }
    const tabs = document.getElementById('xlsx-sheet-tabs');
    tabs.innerHTML = payload.sheets.map((s, i) =>
      `<button type="button" class="xlsx-sheet-tab${i===0?' active':''}" data-sheet-idx="${i}">${escapeHtml(s.name)}</button>`
    ).join('');
    showXlsxSheet(payload, 0);
    tabs.querySelectorAll('[data-sheet-idx]').forEach(btn => {
      btn.onclick = () => {
        tabs.querySelectorAll('.xlsx-sheet-tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        showXlsxSheet(payload, Number(btn.dataset.sheetIdx));
      };
    });
    document.querySelector('.wrap').classList.add('hidden');
    document.getElementById('xlsx-reader-page').classList.remove('hidden');
  }

  function showXlsxSheet(payload, idx) {
    const sheet = payload.sheets[idx];
    document.getElementById('xlsx-table-wrap').innerHTML = renderXlsxTable(sheet);
    const note = document.getElementById('xlsx-truncated-note');
    if (sheet.truncated) {
      note.textContent = `预览前 ${sheet.rows.length} 行（共 ${sheet.total_rows} 行）；完整数据请下载原文件`;
      note.classList.remove('hidden');
    } else {
      note.classList.add('hidden');
    }
  }

  function closeXlsxReader() {
    document.getElementById('xlsx-table-wrap').innerHTML = '';
    document.getElementById('xlsx-reader-page').classList.add('hidden');
    document.querySelector('.wrap').classList.remove('hidden');
    xlsxReaderReportId = '';
  }

  function reportPdfRelPath(reportId) {
    const abs = REPORT_PDFS[reportId] || '';
    if (!abs) return '';
    const m = abs.match(/MS研报看板\/(\d{8}\/pdfs\/[^/]+\.pdf)$/);
    return m ? m[1] : '';
  }

  function reportPdfDataUri(reportId) {
    const b64 = REPORT_PDF_EMBEDS[reportId];
    return b64 ? `data:application/pdf;base64,${b64}` : '';
  }

  function renderPdfEmbed(report) {
    const reportId = report.id;
    const pdfName = report.pdf_name || (REPORT_PDFS[reportId] || reportId).split('/').pop();
    const dataUri = reportPdfDataUri(reportId);
    if (!dataUri) return '';
    return `<div class="pdf-block"><h4 style="margin:0 0 8px">研报原文</h4><button class="btn-pdf-open" type="button" data-open-pdf="${escapeHtml(reportId)}">${escapeHtml(pdfName)}</button></div>`;
  }

  function openPdfReader(reportId) {
    const uri = reportPdfDataUri(reportId);
    if (!uri) return;
    const report = findReport(reportId);
    const pdfName = report?.pdf_name || (REPORT_PDFS[reportId] || reportId).split('/').pop();
    document.getElementById('pdf-reader-title').textContent = pdfName;
    document.getElementById('pdf-reader-frame').src = uri;
    document.querySelector('.wrap').classList.add('hidden');
    document.getElementById('pdf-reader-page').classList.remove('hidden');
  }

  function closePdfReader() {
    document.getElementById('pdf-reader-frame').src = '';
    document.getElementById('pdf-reader-page').classList.add('hidden');
    document.querySelector('.wrap').classList.remove('hidden');
  }
  const GLOSSARY = DATA.glossary;
  const WATCHLIST = new Set((DATA.watchlist_tickers || []).map(t => t.toUpperCase()));
  const AVAILABLE = new Set(INDEX.calendar.available_dates);

  const SENTIMENT = {
    '看好': '#15803d', '中性偏好': '#22c55e', '一般': '#6b7280', '跟踪': '#6b7280',
    '谨慎': '#ef4444', '下调': '#b91c1c'
  };
  const PRIORITY_RANK = {'⭐⭐⭐': 0, '⭐⭐': 1, '⭐': 2};
  const WEEKDAYS = ['日','一','二','三','四','五','六'];
  const BROKER_COLORS = { csc: '#1d4ed8', cicc: '#b45309', citics: '#be123c', demo: '#1d4ed8' };

  function collectBrokerIds() {
    const ids = new Set();
    if (INDEX.broker_id) ids.add(INDEX.broker_id);
    (INDEX.broker_filters || []).forEach(b => { if (b.id && b.id !== 'all') ids.add(b.id); });
    Object.values(BOARDS).forEach(board => {
      (board.reports || []).forEach(r => { if (r.broker_id) ids.add(r.broker_id); });
    });
    return [...ids];
  }
  const BROKER_IDS = collectBrokerIds();
  const MULTI_MODE = INDEX.mode === 'multi' || BROKER_IDS.length > 1;
  const BROKER_NAME = {};
  (INDEX.broker_filters || []).forEach(b => { if (b.id) BROKER_NAME[b.id] = b.name_zh || b.id; });
  if (INDEX.broker_id) BROKER_NAME[INDEX.broker_id] = INDEX.broker_name_zh || INDEX.broker_id;
  Object.values(BOARDS).forEach(board => {
    (board.reports || []).forEach(r => {
      if (r.broker_id) BROKER_NAME[r.broker_id] = r.broker_name_zh || BROKER_NAME[r.broker_id] || r.broker_id;
    });
  });

  let expandedReportId = '';
  let brokerFilter = 'all';
  let folderFilter = 'all';
  let selectedStock = '';
  let stockSearchQuery = '';
  let selectedHotspot = '';
  let hotspotSearchQuery = '';
  let morningRange = null;
  let reportRange = null;

  function createDateRange(prefix, getAvailDates, options = {}) {
    const fallbackMonth = (INDEX.calendar.months_with_data || []).slice(-1)[0] || '2026-07';
    const state = {
      all: false,
      start: '',
      end: '',
      pending: '',
      monthKey: fallbackMonth
    };
    function bounds() {
      if (state.all) return { start: '', end: '', all: true };
      if (!state.start && !state.end) return { start: '', end: '', all: false };
      const a = state.start || state.end;
      const b = state.end || state.start;
      return a <= b ? { start: a, end: b, all: false } : { start: b, end: a, all: false };
    }
    function selectedDates() {
      const avail = getAvailDates();
      if (state.all) return avail;

  const glossKeys = Object.keys(GLOSSARY).sort((a,b) => b.length - a.length);
  const glossByFirst = {};
  glossKeys.forEach(k => { const f = k[0]; (glossByFirst[f] ||= []).push(k); });
  function glossIsAscii(s) { return /^[A-Za-z0-9][A-Za-z0-9./+\-]*$/.test(s); }
  function glossIsAlnum(ch) { return !!ch && /[A-Za-z0-9]/.test(ch); }

  function splitGloss(text) {
    const parts = []; let buf = ''; let i = 0;
    while (i < text.length) {
      const cands = glossByFirst[text[i]]; let matched = null;
      if (cands) {
        for (const term of cands) {
          if (!text.startsWith(term, i)) continue;
          if (glossIsAscii(term)) {
            const prev = i > 0 ? text[i-1] : '';
            const next = text[i + term.length] || '';
            if (glossIsAlnum(prev) || glossIsAlnum(next)) continue;
          }
          matched = term; break;
        }
      }
      if (matched) {
        if (buf) { parts.push({text: buf}); buf = ''; }
        parts.push({text: matched, term: matched});
        i += matched.length;
      } else { buf += text[i]; i++; }
    }
    if (buf) parts.push({text: buf});
    return parts;
  }

  function renderGlossSegmentHtml(inner) {
    return splitGloss(inner).map(p => {
      if (p.term && GLOSSARY[p.term]) {
        const plain = GLOSSARY[p.term].plain.replace(/"/g, '&quot;');
        return `<span class="gloss-term" tabindex="0" data-term="${p.term}" data-plain="${plain}">${escapeHtml(p.text)}</span>`;
      }
      return escapeHtml(p.text);
    }).join('');
  }

  function renderGlossHtml(text) {
    if (!text) return '';
    const re = /\*\*(.+?)\*\*/g;
    const segments = [];
    let last = 0;
    let m;
    while ((m = re.exec(text)) !== null) {
      if (m.index > last) segments.push({ bold: false, inner: text.slice(last, m.index) });
      segments.push({ bold: true, inner: m[1] });
      last = m.index + m[0].length;
    }
    if (last < text.length) segments.push({ bold: false, inner: text.slice(last) });
    if (segments.length === 0) segments.push({ bold: false, inner: text });
    return segments.map(seg =>
      seg.bold ? `<strong>${renderGlossSegmentHtml(seg.inner)}</strong>` : renderGlossSegmentHtml(seg.inner)
    ).join('');
  }

  function escapeHtml(s) {

  const tip = document.getElementById('gloss-tip');
  function showTip(el) {
